      flex: 1;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-word;
    }

    .techtree-shell[data-tree-skin="light"] .proj-node-desc {
      color: rgba(44, 68, 72, 0.68);
    }

    .proj-node-foot {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      /* 给右下角的「已完成 / 已隐藏」角标让位，避免与日期文字重叠 */
      padding-bottom: 13px;
    }

    .proj-node .proj-bar-track {
      background: rgba(255, 255, 255, 0.1);
      height: 6px;
    }

    .techtree-shell[data-tree-skin="light"] .proj-node .proj-bar-track {
      background: rgba(70, 110, 115, 0.14);
    }

    .proj-node .proj-bar-pct {
      color: #CFDCDD;
      font-size: 0.66rem;
      min-width: 34px;
    }

    .techtree-shell[data-tree-skin="light"] .proj-node .proj-bar-pct {
      color: #2C4A52;
    }

    .proj-node-date {
      font-size: 0.58rem;
      font-weight: 700;
      font-family: var(--v4-mono);
      color: rgba(190, 215, 220, 0.6);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }

    .techtree-shell[data-tree-skin="light"] .proj-node-date {
      color: rgba(44, 68, 72, 0.62);
    }

    .proj-node-actions {
      position: absolute;
      top: 6px;
      right: 6px;
      display: flex;
      gap: 3px;
      opacity: 0;
      transition: opacity 0.18s ease;
      z-index: 3;
    }

    .proj-node:hover .proj-node-actions,
    .proj-node.is-manual-hidden .proj-node-actions,
    .proj-node.is-archived .proj-node-actions {
      opacity: 1;
    }

    .proj-node-act {
      width: 21px;
      height: 21px;
      border-radius: 6px;
      border: 1px solid rgba(140, 200, 210, 0.3);
      background: rgba(14, 20, 27, 0.86);
      color: rgba(215, 238, 242, 0.8);
      font-size: 0.7rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
      transition: background 0.16s ease, color 0.16s ease, transform 0.1s ease;
    }

    .proj-node-act:hover {
      background: rgba(95, 201, 201, 0.3);
      color: #D5E6E6;
      transform: scale(1.08);
    }

    .proj-node-act.is-danger:hover {
      background: rgba(232, 138, 134, 0.32);
      color: #FFD4D1;
    }

    .techtree-shell[data-tree-skin="light"] .proj-node-act {
      background: rgba(255, 255, 255, 0.94);
      border-color: rgba(70, 130, 135, 0.3);
      color: #35626A;
    }

    /* 节点上的「已隐藏」小标记 */
    .proj-node-flag {
      position: absolute;
      left: 8px;
      bottom: 5px;
      font-size: 0.55rem;
      font-weight: 700;
      font-family: var(--v4-mono);
      padding: 1px 6px;
      border-radius: 999px;
      background: rgba(20, 26, 34, 0.9);
      border: 1px dashed rgba(150, 165, 180, 0.5);
      color: rgba(200, 220, 225, 0.82);
      z-index: 3;
      max-width: calc(100% - 16px);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      pointer-events: none;
    }

    .techtree-shell[data-tree-skin="light"] .proj-node-flag {
      background: rgba(255, 255, 255, 0.94);
      color: #5A6B72;
      border-color: rgba(90, 120, 130, 0.4);
    }

    /* ---- 详情抽屉 ---- */
    .techtree-detail {
      position: absolute;
      right: 14px;
      top: 96px;
      width: 292px;
      max-height: calc(100% - 118px);
      overflow: auto;
      z-index: 12;
      border-radius: 14px;
      padding: 13px 14px;
      background: rgba(16, 23, 30, 0.96);
      border: 1px solid rgba(120, 190, 200, 0.3);
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.44);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      gap: 9px;
      animation: v4DrawerIn 0.22s cubic-bezier(0.16, 1, 0.3, 1);
      color: #DFE5E6;
    }

    @keyframes v4DrawerIn {
      from {
        opacity: 0;
        transform: translateX(14px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    .techtree-shell[data-tree-skin="light"] .techtree-detail {
      background: rgba(252, 254, 254, 0.98);
      border-color: rgba(70, 130, 135, 0.3);
      color: #24424A;
    }

    .techtree-detail-title {
      font-family: var(--font-serif);
      font-size: 0.98rem;
      font-weight: 700;
      line-height: 1.3;
      word-break: break-word;
    }

    .techtree-detail-row {
      display: flex;
      gap: 8px;
      font-size: 0.74rem;
      line-height: 1.5;
      align-items: flex-start;
    }

    .techtree-detail-row .k {
      flex-shrink: 0;
      min-width: 52px;
      font-weight: 700;
      font-family: var(--v4-mono);
      color: rgba(190, 215, 220, 0.62);
    }

    .techtree-shell[data-tree-skin="light"] .techtree-detail-row .k {
      color: rgba(44, 68, 72, 0.6);
    }

    .techtree-detail-row .v {
      min-width: 0;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .techtree-detail-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 3px;
      padding-top: 9px;
      border-top: 1px dashed rgba(140, 200, 210, 0.24);
    }

    .techtree-detail .v4-btn {
      border-color: rgba(140, 200, 210, 0.24);
      background: rgba(255, 255, 255, 0.05);
      color: rgba(215, 238, 242, 0.86);
    }

    .techtree-detail .v4-btn:hover {
      background: rgba(95, 201, 201, 0.2);
      color: #B8F0F0;
    }

    .techtree-shell[data-tree-skin="light"] .techtree-detail .v4-btn {
      border-color: rgba(70, 130, 135, 0.26);
      background: rgba(255, 255, 255, 0.8);
      color: #3A5A5E;
    }

    /* ---- 背景设置浮层 ---- */
    .techtree-bg-panel {
      position: absolute;
      right: 14px;
      top: 52px;
      width: 268px;
      z-index: 20;
      border-radius: 13px;
      padding: 12px 13px;
      background: rgba(16, 23, 30, 0.97);
      border: 1px solid rgba(120, 190, 200, 0.3);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
      display: flex;
      flex-direction: column;
      gap: 9px;
      color: #DFE5E6;
      animation: v4DrawerIn 0.2s ease;
    }

    .techtree-shell[data-tree-skin="light"] .techtree-bg-panel {
      background: rgba(252, 254, 254, 0.98);
      border-color: rgba(70, 130, 135, 0.3);
      color: #24424A;
    }

    .techtree-bg-panel .v4-btn {
      border-color: rgba(140, 200, 210, 0.24);
      background: rgba(255, 255, 255, 0.05);
      color: rgba(215, 238, 242, 0.86);
    }

    .techtree-shell[data-tree-skin="light"] .techtree-bg-panel .v4-btn {
      border-color: rgba(70, 130, 135, 0.26);
      background: rgba(255, 255, 255, 0.8);
      color: #3A5A5E;
    }

    .v4-skin-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .v4-skin-opt {
      flex: 1;
      min-width: 68px;
      padding: 7px 6px;
      border-radius: 9px;
      border: 1px solid rgba(140, 200, 210, 0.24);
      background: rgba(255, 255, 255, 0.05);
      color: rgba(215, 238, 242, 0.84);
      font-size: 0.7rem;
      font-weight: 700;
      font-family: var(--v4-mono);
      cursor: pointer;
      text-align: center;
      transition: all 0.18s ease;
    }

    .v4-skin-opt:hover {
      background: rgba(95, 201, 201, 0.18);
    }

    .v4-skin-opt.active {
      background: rgba(95, 201, 201, 0.26);
      border-color: rgba(95, 201, 201, 0.6);
      color: #D5E6E6;
    }

    .techtree-shell[data-tree-skin="light"] .v4-skin-opt {
      border-color: rgba(70, 130, 135, 0.26);
      background: rgba(255, 255, 255, 0.8);
      color: #3A5A5E;
    }

    .techtree-shell[data-tree-skin="light"] .v4-skin-opt.active {
      background: rgba(46, 158, 158, 0.2);
      color: #1F6B6B;
    }

    .v4-input {
      width: 100%;
      box-sizing: border-box;
      height: 30px;
      padding: 0 9px;
      border-radius: 8px;
      border: 1px solid rgba(140, 200, 210, 0.26);
      background: rgba(255, 255, 255, 0.06);
      color: inherit;
      font-size: 0.74rem;
      font-family: var(--v4-mono);
      outline: none;
    }

    .v4-input:focus {
      border-color: rgba(95, 201, 201, 0.6);
    }

    .techtree-shell[data-tree-skin="light"] .v4-input {
      border-color: rgba(70, 130, 135, 0.28);
      background: #fff;
      color: #24424A;
    }

    .v4-textarea {
      width: 100%;
      box-sizing: border-box;
      min-height: 62px;
      padding: 7px 9px;
      border-radius: 8px;
      border: 1px solid var(--v4-line);
      background: var(--v4-card-bg);
      color: var(--v4-ink);
      font-size: 0.76rem;
      font-family: inherit;
      line-height: 1.5;
      outline: none;
      resize: vertical;
    }

    .v4-textarea:focus {
      border-color: rgba(108, 92, 231, 0.5);
    }

    /* ==========================================================================
       二、常态收益
       ========================================================================== */
    .income-toolbar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 7px;
      margin-bottom: 10px;
    }

    .income-toolbar .v4-btn {
      height: 26px;
      font-size: 0.68rem;
    }

    .income-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .income-item {
      border: 1px solid var(--v4-line);
      border-left: 3px solid var(--v4-cyan);
      border-radius: 11px;
      padding: 9px 12px;
      background: var(--v4-card-bg);
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .income-item:hover {
      box-shadow: 0 3px 14px rgba(59, 66, 89, 0.07);
    }

    .income-item.is-consume {
      border-left-color: var(--v4-amber);
    }

    .income-item.is-abstract {
      border-left-color: var(--v4-sub);
      background: linear-gradient(90deg, rgba(120, 128, 145, 0.05), transparent 60%);
    }

    .income-item-top {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
      flex-wrap: wrap;
    }

    .income-flow {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.86rem;
      font-weight: 700;
      color: var(--v4-ink);
      min-width: 0;
      font-family: var(--v4-mono);
    }

    .income-flow .qty {
      font-size: 0.94rem;
      font-weight: 700;
    }

    .income-flow .qty.pos {
      color: var(--v4-green);
    }

    .income-flow .qty.neg {
      color: var(--v4-amber);
    }

    .income-flow .res {
      font-family: var(--font-serif);
      letter-spacing: 0.2px;
    }

    .income-flow .unit {
      font-size: 0.7rem;
      color: var(--v4-sub);
      font-weight: 700;
    }

    .income-item-actions {
      margin-left: auto;
      display: flex;
      gap: 5px;
      flex-shrink: 0;
    }

    .income-item-actions .v4-btn {
      height: 24px;
      padding: 0 8px;
      font-size: 0.66rem;
    }

    .income-src {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 0.68rem;
      color: var(--v4-sub);
      font-family: var(--v4-mono);
    }

    .income-src i {
      font-size: 0.8rem;
      opacity: 0.8;
    }

    .income-raw {
      font-size: 0.7rem;
      color: var(--v4-sub);
      line-height: 1.5;
      word-break: break-word;
      padding: 5px 8px;
      border-radius: 7px;
      background: rgba(59, 66, 89, 0.035);
      border-left: 2px solid var(--v4-line);
      opacity: 0.9;
    }

    body:is([data-theme="dark"], [data-theme="classic-dark"]) .income-raw {
      background: rgba(255, 255, 255, 0.04);
    }

    .income-section-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.72rem;
      font-weight: 700;
      font-family: var(--v4-mono);
      color: var(--v4-sub);
      letter-spacing: 0.4px;
      margin: 12px 0 7px;
    }

    .income-section-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--v4-line);
    }

    /* ==========================================================================
       三、资产总库存
       ========================================================================== */
    .inv-panel {
      border: 1px solid var(--v4-line);
      border-radius: 16px;
      overflow: hidden;
      background: var(--v4-card-bg);
      box-shadow: 0 2px 12px rgba(59, 66, 89, 0.05);
      margin-bottom: 14px;
    }

    .inv-panel.is-open {
      border-color: rgba(46, 158, 158, 0.34);
      box-shadow: 0 6px 24px rgba(46, 158, 158, 0.1);
    }

    .inv-head {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 15px;
      cursor: pointer;
      user-select: none;
      background: linear-gradient(100deg, var(--v4-cyan-soft), transparent 62%);
      transition: background 0.2s ease;
    }

    .inv-head:hover {
      background: linear-gradient(100deg, rgba(46, 158, 158, 0.18), transparent 68%);
    }

    .inv-head-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.08rem;
      flex-shrink: 0;
      background: linear-gradient(140deg, rgba(46, 158, 158, 0.2), rgba(108, 92, 231, 0.16));
      color: var(--v4-cyan);
      border: 1px solid rgba(46, 158, 158, 0.24);
    }

    .inv-head-main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .inv-head-title-row {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .inv-head-title {
      font-family: var(--font-serif);
      font-size: 1.06rem;
      font-weight: 700;
      color: var(--v4-ink);
      letter-spacing: 0.3px;
      white-space: nowrap;
    }

    .inv-head-sub {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.7rem;
      color: var(--v4-sub);
      font-family: var(--v4-mono);
    }

    .inv-head-pool {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 1px;
      flex-shrink: 0;
    }

    .inv-pool-val {
      font-size: 1.16rem;
      font-weight: 700;
      font-family: var(--v4-mono);
      color: var(--v4-amber);
      line-height: 1.1;
      white-space: nowrap;
    }

    .inv-pool-label {
      font-size: 0.62rem;
      font-weight: 700;
      color: var(--v4-sub);
      letter-spacing: 0.4px;
      font-family: var(--v4-mono);
    }

    .inv-head-chevron {
      font-size: 1.2rem;
      color: var(--v4-sub);
      transition: transform 0.26s ease;
      flex-shrink: 0;
    }

    .inv-panel.is-open .inv-head-chevron {
      transform: rotate(180deg);
    }

    .inv-body {
      display: none;
      padding: 0 15px 15px;
      flex-direction: column;
      gap: 12px;
    }

    .inv-panel.is-open .inv-body {
      display: flex;
      animation: bizPaneFadeIn 0.24s ease;
    }

    /* 资金池卡片 */
    .inv-pool-card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 14px;
      border-radius: 13px;
      background: linear-gradient(120deg, var(--v4-amber-soft), transparent 68%);
      border: 1px solid rgba(201, 138, 43, 0.24);
      flex-wrap: wrap;
    }

    .inv-pool-glyph {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.16rem;
      background: rgba(201, 138, 43, 0.16);
      color: var(--v4-amber);
      flex-shrink: 0;
      border: 1px solid rgba(201, 138, 43, 0.26);
    }

    .inv-pool-body {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .inv-pool-amount {
      font-size: 1.5rem;
      font-weight: 700;
      font-family: var(--v4-mono);
      color: var(--v4-amber);
      line-height: 1.1;
    }

    .inv-pool-note {
      font-size: 0.68rem;
      color: var(--v4-sub);
      font-family: var(--v4-mono);
      line-height: 1.4;
    }

    .inv-pool-actions {
      margin-left: auto;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    /* 区块 */
    .inv-section {
      border: 1px solid var(--v4-line);
      border-radius: 13px;
      overflow: hidden;
      background: var(--v4-panel-bg);
    }

    /* ★ v0.4.04 语义纠正：【隐藏】= 不写进变量（不给 AI 看），玩家照常看得见。
       所以不再用 opacity 把整块内容压暗到看不清，而是「虚化」：
       轻微降饱和 + 极轻模糊 + 虚线边框，内容依然清晰可读。 */
    .inv-section.is-unprojected {
      border-style: dashed;
      border-color: var(--v4-hidden-line);
      background: linear-gradient(0deg, var(--v4-hidden-bg), var(--v4-hidden-bg)), var(--v4-panel-bg);
    }

    /* 只虚化数据区，区块头保持清晰（否则按钮也跟着糊，点起来费劲） */
    .inv-section.is-unprojected .inv-sec-body {
      filter: saturate(0.4) blur(0.6px);
      opacity: 0.72;
    }

    /* 鼠标悬浮时恢复清晰，方便查看 / 操作 */
    .inv-section.is-unprojected:hover .inv-sec-body {
      filter: none;
      opacity: 1;
      transition: filter 0.2s ease, opacity 0.2s ease;
    }

    /* 兼容旧档残留的 .is-hidden（v4.04 起不再输出，仅防御性保留） */
    .inv-section.is-hidden {
      opacity: 0.55;
      filter: saturate(0.35);
      border-style: dashed;
      border-color: var(--v4-hidden-line);
    }

    /* 区块头的「AI 可见 / 仅本地」角标 */
    .inv-sec-flag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.62rem;
      font-weight: 700;
      padding: 1px 7px;
      border-radius: 7px;
      font-family: var(--v4-mono);
      background: rgba(120, 128, 145, 0.12);
      color: var(--v4-sub);
      border: 1px dashed var(--v4-hidden-line);
      white-space: nowrap;
    }

    .inv-section:not(.is-unprojected) .inv-sec-flag {
      background: rgba(46, 158, 158, 0.14);
      color: var(--v4-cyan);
      border: 1px solid rgba(46, 158, 158, 0.35);
    }

    /* 区块内的投影说明条 */
    .inv-proj-note {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      padding: 7px 10px;
      border-radius: 9px;
      font-size: 0.68rem;
      line-height: 1.5;
      font-family: var(--v4-mono);
      background: var(--v4-hidden-bg);
      border: 1px dashed var(--v4-hidden-line);
      color: var(--v4-sub);
    }

    .inv-proj-note i {
      flex-shrink: 0;
      margin-top: 1px;
      font-size: 0.86rem;
    }

    .inv-proj-note code {
      font-family: var(--v4-mono);
      font-size: 0.66rem;
      padding: 0 4px;
      border-radius: 4px;
      background: rgba(120, 128, 145, 0.16);
    }

    .inv-proj-note b {
      color: var(--v4-ink);
    }

    .inv-sec-head {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 12px;
      background: rgba(59, 66, 89, 0.028);
      cursor: pointer;
      user-select: none;
      transition: background 0.18s ease;
    }

    body:is([data-theme="dark"], [data-theme="classic-dark"]) .inv-sec-head {
      background: rgba(255, 255, 255, 0.035);
    }

    .inv-sec-head:hover {
      background: rgba(46, 158, 158, 0.1);
    }

    .inv-sec-title {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--v4-ink);
      font-family: var(--v4-mono);
      letter-spacing: 0.2px;
    }

    .inv-sec-title i {
      font-size: 0.92rem;
      color: var(--v4-cyan);
      opacity: 0.9;
    }

    .inv-sec-count {
      font-size: 0.64rem;
      font-weight: 700;
      padding: 1px 7px;
      border-radius: 7px;
      background: rgba(0, 0, 0, 0.055);
      color: var(--v4-sub);
      font-family: var(--v4-mono);
    }

    body:is([data-theme="dark"], [data-theme="classic-dark"]) .inv-sec-count {
      background: rgba(255, 255, 255, 0.07);
    }

    .inv-sec-tools {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .inv-sec-tools .v4-btn {
      height: 24px;
      padding: 0 8px;
      font-size: 0.64rem;
    }

    .inv-sec-chevron {
      font-size: 1rem;
      color: var(--v4-sub);
      transition: transform 0.22s ease;
      flex-shrink: 0;
    }

    .inv-section.is-collapsed .inv-sec-chevron {
      transform: rotate(-90deg);
    }

    .inv-sec-body {
      padding: 11px 12px 13px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .inv-section.is-collapsed .inv-sec-body {
      display: none;
    }

    /* 仓库表格 */
    /* ★ v0.4.05 分组区域可见化：
       整个 .inv-group 就是拖拽落点（data-inv-group-drop 挂在它身上），
       所以必须让玩家「看得见区域在哪」——虚线边框 + 淡底色。
       拖动进行中（body.v4-inv-dragging）时边框加亮，提示可以往哪拖。 */
    .inv-group {
      display: flex;
      flex-direction: column;
      gap: 7px;
      padding: 7px 8px 9px;
      border-radius: 11px;
      border: 1px dashed var(--v4-hidden-line);
      background: rgba(120, 128, 145, 0.035);
      transition: border-color 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
    }

    body:is([data-theme="dark"], [data-theme="classic-dark"]) .inv-group {
      background: rgba(255, 255, 255, 0.022);
    }

    .inv-group-head {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 0.72rem;
      font-weight: 700;
      font-family: var(--v4-mono);
      color: var(--v4-sub);
      letter-spacing: 0.3px;
      cursor: pointer;
      padding: 3px 2px;
      border-radius: 7px;
      transition: color 0.16s ease;
    }

    .inv-group-head:hover {
      color: var(--v4-violet);
    }

    /* ★ v0.4.05：整个分组区域现在是拖拽落点，光标给个「可放置」暗示。
       格子内部保持 grab（拖物资），按钮保持 pointer（由 .v4-btn 规则负责）。 */
    .inv-group {
      cursor: default;
    }

    .inv-group.is-drop-hover,
    body.v4-inv-dragging .inv-group {
      cursor: copy;
    }

    .inv-group-swatch {
      width: 10px;
      height: 10px;
      border-radius: 3px;
      flex-shrink: 0;
    }

    .inv-group-chevron {
      font-size: 0.92rem;
      transition: transform 0.2s ease;
    }

    .inv-group.is-collapsed .inv-group-chevron {
      transform: rotate(-90deg);
    }

    .inv-group.is-collapsed .inv-grid {
      display: none;
    }

    .inv-group-tools {
      margin-left: auto;
      display: flex;
      gap: 4px;
      opacity: 0;
      transition: opacity 0.18s ease;
    }

    .inv-group-head:hover .inv-group-tools {
      opacity: 1;
    }

    .inv-group-tools .v4-btn {
      height: 21px;
      padding: 0 6px;
      font-size: 0.6rem;
    }

    .inv-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(168px, 1fr));
      gap: 8px;
    }

    .inv-cell {
      border: 1px solid var(--v4-line);
      border-radius: 10px;
      padding: 8px 10px;
      background: var(--v4-card-bg);
      display: flex;
      flex-direction: column;
      gap: 3px;
      position: relative;
      transition: box-shadow 0.18s ease, border-color 0.18s ease;
    }

    .inv-cell:hover {
      border-color: rgba(46, 158, 158, 0.34);
      box-shadow: 0 3px 12px rgba(46, 158, 158, 0.09);
    }

    .inv-cell-name {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--v4-ink);
      line-height: 1.3;
      word-break: break-word;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .inv-cell-qty {
      font-size: 1.06rem;
      font-weight: 700;
      font-family: var(--v4-mono);
      color: var(--v4-cyan);
      line-height: 1.15;
    }

    .inv-cell-qty.low {
      color: var(--v4-red);
    }

    .inv-cell-unit {
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--v4-sub);
      margin-left: 3px;
    }

    .inv-cell-meta {
      font-size: 0.64rem;
      color: var(--v4-sub);
      font-family: var(--v4-mono);
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap;
    }

    .inv-cell-actions {
      position: absolute;
      top: 5px;
      right: 5px;
      display: flex;
      gap: 3px;
      opacity: 0;
      transition: opacity 0.16s ease;
    }

    .inv-cell:hover .inv-cell-actions {
      opacity: 1;
    }

    .inv-cell-actions .v4-btn {
      width: 21px;
      height: 21px;
      padding: 0;
      justify-content: center;
      font-size: 0.66rem;
    }

    /* ---------- v0.4.04 需求 1 / 2：物资级投影状态 + 拖拽 + 框选 ---------- */
    /* 未投影（不给 AI 看）的物资：本地照常显示，只是视觉淡化 + 左上角角标 */
    .inv-cell.is-unprojected {
      border-style: dashed;
      border-color: var(--v4-hidden-line);
      background: linear-gradient(0deg, var(--v4-hidden-bg), var(--v4-hidden-bg)), var(--v4-panel-bg);
    }

    .inv-cell.is-unprojected .inv-cell-name,
    .inv-cell.is-unprojected .inv-cell-qty {
      opacity: 0.72;
    }

    .inv-cell.is-unprojected .inv-cell-qty {
      color: var(--v4-sub);
    }

    /* 被单独【隐藏】的物资（区块已显示，但这一项被摘掉）：用角标 + 侧边虚线强调 */
    .inv-cell.is-excluded {
      border-left: 3px dashed var(--v4-hidden-line);
    }

    .inv-cell.is-excluded .inv-cell-flag {
      color: var(--v4-amber);
      opacity: 1;
    }

    /* 角标：AI 可见 / 仅本地
       注意：不能做成绝对定位 —— 会盖住 .inv-cell-meta 里的「手动 +30」等文字。
       这里作为 flex 子元素自然排布在最后一行。 */
    .inv-cell-flag {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      margin-top: 1px;
      font-size: 0.56rem;
      font-weight: 700;
      font-family: var(--v4-mono);
      color: var(--v4-sub);
      opacity: 0.85;
      pointer-events: none;
      white-space: nowrap;
    }

    .inv-cell.is-projected .inv-cell-flag {
      color: var(--v4-cyan);
    }

    /* 拖动中的物资 */
    .inv-cell.is-dragging {
      opacity: 0.42;
      border-style: dashed;
    }

    /* 可拖拽提示 */
    .inv-cell[draggable="true"] {
      cursor: grab;
    }

    .inv-cell.is-dragging,
    body.v4-inv-dragging .inv-cell[draggable="true"] {
      cursor: grabbing;
    }

    /* 拖拽落点高亮：★ v0.4.05 扩到「整块分组区域」（原来是只有分组头那一条细线）
       落点是 .inv-group 本身，所以高亮也做在 .inv-group 上。 */
    .inv-group.is-drop-hover {
      border-color: var(--v4-cyan);
      border-style: solid;
      background: rgba(46, 158, 158, 0.13);
      box-shadow: inset 0 0 0 1px rgba(46, 158, 158, 0.32), 0 4px 16px rgba(46, 158, 158, 0.14);
    }

    /* 兼容：分组头自己带 is-drop-hover 时也给个提示（旧写法 / 手动调试用） */
    .inv-group-head.is-drop-hover {
      color: var(--v4-cyan);
    }

    /* 拖动进行中：所有分组区域一起「亮边界」，告诉玩家可落点在哪 */
    body.v4-inv-dragging .inv-group {
      border-color: rgba(46, 158, 158, 0.45);
      background: rgba(46, 158, 158, 0.05);
    }

    body.v4-inv-dragging .inv-group-head {
      color: var(--v4-cyan);
    }

    /* 分组内落点提示条（拖动时才出现，避免平时占地方） */
    .inv-group-drop-hint {
      display: none;
      align-items: center;
      gap: 5px;
      font-size: 0.62rem;
      font-family: var(--v4-mono);
      color: var(--v4-cyan);
      padding: 2px 2px 0;
      opacity: 0.9;
    }

    body.v4-inv-dragging .inv-group-drop-hint {
      display: inline-flex;
    }

    .inv-group.is-drop-hover .inv-group-drop-hint {
      display: inline-flex;
    }

    /* 空分组的虚线占位框（拖物资到这里） */
    .inv-drop-placeholder {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 62px;
      border: 1px dashed var(--v4-hidden-line);
      border-radius: 10px;
      color: var(--v4-sub);
      font-size: 0.72rem;
      font-family: var(--v4-mono);
      opacity: 0.78;
      text-align: center;
      padding: 10px;
    }

    .inv-group.is-drop-hover .inv-drop-placeholder {
      border-color: var(--v4-cyan);
      color: var(--v4-cyan);
      opacity: 1;
    }

    /* 框选中的物资 */
    .inv-cell.is-selected {
      border-color: var(--v4-cyan);
      box-shadow: 0 0 0 2px rgba(46, 158, 158, 0.42), 0 3px 12px rgba(46, 158, 158, 0.16);
      background: rgba(46, 158, 158, 0.1);
    }

    /* ★ v0.4.05：点一下格子 = 切换选中（toggle），所以要有一个常驻的勾选框标记，
       让「这个格子可以点选」这件事一眼可见，不必靠猜。
       注意：勾选框是 .inv-cell-name 里的真实元素（不是绝对定位伪元素），
       否则会盖住物资名。 */
    .inv-cell {
      user-select: none;
    }

    .inv-cell-check {
      flex-shrink: 0;
      font-size: 0.82rem;
      line-height: 1;
      color: var(--v4-sub);
      opacity: 0.5;
      transition: opacity 0.16s ease, color 0.16s ease;
    }

    .inv-cell:hover .inv-cell-check {
      opacity: 0.9;
      color: var(--v4-cyan);
    }

    .inv-cell.is-selected .inv-cell-check {
      opacity: 1;
      color: var(--v4-cyan);
    }

    /* 框选矩形 */
    .inv-marquee {
      position: fixed;
      z-index: 9998;
      display: none;
      pointer-events: none;
      border: 1px solid var(--v4-cyan);
      background: rgba(46, 158, 158, 0.16);
      border-radius: 3px;
    }

    /* 框选工具条 */
    .inv-selbar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      padding: 6px 10px;
      border-radius: 9px;
      font-size: 0.66rem;
      font-family: var(--v4-mono);
      color: var(--v4-sub);
      background: rgba(120, 128, 145, 0.07);
      border: 1px dashed var(--v4-hidden-line);
      transition: background 0.18s ease, border-color 0.18s ease;
    }

    .inv-selbar.is-on {
      background: rgba(46, 158, 158, 0.12);
      border-color: rgba(46, 158, 158, 0.45);
      color: var(--v4-ink);
    }

    .inv-selbar-tip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      flex: 1;
      min-width: 180px;
      line-height: 1.45;
    }

    .inv-selbar-count b {
      color: var(--v4-cyan);
      font-size: 0.78rem;
    }

    .inv-selbar-actions {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-left: auto;
    }

    /* ★ v0.4.05：整批移动的备用入口 —— 选中后用下拉直接选目标分组，
       避免拖拽失败就彻底没辙（拖拽只是「快」，不是唯一路径）。 */
    .inv-move-wrap {
      position: relative;
      display: inline-flex;
      align-items: center;
    }

    .inv-move-menu {
      display: none;
      position: absolute;
      top: calc(100% + 4px);
      right: 0;
      z-index: 40;
      min-width: 148px;
      max-height: 232px;
      overflow-y: auto;
      padding: 5px;
      border-radius: 10px;
      border: 1px solid var(--v4-line);
      background: var(--v4-panel-bg);
      box-shadow: 0 10px 26px rgba(20, 24, 36, 0.18);
      flex-direction: column;
      gap: 2px;
    }

    .inv-move-menu.is-open {
      display: flex;
    }

    .inv-move-menu-title {
      font-size: 0.58rem;
      font-family: var(--v4-mono);
      color: var(--v4-sub);
      padding: 3px 7px 4px;
      opacity: 0.85;
      border-bottom: 1px dashed var(--v4-line);
      margin-bottom: 3px;
    }

    .inv-move-menu button {
      display: flex;
      align-items: center;
      gap: 6px;
      width: 100%;
      padding: 5px 8px;
      border: none;
      border-radius: 7px;
      background: transparent;
      color: var(--v4-ink);
      font-size: 0.68rem;
      font-family: var(--v4-mono);
      text-align: left;
      cursor: pointer;
      transition: background 0.14s ease;
    }

    .inv-move-menu button:hover {
      background: rgba(46, 158, 158, 0.14);
      color: var(--v4-cyan);
    }

    .inv-move-menu button .inv-move-swatch {
      width: 9px;
      height: 9px;
      border-radius: 3px;
      flex-shrink: 0;
    }

    .inv-move-menu button .inv-move-count {
      margin-left: auto;
      opacity: 0.6;
      font-size: 0.6rem;
    }

    /* 移入成功后的短暂闪烁反馈（避免只靠 toast） */
    .inv-group.is-flash {
      border-color: var(--v4-cyan);
      border-style: solid;
      box-shadow: 0 0 0 3px rgba(46, 158, 158, 0.18);
    }

    /* 未投影时按钮用中性色（表示「点了会写进变量」，而不是危险操作） */
    .v4-btn.is-muted {
      opacity: 0.72;
    }

    /* 未投影的流程行（消耗 / 产出 / 净总结） */
    .flow-row.is-unprojected .flow-name,
    .flow-row.is-unprojected .flow-qty {
      opacity: 0.7;
    }

    .flow-row.is-unprojected {
      border-left: 2px dashed var(--v4-hidden-line);
      padding-left: 6px;
    }

    /* 消耗 / 产出 行 */
    .flow-row {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 7px 10px;
      border-radius: 9px;
      background: rgba(59, 66, 89, 0.026);
      border-left: 3px solid var(--v4-line);
      font-size: 0.8rem;
      min-width: 0;
      flex-wrap: wrap;
    }

    body:is([data-theme="dark"], [data-theme="classic-dark"]) .flow-row {
      background: rgba(255, 255, 255, 0.035);
    }

    .flow-row.is-produce {
      border-left-color: var(--v4-green);
    }

    .flow-row.is-consume {
      border-left-color: var(--v4-amber);
    }

    .flow-row.is-net-pos {
      border-left-color: var(--v4-green);
      background: var(--v4-green-soft);
    }

    .flow-row.is-net-neg {
      border-left-color: var(--v4-amber);
      background: var(--v4-amber-soft);
    }

    .flow-name {
      font-weight: 700;
      color: var(--v4-ink);
      font-family: var(--font-serif);
      min-width: 0;
      word-break: break-word;
    }

    .flow-qty {
      font-weight: 700;
      font-family: var(--v4-mono);
      font-size: 0.86rem;
      white-space: nowrap;
    }

    .flow-qty.pos {
      color: var(--v4-green);
    }

    .flow-qty.neg {
      color: var(--v4-amber);
    }

    .flow-qty.zero {
      color: var(--v4-sub);
    }

    .flow-src {
      margin-left: auto;
      font-size: 0.66rem;
      color: var(--v4-sub);
      font-family: var(--v4-mono);
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 52%;
    }

    .inv-empty {
      text-align: center;
      padding: 14px 10px;
      font-size: 0.78rem;
      color: var(--v4-sub);
      opacity: 0.8;
    }

    .inv-net-summary {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* 隐藏区块的整体提示 */
    .inv-hidden-note {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 8px 11px;
      border-radius: 10px;
      background: var(--v4-hidden-bg);
      border: 1px dashed var(--v4-hidden-line);
      font-size: 0.72rem;
      color: var(--v4-sub);
      font-family: var(--v4-mono);
      line-height: 1.45;
    }

    .inv-hidden-note i {
      font-size: 0.9rem;
      flex-shrink: 0;
    }

    /* ---------- 小屏适配 ---------- */
    @media (max-width: 860px) {
      .proj-node {
        width: 180px;
        height: 106px;
      }

      .techtree-detail {
        width: 248px;
        right: 10px;
      }
    }

    @media (max-width: 700px) {
      .proj-summary {
        flex-wrap: wrap;
      }

      .proj-sum-cell {
        flex: 1 1 50%;
      }

      .proj-sum-cell+.proj-sum-cell::before {
        display: none;
      }

      .inv-grid {
        grid-template-columns: repeat(auto-fill, minmax(136px, 1fr));
      }

      .inv-pool-actions {
        margin-left: 0;
        width: 100%;
      }

      .inv-head {
        padding: 11px 12px;
        gap: 9px;
      }

      .inv-head-icon {
        width: 34px;

      function cleanBusinessText(raw) {

          .trim();

      function isEmptyBusinessValue(raw) {
        var text = cleanBusinessText(raw);

          .replace(/[;；,，。!！?？、:：]/g, '');
        var emptyWords = new Set([
          '无', '暂无', '空', '无产出', '暂无产出', '无固定产出', '无收益', '暂无收益',

              let obj = mvuData.stat_data;

      };
      // ==================== v0.3 【隐藏】待办存储（跨楼层持久） ====================
      // v0.2 的教训：隐藏项写进 MVU 变量的 display_data 后，一跨楼层就没了——

      const TODO_STORE_META_KEY = '经营待办隐藏';
      const TODO_STORE_LS_PREFIX = 'rpg_hidden_todos_v2::';
      const LEGACY_HIDDEN_TODO_KEY = '隐藏待办';        // v0.2 遗留在 MVU display_data 里的键名（仅用于迁移）
      const AUTO_SETTLEMENT_PREFIX = '【经营到期结算】';
      const TODO_HIDDEN_BY_DEFAULT = true;             // 默认启动【隐藏】：新生成的经营结算直接进隐藏区

      let _sweepDisabled = false;   // 存储不可用时永久停用自动隐藏（宁可多花 token，也不能让待办凭空消失）
      let _sweepWarned = false;
      const _sweptTexts = new Set();      // 本次会话已搬进隐藏区的条目，用于检测“搬走了又冒出来”的异常
      const _sessionWhitelist = new Set(); // 本次会话内点过【显示】的条目，即使存储写入失败也不会被立刻重新隐藏

      // 取 MVU 变量对象本体（含 stat_data）。
      // 注意：fetchLatestMvuData() 只返回 stat_data 本身，这里需要原始对象才能整体写回。
      const getRawMvuData = () => {
        try {
          if (!mvuState.ready && !mvuState.check()) return null;
          return mvuState.mvu.getMvuData({ type: 'message', message_id: 'latest' });
        } catch (e) { return null; }
      };

      // ---------- 存储后端 ----------
      const getStContext = () => {
        try {
          const ctx = getParent()?.SillyTavern?.getContext?.();
          if (ctx) return ctx;
        } catch (e) { }
        try { return window.SillyTavern?.getContext?.() || null; } catch (e) { return null; }
      };
      const getStChatMetadata = (ctx) => {
        if (!ctx) return null;
        if (ctx.chatMetadata && typeof ctx.chatMetadata === 'object') return ctx.chatMetadata;
        if (ctx.chat_metadata && typeof ctx.chat_metadata === 'object') return ctx.chat_metadata;
        return null;
      };
      // 按聊天分桶，避免不同存档的隐藏待办互相串台
      const getTodoChatTag = () => {
        let id = '';
        try {
          const ctx = getStContext();
          if (ctx) {
            id = ctx.chatId
              || (typeof ctx.getCurrentChatId === 'function' ? ctx.getCurrentChatId() : '')
              || getStChatMetadata(ctx)?.chat_id
              || (ctx.characters && ctx.characters[ctx.characterId] ? ctx.characters[ctx.characterId].name : '')
              || '';
          }
        } catch (e) { id = ''; }
        if (!id) { try { id = fetchLatestMvuData()?.人物?.名称 || ''; } catch (e) { } }
        const tag = String(id || 'default').replace(/\s+/g, '_').slice(0, 60);
        return tag || 'default';
      };
      const getTodoStorageKey = () => TODO_STORE_LS_PREFIX + getTodoChatTag();

      const emptyTodoStore = () => ({ rev: 0, hidden: {}, whitelist: [] });
      const normalizeTodoStore = (raw) => {
        const store = emptyTodoStore();
        if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return store;
        const rev = Number(raw.rev);
        store.rev = Number.isFinite(rev) ? rev : 0;
        if (typeof raw.chat === 'string') store.chat = raw.chat;
        if (raw.hidden && typeof raw.hidden === 'object' && !Array.isArray(raw.hidden)) {
          Object.entries(raw.hidden).forEach(([name, list]) => {
            if (!Array.isArray(list)) return;
            const texts = list.filter(v => typeof v === 'string' && v);
            if (texts.length > 0) store.hidden[name] = texts;
          });
        }
        if (Array.isArray(raw.whitelist)) {
          store.whitelist = raw.whitelist.filter(v => typeof v === 'string' && v);
        }
        return store;
      };

      const readMetaTodoStore = () => {
        try {
          const raw = getStChatMetadata(getStContext())?.[TODO_STORE_META_KEY];
          return raw ? normalizeTodoStore(raw) : null;
        } catch (e) { return null; }
      };
      const readLocalTodoStore = () => {
        try {
          const raw = localStorage.getItem(getTodoStorageKey());
          if (!raw) return null;
          const store = normalizeTodoStore(JSON.parse(raw));
          // 本地桶里记录了所属存档；对不上就当作无效（防止聊天标识取不到时串台）
          const tag = getTodoChatTag();
          if (store.chat && tag !== 'default' && store.chat !== tag) return null;
          return store;
        } catch (e) { return null; }
      };
      // v0.2 的遗留数据：display_data.隐藏待办（只在换到 v0.3 后的第一次读取时迁移一次）
      const readLegacyTodoStore = () => {
        try {
          const raw = getRawMvuData()?.display_data?.[LEGACY_HIDDEN_TODO_KEY];
          if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return null;
          const store = emptyTodoStore();
          Object.entries(raw).forEach(([name, list]) => {
            if (Array.isArray(list) && list.length > 0) store.hidden[name] = list.slice();
          });
          return Object.keys(store.hidden).length > 0 ? store : null;
        } catch (e) { return null; }
      };

      // 写入两个后端；chatMetadata 与 localStorage 任一成功即视为成功
      const writeTodoStore = (store) => {
        if (!store || typeof store !== 'object') return false;
        const meta = readMetaTodoStore();
        const local = readLocalTodoStore();
        const next = {
          rev: Math.max(meta?.rev || 0, local?.rev || 0, Number(store.rev) || 0) + 1,
          chat: getTodoChatTag(),
          hidden: store.hidden || {},
          whitelist: Array.isArray(store.whitelist) ? store.whitelist : []
        };
        store.rev = next.rev;
        let ok = false;

        try {
          const ctx = getStContext();
          const meta2 = getStChatMetadata(ctx);
          if (meta2) {
            meta2[TODO_STORE_META_KEY] = next;
            if (typeof ctx.saveMetadataDebounced === 'function') ctx.saveMetadataDebounced();
            else if (typeof ctx.saveMetadata === 'function') ctx.saveMetadata();
            else if (typeof getParent()?.saveMetadata === 'function') getParent().saveMetadata();
            ok = true;
          }
        } catch (e) { console.warn('[status-bar] 聊天元数据写入失败:', e); }

        try {
          localStorage.setItem(getTodoStorageKey(), JSON.stringify(next));
          ok = true;
        } catch (e) { console.warn('[status-bar] 本地存储写入失败:', e); }

        return ok;
      };

      // 读取：取 rev 更大的一份；两者都空则尝试从 v0.2 的 display_data 迁移
      const readTodoStore = () => {
        const meta = readMetaTodoStore();
        const local = readLocalTodoStore();
        let store = (meta && local) ? ((local.rev > meta.rev) ? local : meta) : (meta || local);
        if (!store) {
          const legacy = readLegacyTodoStore();
          if (legacy) {
            if (writeTodoStore(legacy)) {
              console.log('[status-bar] 已把 v0.2 遗留在 display_data 的隐藏待办迁移到持久存储');
              return legacy;
            }
            return legacy;
          }
          return emptyTodoStore();
        }
        return store;
      };

      // 修改存储：先深拷贝一份草稿，mutator 返回 false 则不写入
      const updateTodoStore = (mutator) => {
        const current = readTodoStore();
        const draft = {
          rev: current.rev,
          hidden: JSON.parse(JSON.stringify(current.hidden || {})),
          whitelist: (current.whitelist || []).slice()
        };
        if (mutator(draft) === false) return false;
        Object.keys(draft.hidden).forEach(name => {
          if (!Array.isArray(draft.hidden[name]) || draft.hidden[name].length === 0) delete draft.hidden[name];
        });
        return writeTodoStore(draft);
      };

      // 只读取出隐藏区，形如 { 资产名: [待办文本...] }，供渲染使用
      const getHiddenTodoMap = () => {
        const store = readTodoStore();
        const result = {};
        Object.entries(store.hidden || {}).forEach(([name, list]) => {
          if (Array.isArray(list) && list.length > 0) result[name] = list.slice();
        });
        return result;
      };

      // 统一的 stat_data 写回（隐藏项本身不在这里，这里只负责可见区）
      const applyTodoWrite = async (mutate) => {
        try {
          const mvuData = getRawMvuData();
          if (!mvuData || !mvuData.stat_data) return false;
          if (mutate(mvuData) === false) return false;
          await mvuState.mvu.replaceMvuData(mvuData, { type: 'message', message_id: 'latest' });
          return true;
        } catch (e) {
          console.warn('[status-bar] 待办变量写入失败:', e);
          return false;
        }
      };

      const isAutoSettlementTodo = (text) => typeof text === 'string' && text.startsWith(AUTO_SETTLEMENT_PREFIX);

      // ==========================================================================
      // v0.4 经营扩展核心引擎
      //   ├─ ① 非 MVU 持久化「经营扩展」存储（chatMetadata + localStorage 双写）
      //   ├─ ② 世界日期解析（*FMT：第5年3月8日 …）
      //   ├─ ③ 长线项目：进度计算 / 自动归档（已完成 → 移出 stat_data，不再发送给 AI）
      //   ├─ ④ 常态收益：从「建设序列.产出/功能」解析物产，物产在前、抽象在尾
      //   └─ ⑤ 资产总库存：拆解【经营到期结算】累计入库 + 每周消耗/产出/净总结
      //
      //  【隐藏】与【折叠】的严格区分（贯穿全部代码）：
      //    【隐藏】hide*   → 写非 MVU 存储 + 从 stat_data 摘除 → 下一轮不发送给 AI（省 token）
      //                      视觉：.v4-hidden-veil / .is-manual-hidden（明显变暗 + 斜纹 + 虚线 + 角标）
      //    【折叠】toggle* → 只改内存/存储里的 UI 状态，变量一个字都不动
      //                      视觉：仅箭头旋转 + 内容收起（不改变明暗语义）
      // ==========================================================================

      const V4_STORE_META_KEY = '经营扩展v4';
      const V4_STORE_LS_PREFIX = 'rpg_biz_ext_v4::';

      // ---------- 工具 ----------
      const v4Esc = (value) => String(value === undefined || value === null ? '' : value)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
      const v4Attr = (value) => v4Esc(value);
      const v4Num = (value, fallback) => {
        const n = Number(value);
        return Number.isFinite(n) ? n : (fallback === undefined ? 0 : fallback);
      };
      const v4Text = (value) => String(value === undefined || value === null ? '' : value).trim();
      const v4IsEmptyWord = (value) => {
        const t = v4Text(value).toLowerCase().replace(/\s+/g, '').replace(/[;；,，。!！?？、:：]/g, '');
        return !t || ['无', '暂无', '空', '无产出', '暂无产出', '无固定产出', '无收益', '暂无收益',
          'none', 'null', 'nil', 'n/a', 'na', '-', '--', '/'].includes(t);
      };
      // 稳定短哈希：用于【经营到期结算】去重
      const v4Hash = (str) => {
        let h = 5381;
        const s = String(str || '');
        for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) >>> 0;
        return h.toString(36);
      };
      const v4DeepCopy = (value) => {
        try { return JSON.parse(JSON.stringify(value)); } catch (e) { return null; }
      };
      const v4FmtQty = (n) => {
        const v = Number(n);
        if (!Number.isFinite(v)) return '0';
        if (Number.isInteger(v)) return String(v);
        return String(Math.round(v * 100) / 100);
      };
      const v4FmtSigned = (n) => {
        const v = Number(n);
        if (!Number.isFinite(v) || v === 0) return '0';
        return (v > 0 ? '+' : '') + v4FmtQty(v);
      };
      // ★ v0.4.06：货币缩写显示。
      //   资金池动辄上千万（AI 会写出 18560000 这种），原样铺在状态栏上会把布局撑坏。
      //   规则（用户拍板）：≥1万 起缩写、保留两位小数、去掉无意义的尾零。
      //     9999      → 9999
      //     18600     → 1.86万
      //     18560000  → 1856万
      //     2.5e8     → 2.5亿
      //   ⚠️ 只影响**界面显示**：写进 stat_data 的永远是完整数字（AI 拿精确值）。
      const v4FmtMoney = (n) => {
        const v = Number(n);
        if (!Number.isFinite(v)) return '0';
        const abs = Math.abs(v);
        if (abs < 10000) return v4FmtQty(v);
        const sign = v < 0 ? '-' : '';
        // 两位小数后去掉尾零（1856.00 → 1856，1.80 → 1.8）
        const trim = (num) => {
          const s = (Math.round(num * 100) / 100).toFixed(2).replace(/\.?0+$/, '');
          return s === '' || s === '-' ? '0' : s;
        };
        if (abs < 100000000) return sign + trim(abs / 10000) + '万';
        return sign + trim(abs / 100000000) + '亿';
      };
      const v4FmtMoneySigned = (n) => {
        const v = Number(n);
        if (!Number.isFinite(v) || v === 0) return '0';
        return (v > 0 ? '+' : '') + v4FmtMoney(v);
      };
      // 给缩写数字挂一个「完整数字」的 tooltip，鼠标悬停仍能看到精确值
      const v4MoneyTitle = (n) => {
        const v = Number(n);
        if (!Number.isFinite(v)) return '';
        return Math.abs(v) >= 10000 ? `完整数值：${v4FmtQty(v)}` : '';
      };
      const v4Today = () => {
        const d = new Date();
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      };

      // ---------- ① 存储后端 ----------
      const v4EmptyStore = () => ({
        rev: 0,
        projectHidden: {},    // { 资产名: { 项目名: <完整项目对象> } }  手动【隐藏】
        projectArchived: {},  // { 资产名: { 项目名: <完整项目对象> } }  已完成/已到期自动归档
        projectDeleted: {},   // { 资产名: { 项目名: true } }            已删除（防 AI 重写复活）
        projectKeep: {},      // { 资产名: { 项目名: true } }            玩家点过【显示】→ 不再被自动归档
        incomeHidden: {},     // { 资产名: { 序列名: <收益项> } }
        incomeEdits: {},      // { 资产名: { "序列名||序号": {qty,unit,resource,kind,polarity,note} } }
        incomeDeleted: {},    // { 资产名: { 序列名: true } }
        incomeManual: {},     // { 资产名: [ 自定义收益项 ] }
        inventory: {
          pool: 0,            // 资产专用资金池（通用币）——手动/结算累计值
          items: {},          // { 物资名: { qty, unit, group, note } }
          groups: [],         // [ { name, color } ]
          groupOf: {},        // { 物资名: 组名 }
          hiddenSections: [], // ['stock','consume','produce','net','pool']  ← v0.4.04 起废弃（保留仅为兼容旧档读取）
          // ★ v0.4.04 起【隐藏】的正确语义：**从变量里拿掉（不给 AI 看）**，
          //   而不是从玩家眼前拿掉。计算一律照常跑，只有下面两个字段决定
          //   「哪些内容被投影进 stat_data」。
          //
          //   两层控制（默认状态 = 全都不发给 AI，因为 shownSections 为空）：
          //     ① shownSections —— 区块级总开关：列出哪个区块才发送该区块的内容
          //     ② hiddenItems   —— 物资级例外：**在区块已显示的前提下**，把个别物资剔除
          //
          //   为什么物资用「例外名单」而不是「白名单」：
          //     需求 3 要求点区块【显示】就真的把变量发出去；若物资还要逐个再点【显示】，
          //     区块【显示】就会发出一个空的物资表，等于没发。
          //     所以物资默认**跟随区块**，需求 1 的按钮是【隐藏】（把个别项摘掉），
          //     这也正是需求原文「每项物资加【隐藏】按钮」的说法。
          shownSections: [],  // ['stock','consume','produce','net'] 只有列出的区块才写进变量
          hiddenItems: {},    // { 物资名: true } 在区块已显示时，仍要把这些物资剔除
          collapsedSections: [],
          collapsedGroups: [],
          manualConsume: [],  // [ { key, name, qty, unit, note } ]
          manualProduce: [],
          swept: {},          // { hash: { name, qty, unit, kind, asset, seq, text, at } }
          // v0.4.06：上次写进变量的资金池值（null = 还没有基线）。
          // 用来分辨「变量里的资金池是脚本自己写的」还是「AI / 玩家改的」——
          // 只有既不是这个值、也不是本次目标值时才算外部改动，脚本才会采纳（双向同步）。
          projectedPool: null,
          // v0.4.07：上次写进变量的「物资」投影快照（null = 还没有基线）。
          // 同样用来分辨外部改动，但物资是一个**表**，所以要按名字比对：
          //   · 变量里有、基线里没有 → 外部新增（AI 帮你记账）→ 采纳进本地库存
          //   · 两边都有但值不同     → 外部修改 → 采纳
          //   · 基线里有、变量里没有 → 外部删除 → 从本地库存删掉
          // 只有「物资」需要它（资金池用 projectedPool，其余区块仍是脚本单向负责）。
          projectedSnapshot: null,
          // ★ v1.0：上一轮是否真的把「物资表」投影出去了。
          //   只有为 true 时，才允许把「变量里少了某项」当成 AI 的删除动作 ——
          //   否则区块刚点【显示】的那一轮会被误判成「AI 删光了库存」，实测会把玩家仓库删空。
          projectedStockActive: false,
          open: false         // 【折叠】状态：资产总库存面板是否展开
        },
        techTree: { skin: 'deep', customBg: '', pos: {} },
        ui: {}                // 通用【折叠】状态：{ key: bool }
      });

      const v4NormalizeStore = (raw) => {
        const store = v4EmptyStore();
        if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return store;
        store.rev = v4Num(raw.rev, 0);
        if (typeof raw.chat === 'string') store.chat = raw.chat;
        ['projectHidden', 'projectArchived', 'projectDeleted', 'projectKeep', 'incomeHidden',
          'incomeEdits', 'incomeDeleted', 'incomeManual'].forEach(key => {
            if (raw[key] && typeof raw[key] === 'object' && !Array.isArray(raw[key])) {
              store[key] = raw[key];
            }
          });
        // ★ v0.4.07：清掉旧版遗留的「手动项编辑覆盖」。
        //   旧版 v4EditIncome 对**手动项**也写 incomeEdits['__manual__||N']，
        //   但读取端从来没查过它（这正是用户反馈的问题 3a）。现在手动项改成
        //   直接改写 incomeManual[idx]（单一真相），这些历史脏数据必须丢弃 ——
        //   否则「编辑一次不生效、修好后又突然生效」会让人莫名其妙。
        if (store.incomeEdits && typeof store.incomeEdits === 'object') {
          Object.keys(store.incomeEdits).forEach(assetKey => {
            const table = store.incomeEdits[assetKey];
            if (!table || typeof table !== 'object') return;
            Object.keys(table).forEach(k => {
              if (String(k).startsWith('__manual__||')) delete table[k];
            });
            if (Object.keys(table).length === 0) delete store.incomeEdits[assetKey];
          });
        }
        if (raw.inventory && typeof raw.inventory === 'object' && !Array.isArray(raw.inventory)) {
          const inv = raw.inventory;
          store.inventory.pool = v4Num(inv.pool, 0);
          if (inv.items && typeof inv.items === 'object' && !Array.isArray(inv.items)) store.inventory.items = inv.items;
          if (Array.isArray(inv.groups)) store.inventory.groups = inv.groups.filter(g => g && typeof g.name === 'string');
          if (inv.groupOf && typeof inv.groupOf === 'object' && !Array.isArray(inv.groupOf)) store.inventory.groupOf = inv.groupOf;
          ['hiddenSections', 'collapsedSections', 'collapsedGroups'].forEach(k => {
            if (Array.isArray(inv[k])) store.inventory[k] = inv[k].filter(v => typeof v === 'string');
          });
          // v0.4.04：投影控制字段。旧档的 hiddenSections 语义已反转（见 v4EmptyStore 注释），
          // 旧值一律不迁移 —— 迁移会让「旧档里被隐藏过的区块」在新语义下变成「显示」，
          // 与默认【隐藏】的设计相反。默认留空即可（= 什么都不发给 AI）。
          if (Array.isArray(inv.shownSections)) {
            store.inventory.shownSections = inv.shownSections.filter(v => typeof v === 'string');
          }
          if (inv.hiddenItems && typeof inv.hiddenItems === 'object' && !Array.isArray(inv.hiddenItems)) {
            const hidden = {};
            Object.keys(inv.hiddenItems).forEach(k => { if (inv.hiddenItems[k] === true) hidden[k] = true; });
            store.inventory.hiddenItems = hidden;
          }
          ['manualConsume', 'manualProduce'].forEach(k => {
            if (Array.isArray(inv[k])) store.inventory[k] = inv[k].filter(v => v && typeof v === 'object');
          });
          if (inv.swept && typeof inv.swept === 'object' && !Array.isArray(inv.swept)) store.inventory.swept = inv.swept;
          // v0.4.06：双向同步基线。旧档没有这个字段 → 保持 null（下次投影时补上）
          if (inv.projectedPool !== undefined && inv.projectedPool !== null) {
            store.inventory.projectedPool = v4Num(inv.projectedPool, 0);
          }
          // v0.4.07：物资投影基线（表）。旧档没有 → 保持 null（首次投影时补上，
          // 并且第一次不会把「基线缺失」误判成「外部新增」，见 v4SyncInventoryProjection）。
          if (inv.projectedSnapshot && typeof inv.projectedSnapshot === 'object' && !Array.isArray(inv.projectedSnapshot)) {
            store.inventory.projectedSnapshot = inv.projectedSnapshot;
          }
          // ★ v1.0：物资投影「是否处于激活状态」标记（旧档没有 → false，首轮不判删除）
          if (inv.projectedStockActive === true) store.inventory.projectedStockActive = true;
          store.inventory.open = inv.open === true;
        }
        if (raw.techTree && typeof raw.techTree === 'object' && !Array.isArray(raw.techTree)) {
          store.techTree.skin = ['deep', 'light', 'nebula'].includes(raw.techTree.skin) ? raw.techTree.skin : 'deep';
          store.techTree.customBg = typeof raw.techTree.customBg === 'string' ? raw.techTree.customBg : '';
          if (raw.techTree.pos && typeof raw.techTree.pos === 'object') store.techTree.pos = raw.techTree.pos;
        }
        if (raw.ui && typeof raw.ui === 'object' && !Array.isArray(raw.ui)) store.ui = raw.ui;
        return store;
      };

      const v4ReadMetaStore = () => {
        try {
          const raw = getStChatMetadata(getStContext())?.[V4_STORE_META_KEY];
          return raw ? v4NormalizeStore(raw) : null;
        } catch (e) { return null; }
      };
      const v4ReadLocalStore = () => {
        try {
          const raw = localStorage.getItem(V4_STORE_LS_PREFIX + getTodoChatTag());
          if (!raw) return null;
          const store = v4NormalizeStore(JSON.parse(raw));
          const tag = getTodoChatTag();
          if (store.chat && tag !== 'default' && store.chat !== tag) return null;
          return store;
        } catch (e) { return null; }
      };
      const v4WriteStore = (store) => {
        if (!store || typeof store !== 'object') return false;
        const meta = v4ReadMetaStore();
        const local = v4ReadLocalStore();
        const next = Object.assign(v4EmptyStore(), store);
        next.rev = Math.max(meta?.rev || 0, local?.rev || 0, v4Num(store.rev, 0)) + 1;
        next.chat = getTodoChatTag();
        store.rev = next.rev;
        let ok = false;
        try {
          const ctx = getStContext();
          const metaObj = getStChatMetadata(ctx);
          if (metaObj) {
            metaObj[V4_STORE_META_KEY] = next;
            if (typeof ctx.saveMetadataDebounced === 'function') ctx.saveMetadataDebounced();
            else if (typeof ctx.saveMetadata === 'function') ctx.saveMetadata();
            else if (typeof getParent()?.saveMetadata === 'function') getParent().saveMetadata();
            ok = true;
          }
        } catch (e) { console.warn('[status-bar v4] 聊天元数据写入失败:', e); }
        try {
          localStorage.setItem(V4_STORE_LS_PREFIX + getTodoChatTag(), JSON.stringify(next));
          ok = true;
        } catch (e) { console.warn('[status-bar v4] 本地存储写入失败:', e); }
        if (ok) _v4StoreCache = next;   // 写成功后直接用新值刷新缓存
        return ok;
      };
      // 读取：取 rev 更大的一份。渲染期间会高频调用，加一层进程内缓存，写入时失效。
      let _v4StoreCache = null;
      const v4ReadStore = () => {
        if (_v4StoreCache) return _v4StoreCache;
        const meta = v4ReadMetaStore();
        const local = v4ReadLocalStore();
        let result;
        if (meta && local) result = local.rev > meta.rev ? local : meta;
        else result = meta || local || v4EmptyStore();
        _v4StoreCache = result;
        return result;
      };
      const v4InvalidateStoreCache = () => { _v4StoreCache = null; };
      // 修改：草稿 → 校验 → 写入。mutator 返回 false 则不落盘
      const v4UpdateStore = (mutator) => {
        const current = v4ReadStore();
        const draft = v4DeepCopy(current) || v4EmptyStore();
        draft.inventory = Object.assign(v4EmptyStore().inventory, draft.inventory || {});
        if (mutator(draft) === false) return false;
        return v4WriteStore(draft);
      };
      // 供 build / 事件层在外部改动 MVU 变量后强制重读存储
      const v4ReloadStore = () => { _v4StoreCache = null; return v4ReadStore(); };
      // UI【折叠】状态（纯视觉，变量层完全不动）
      const v4GetUi = (key, fallback) => {
        const ui = v4ReadStore().ui || {};
        return Object.prototype.hasOwnProperty.call(ui, key) ? ui[key] === true : fallback === true;
      };
      const v4SetUi = (key, value) => {
        const current = v4ReadStore();
        if ((current.ui?.[key] === true) === (value === true)) return true;
        return v4UpdateStore((draft) => {
          if (!draft.ui || typeof draft.ui !== 'object') draft.ui = {};
          draft.ui[key] = value === true;
          return true;
        });
      };

      // ---------- ② 世界日期解析 ----------
      // 支持：第5年3月8日 / 5年3月8日 / 第5年3月8日 辰时 / 3月8日 / 第12日 …
      // 统一折算为「天数序号」，用于进度分子分母。默认 12 月 × 30 日 = 360 日/年。
      const V4_MONTH_DAYS = 30;
      const V4_MONTHS_PER_YEAR = 12;
      const v4ParseWorldDate = (raw) => {
        const text = v4Text(raw);
        if (!text || v4IsEmptyWord(text)) return null;
        const m = text.match(/(?:第)?\s*(\d{1,4})\s*年\s*(?:第)?\s*(\d{1,2})\s*月\s*(?:第)?\s*(\d{1,2})\s*日?/);
        if (m) {
          const y = v4Num(m[1], 0), mo = v4Num(m[2], 1), d = v4Num(m[3], 1);
          return {
            y, m: mo, d,
            ordinal: ((y * V4_MONTHS_PER_YEAR) + Math.max(0, mo - 1)) * V4_MONTH_DAYS + Math.max(0, d - 1),
            raw: text
          };
        }
        const m2 = text.match(/(?:第)?\s*(\d{1,2})\s*月\s*(?:第)?\s*(\d{1,2})\s*日/);
        if (m2) {
          const mo = v4Num(m2[1], 1), d = v4Num(m2[2], 1);
          return { y: 0, m: mo, d, ordinal: (Math.max(0, mo - 1)) * V4_MONTH_DAYS + Math.max(0, d - 1), raw: text };
        }
        return null;
      };
      // 当前世界时间 → 解析结果（含 raw，供界面显示）
      const v4CurrentWorldDate = () => {
        try {
          const data = fetchLatestMvuData() || {};
          const info = data.世界信息 || {};
          const candidates = [info.时间, info.年历, info.日期, data.时间];
          for (const c of candidates) {
            const parsed = v4ParseWorldDate(c);
            if (parsed) return parsed;
          }
        } catch (e) { }
        return null;
      };
      // 当前世界时间 → 天数序号（进度计算的基准）。
      // 注意：必须返回数字，否则与结束日期的序号比较会静默失败（NaN）
      const v4CurrentWorldOrdinal = () => {
        const parsed = v4CurrentWorldDate();
        return parsed ? parsed.ordinal : null;
      };

      // ---------- ③ 长线项目 ----------
      const v4NormalizeProject = (name, proj) => {
        const p = (proj && typeof proj === 'object' && !Array.isArray(proj)) ? proj : { 描述: v4Text(proj) };
        // 注意：所有取值都要先判空，否则 0 / false 会被 v4Text 的「空」判断误伤
        const pick = (keys) => {
          for (const k of keys) {
            if (p[k] !== undefined && p[k] !== null && v4Text(p[k]) !== '') return p[k];
          }
          return null;
        };
        const start = v4Text(pick(['开始日期', '起始日期', '开始时间', '开始']) || '');
        const end = v4Text(pick(['结束日期', '完成日期', '预计完成', '结束时间', '结束']) || '');
        const status = v4Text(pick(['状态', '阶段', '进度状态']) || '进行中');
        const branch = v4Text(pick(['分支', '方向', '类别', '类型']) || '主线') || '主线';
        const desc = v4Text(pick(['描述', '说明', '简介', '内容', '目标']) || '');
        const output = v4Text(pick(['产出', '收益', '奖励']) || '');
        const note = v4Text(pick(['备注', '注记']) || '');
        let pre = pick(['前置', '前置项目', '前置条件', '前置科技']);
        if (pre === null) pre = [];
        if (typeof pre === 'string') pre = pre.split(/[、,，;；\/|]/).map(s => s.trim()).filter(Boolean);
        if (!Array.isArray(pre)) pre = [];
        pre = pre.map(x => v4Text(x)).filter(Boolean);
        const levelRaw = pick(['层级', '层', '阶', '位阶']);
        const progressRaw = pick(['进度', '完成度']);
        let progressNum = null;
        if (progressRaw !== null) {
          const ptext = v4Text(progressRaw);
          const pm = ptext.match(/-?\d+(?:\.\d+)?/);
          if (pm) {
            let v = Number(pm[0]);
            if (ptext.includes('%') || v > 1) v = v / 100;
            progressNum = Math.max(0, Math.min(1, v));
          }
        }
        const levelNum = levelRaw === null ? null : (Number.isFinite(Number(levelRaw)) ? Number(levelRaw) : null);
        return {
          name, desc, branch, status, start, end, output, note, pre,
          level: levelNum,
          progressRaw: progressNum,
          raw: p
        };
      };
      // 进度计算：
      //   有开始+结束日期 → (now − start) / (end − start)；未开始固定 0%
      //   无日期 → 用 AI 回复的「进度」字段（不由脚本控制）
      const v4ComputeProgress = (proj, nowOrdinal) => {
        const s = v4ParseWorldDate(proj.start);
        const e = v4ParseWorldDate(proj.end);
        if (s && e) {
          const span = e.ordinal - s.ordinal;
          if (span > 0) {
            if (nowOrdinal === null) return { ratio: 0, mode: 'date', done: false, notStarted: true };
            if (nowOrdinal < s.ordinal) return { ratio: 0, mode: 'date', done: false, notStarted: true };
            if (nowOrdinal >= e.ordinal) return { ratio: 1, mode: 'date', done: true, notStarted: false };
            return { ratio: (nowOrdinal - s.ordinal) / span, mode: 'date', done: false, notStarted: false };
          }
          if (span === 0) {
            // 同一天开始并结束 = 一次性项目：到日子就算完成
            const done = nowOrdinal !== null && nowOrdinal >= e.ordinal;
            return { ratio: done ? 1 : 0, mode: 'date', done, notStarted: !done };
          }
          // span < 0：结束早于开始 = AI 把日期写反了。这种畸形区间不参与进度计算，
          // 也不据此自动归档，否则一个正在进行的项目会被误判成「已完成」而移出变量。
        }
        // 无有效日期区间：交给 AI 的「进度」字段
        if (proj.progressRaw !== null) {
          const r = Math.max(0, Math.min(1, proj.progressRaw));
          return { ratio: r, mode: 'manual', done: r >= 1, notStarted: false };
        }
        const isDone = /已完成|完成|已结束|结束|已达成/.test(proj.status);
        return { ratio: isDone ? 1 : 0, mode: 'manual', done: isDone, notStarted: !isDone };
      };
      // 是否应自动归档：到期（按结束日期）或状态标记已完成
      const v4ShouldArchive = (proj, nowOrdinal, progress) => {
        if (/已完成|已结束|已达成|已完工/.test(proj.status)) return true;
        if (progress && progress.done && progress.mode === 'date') return true;
        const s = v4ParseWorldDate(proj.start);
        const e = v4ParseWorldDate(proj.end);
        // 日期区间必须有效才据此归档；起止写反时不自动隐藏
        if (e && nowOrdinal !== null && (!s || e.ordinal >= s.ordinal) && nowOrdinal >= e.ordinal) return true;
        return false;
      };

      // 只读汇总：某个资产的长线项目（可见 / 手动隐藏 / 已归档）
      // 关键：同一个项目名同时出现在「变量」和「隐藏/归档备份」里时只保留一份，
      // 否则玩家点了【隐藏】而 AI 又把该项目写回变量时，页面上会出现两个同名项目。
      const v4CollectProjects = (assetName, asset, store) => {
        const visible = [];
        const source = (asset && typeof asset.长线项目 === 'object' && asset.长线项目) ? asset.长线项目 : {};
        const hiddenMap = (store.projectHidden && store.projectHidden[assetName]) || {};
        const archivedMap = (store.projectArchived && store.projectArchived[assetName]) || {};
        const deletedMap = (store.projectDeleted && store.projectDeleted[assetName]) || {};
        const backedUp = new Set(
          Object.keys(hiddenMap).concat(Object.keys(archivedMap)).filter(n => !deletedMap[n])
        );
        Object.entries(source).forEach(([name, proj]) => {
          if (backedUp.has(name)) return;   // 备份里已有 → 只显示备份那一份（带隐藏/归档视觉）
          visible.push(v4NormalizeProject(name, proj));
        });
        const hidden = Object.entries(hiddenMap)
          .filter(([n]) => !deletedMap[n])
          .map(([n, p]) => v4NormalizeProject(n, p));
        const archived = Object.entries(archivedMap)
          .filter(([n]) => !deletedMap[n])
          .map(([n, p]) => v4NormalizeProject(n, p));
        return { visible, hidden, archived, deleted: deletedMap };
      };

      // ---------- ④ 常态收益解析 ----------
      // ★ v0.4.11：补 4 个真实存档里用到、但原来漏掉的量词（见 _name_map.json 的 P1/P2/P3 与「另需注意」）：
      //   米 —— 「高锰重轨×600米」；缺了它，reA 匹配不上，reD 又会把「600米」切成 60 + 「0米」
      //   刀 —— 「标准草木硬纸×600刀」（纸的计量单位）
      //   挺 —— 「MG08阵地重机枪×1.2挺」（机枪的量词）
      //   面 —— 「镀银穿衣镜150面」
      //   注意必须**追加在末尾**：交替式是「先匹配先赢」，把短词插到长词前面会截断长词
      //   （例如把「米」放到「毫升」前面，会让「毫升」退化成「毫」+「升」）。
      const V4_UNIT_PATTERN = '单位|公斤|千克|毫升|吨|克|斤|两|石|斗|升|个|件|份|枚|块|张|瓶|袋|箱|捆|把|柄|支|颗|本|册|套|台|辆|匹|头|只|条|束|组|批|名|人|点|座|间|栋|艘|门|发|桶|罐|盒|盘|锭|株|亩|里|次|枚|米|刀|挺|面';
      const V4_CURRENCY_EXACT = ['金', '银', '铜', '钱', '元', '文'];
      const V4_CURRENCY_WORDS = ['通用币', '金币', '银币', '铜币', '货币', '资金', '金库', '钱币'];
      const V4_ABSTRACT_WORDS = ['声望', '忠诚', '忠诚度', '好感', '好感度', '士气', '民心', '影响力', '经验', 'EXP',
        '技能点', '情报', '威望', '信仰', '名望', '幸福度', '满意度', '秩序', '治安', '繁荣度', '繁荣', '稳定度',
        '威慑', '威名', '气运', '运势', '声望值', '贡献', '贡献度', '亲和', '口碑', '知名度', '安全度', '防御力',
        '攻击力', '效率', '产能', '速度', '品质', '上限', '容量', '等级', '研究点', '科技点',
        // 能量类：不是可入库的「物产」，归入抽象/恒定收益
        '魔力', '灵力', '源力', '法力', '气力', '体力', '精力', '信仰值'];
      const V4_PRODUCE_WORDS = ['周产', '日产', '月产', '年产', '季产', '产出', '出产', '收益', '收入', '获得', '增加',
        '增产', '收获', '收取', '进账', '盈利', '赚取', '提供', '供给', '刷新', '补充', '回复', '恢复', '生成', '提炼', '加工出',
        // 「周节省通用币1200」这类：节省/节约也是正向收益，必须收进产出词，否则会被当成物资名
        '节省', '节约', '结余', '净赚', '净得'];
      const V4_CONSUME_WORDS = ['周耗', '日耗', '月耗', '年耗', '季耗', '消耗', '耗费', '损失', '支出', '维护',
        '开销', '扣除', '磨损', '花费', '支付', '上缴', '税', '耗', '需', '需要', '投入', '吃掉', '用掉', '占用'];
      // 去掉日期噪声：否则「第5年3月8日」里的数字会被当成物资数量
      const v4StripDateNoise = (text) => String(text || '')
        // ★ v0.4.11（P5）：先剥离千分位逗号。真实存档里 AI 写的是
        //   「收取排污清污处置费+3,000G」「周净盈余+328,000G」，
        //   逗号不断开数字的话，正则只能取到「3」/「328」，
        //   而且 V4_CURRENCY_SUFFIX_RE 也匹配不到「,000G」→ 钱被当成物资。
        //   这个正则只删「后面正好跟 3 的倍数个数字」的逗号，
        //   所以不会误伤「1,23」这种普通逗号（不足 3 位就不匹配）。
        .replace(/(\d),(?=(\d{3})+(?!\d))/g, '$1')
        .replace(/(?:第)?\s*\d{1,4}\s*年\s*(?:第)?\s*\d{1,2}\s*月\s*(?:第)?\s*\d{1,2}\s*日/g, ' ')
        .replace(/(?:第)?\s*\d{1,2}\s*月\s*(?:第)?\s*\d{1,2}\s*日/g, ' ');
      const v4ClassifyResource = (name) => {
        const n = v4Text(name);
        if (!n) return 'abstract';
        if (V4_ABSTRACT_WORDS.some(w => n.includes(w))) return 'abstract';
        // 单字货币词只认全等，否则「金属 / 银矿」会被误判成货币
        if (V4_CURRENCY_EXACT.includes(n)) return 'currency';
        if (V4_CURRENCY_WORDS.some(w => n.includes(w))) return 'currency';
        return 'material';
      };
      // ★ v0.4.09：货币后缀 G（用户实测反馈）
      //   世界书 uid 8 写「货币:通用币(G)|1k=千」，uid 114 写「任何货币都 1:1 转化为通用币」。
      //   但原来 V4_UNIT_PATTERN 与 V4_CURRENCY_WORDS **都不含 G**，于是：
      //     「周产货运周转周费300000G」→ 抽成「货运周转周费 300000」且被判成 material，
      //     钱就被当成物资堆进了【当前库存】（真实存档里累计 41,600,000），资金池一分没加。
      //   现在：数字（含 k/千/万 倍数）后面跟着 G/g（或「通用币/金币…」）即认定为货币。
      //   注意 G 不能塞进 V4_UNIT_PATTERN —— 那样只会把 G 当单位、名字仍是「货运周转周费」，
      //   分类结果还是 material，等于没修。
      const V4_CURRENCY_SUFFIX_RE = /(?:\d)\s*(?:[kK千万])?\s*(?:[Gg](?![A-Za-z0-9])|通用币|金币|银币|铜币)/;
      const v4HasCurrencySuffix = (clause) => V4_CURRENCY_SUFFIX_RE.test(String(clause || ''));
      // ★ v0.4.09：货币显示名归一。世界书 uid 8「只有唯一货币【通用币】，没有其他银币铜币」，
      //   uid 114「任何货币都 1:1 转化为通用币」。所以不管是「金币500」「银币」「货运周转周费500000G」
      //   还是玩家手动把某项 kind 编辑成 currency，在【每周产出 / 每周消耗 / 净总结】里
      //   都统一显示成一行「通用币」，避免同一笔钱被拆成好几行、或在净总结里重复计算。
      const V4_CURRENCY_LABEL = '通用币';
      const v4CurrencyLabelOf = (resource, kind) => (kind === 'currency' ? V4_CURRENCY_LABEL : resource);
      // ★ v0.4.09：倍数后缀。世界书 uid 8 明确写了「1k=千」，
      //   原来「周产通用币3k」会被读成 3（差 1000 倍），「3千」同理会读成 3。
      const V4_MULT_SUFFIX = '[kK千万]';
      const V4_MULTIPLIER = { k: 1e3, K: 1e3, 千: 1e3, 万: 1e4 };
      const v4ApplyMultiplier = (qty, suffix) => {
        const q = Math.abs(v4Num(qty, 0));
        const m = V4_MULTIPLIER[v4Text(suffix)];
        return m ? q * m : q;
      };
      // 文本里显式写了 +/− 就以它为准，否则用关键词判定的方向
      const v4ResolveSigned = (qty, explicitSign, polarity) => {
        const q = Math.abs(v4Num(qty, 0));
        if (explicitSign === '+' || explicitSign === '-') return explicitSign === '-' ? -q : q;
        return polarity === 'consume' ? -q : q;
      };
      // ★ v0.4.10（问题③-A）：把「显式极性」与「默认极性」拆开。
      //   原来 v4PolarityOf 把「没写关键词」和「写了产出」都返回 produce，
      //   于是「每周实弹操演消耗：7.92mm尖头弹×2800发，七五炮弹×50发」里，
      //   第二个子句因为没有关键词被判成**产出**，「七五炮弹」跑进了产出列表。
      //   现在：没写关键词就返回 null，交给上层按「同句继承」决定。
      const v4PolarityExplicit = (clause) => {
        // 「维护消耗」「持续损失」这类双词叠加，取最靠后的那个关键词为准
        // （中文里修饰语在前、中心动词在后：「维护消耗木材」的中心词是「消耗」）
        let ci = -1, pi = -1;
        V4_CONSUME_WORDS.forEach(w => { const i = clause.lastIndexOf(w); if (i > ci) ci = i; });
        V4_PRODUCE_WORDS.forEach(w => { const i = clause.lastIndexOf(w); if (i > pi) pi = i; });
        if (ci >= 0 && pi >= 0) return ci >= pi ? 'consume' : 'produce';
        if (ci >= 0) return 'consume';
        if (pi >= 0) return 'produce';
        // 无关键词：按符号判断（「-30」明确表示减少）
        if (/[-−–]\s*\d/.test(clause)) return 'consume';
        return null;
      };
      // 兼容旧调用：没有显式极性时默认产出（结算解析等仍走这个口径）
      const v4PolarityOf = (clause) => v4PolarityExplicit(clause) || 'produce';
      // ★ v0.4.10（问题③-A）：按句子分段 + 段内极性继承。
      //   「。／换行」= 句子边界 → carry 重置；
      //   「；／，／、」= 同一并列列表 → carry 延续。
      //   「消耗」只出现在并列列表的第一个子句里，但整个列表都该是消耗。
      //   回调参数：clause 子句 / polarity 最终极性 / explicit 本子句显式极性（无则 null）
      //             / inherited 从前面子句继承来的极性（无则 null）
      const v4EachClause = (text, handler) => {
        String(text === undefined || text === null ? '' : text).split(/[。\n]+/).forEach(segment => {
          let carry = null;
          // ★ v0.4.11（P6）：方括号也是并列列表的分隔符。
          //   真实存档里 AI 写的是
          //     「周产奔狼外售百货90箱[冷杉香皂5500块，火柴12000盒，…]」
          //   v4ExtractFlow 每个子句只返回**一条** flow，所以「[」后面的第一项
          //   （冷杉香皂）会连同后面的内容被整段吃掉，只留下前面那条聚合项。
          //   把 [ ] 也当分隔符，括号里的每一项就能各自成为一个子句。
          //   ⚠️ 只加 [ ]，不加【】：v4ParseSettlement 共用这个拆句器，
          //      而结算文本的前缀「【经营到期结算】」虽然会被先剥掉，
          //      但为稳妥起见不再往这里加中文方括号。
          segment.split(/[；;，,、\[\]]+/).forEach(raw => {
            const clause = raw.trim();
            if (!clause || v4IsEmptyWord(clause)) return;
            const explicit = v4PolarityExplicit(clause);
            const inherited = explicit ? null : carry;
            const polarity = explicit || carry || 'produce';
            if (explicit) carry = explicit;
            handler(clause, polarity, explicit, inherited);
          });
        });
      };
      // 从单个短句中抽取「数量 + 单位 + 物资」
      // 注意：候选物资名要排除纯量词（单位/个/件…），否则「3个单位」会把「单位」当成物资名
      // ★ v0.4.08 修复（物资名以数字开头时被截断）：
      //   原来物资名的字符类是 [\u4e00-\u9fa5A-Za-z·] —— **不含数字与小数点**。
      //   而下面的正则都没有用 ^ 锚定整句，所以匹配可以从句子中间任意位置开始：
      //     「周产7.92mm尖头步枪弹20000发」→ 引擎跳过「7.92」，从「mm」开始匹配
      //                                      → 物资名被截成「mm尖头步枪弹」
      //     「75mm高爆炮弹400发」          → 物资名被截成「mm高爆炮弹」
      //   玩家看到的现象就是【常态收益】里显示「+400 mm高爆炮弹」，
      //   而【拆解结算】入库成「mm高爆炮弹 20800发」；
      //   手动添加却正常 —— 因为手动走结构化表单，根本不经过这些正则。
      //   口径（75mm / 105mm）与型号（Gew.98）本来就是物资名的一部分，必须收进字符类。
      // ★ v0.4.11：再放开两个字符（见 _name_map.json 的 P3/P4）：
      //   / —— 型号「MG08/15轻机枪」。缺了它，引擎从 / 之后开始匹配，物资名被截成「15轻量化机枪」
      //   × —— 口径「7.92×57mm尖头穿甲铜弹」。缺了它，物资名被截成「57mm尖头穿甲铜弹」（丢了 7.92× 前缀）
      //   放开 × 是安全的：reA 的名字是**懒惰**匹配，必须整体满足「名字 + × + 数量 + 单位」，
      //   所以它仍会精确停在最后那个作为「数量分隔符」的 × 上，而不是把数量也吃进名字。
      // ★ v0.4.12（P8）：放开英文圆括号 ( )。
      //   真实存档的【资产总库存.物资】里有一个标准名带括号：「制式后装步枪(旧款)」（875 支）。
      //   而 V4_RES_TAIL 只允许「汉字/字母/·」结尾、名字类也不含括号，
      //   于是 `周产制式后装步枪(旧款)×875支` **整条解析不出来**（落到 abstract，qty=0）——
      //   和 P7 一样属于**静默丢数据**：不报错，但那条物资在【常态收益】里彻底消失。
      //   实测：`周产制式后装步枪(旧款)×875支` → 修复前 abstract/0，修复后 制式后装步枪(旧款) 875支。
      //   放开是安全的：名字在数量**之前**时是懒惰匹配（形态A），
      //   括号只会被吃进「名字整体」里，不会跨过 `×数量单位` 这道边界；
      //   而写在数量**之后**的括号注释（如 `…×200匹(约6000米)`）根本不在名字的匹配区间内，不受影响。
      const V4_RES_NAME_CHARS = '\\u4e00-\\u9fa5A-Za-z0-9.·/×()';
      // 名字类收数字后必须再要求「末位不是数字/小数点」，否则形态A 会把
      // 「30吨铁矿」切在「3」和「0」之间（名字变「3」、数量变 0、单位「吨」），
      // 把「数量+单位+物资」这种正常写法（5石粮食 / 30吨铁矿）整条吃掉。
      // 加上这个约束后，这类句子会因为「3」后面不是合法物资名而正确落到形态B。
      // ★ v0.4.12（P8）：末位也要允许 `)` —— 否则「制式后装步枪(旧款)」会退一位，
      //   名字被截成「制式后装步枪(旧款」或干脆匹配失败。
      const V4_RES_TAIL = '[\\u4e00-\\u9fa5A-Za-z·)]';
      // ★ v0.4.11：长度上限从 15/16 放宽到 24/24（见 _name_map.json 的 P4）。
      //   真实存档里最长的名字是「7.92×57mm尖头穿甲铜弹」（15 字），
      //   但匹配时**前面还挂着「周产」两个字**，一共 17 字 > 16 的旧上限，
      //   于是引擎只能退而求其次从「产」开始匹配，名字被截成「产7.92×57mm尖头穿甲」。
      //   放宽到 24 后，reA 的懒惰匹配仍会精确停在「名字 + × + 数量 + 单位」的那个 × 上，
      //   不会把数量吃进名字（这一点由「末位必须是汉字/字母」+ 后续的 `\d+` 共同保证）。
      const V4_RES_LAZY = `[${V4_RES_NAME_CHARS}]{0,24}?${V4_RES_TAIL}`;   // 形态A用：物资在数字之前，取最短
      const V4_RES_GREEDY = `[${V4_RES_NAME_CHARS}]{2,24}`;                // 形态B用：物资在单位之后，取最长
      const V4_UNIT_WORDS = V4_UNIT_PATTERN.split('|');
      const V4_UNIT_ONLY = new RegExp(`^(?:${V4_UNIT_PATTERN})$`);
      // 「单」是「单位」的子串，光靠全等判断拦不住，还要排除量词的子串
      const v4IsUnitFragment = (name) => {
        const n = v4Text(name);
        if (!n) return true;
        if (V4_UNIT_ONLY.test(n)) return true;
        return V4_UNIT_WORDS.some(w => w.length > n.length && w.includes(n));
      };
      const v4ExtractFlow = (clause) => {
        const text = v4StripDateNoise(clause).replace(/^[\s:：,，。;；、]+/, '');
        if (!text) return null;
        // ★ v0.4.09：整句带货币后缀（300000G / 3k通用币）时，无论抽出的业务名是什么，
        //   一律归一成「通用币」——世界书 uid 8「只有唯一货币【通用币】」、
        //   uid 114「任何货币都 1:1 转化为通用币」。这样【每周产出】只出现一行通用币，
        //   不会既有一行「通用币」、又有一行「货运周转周费」重复计钱。
        const isCurrency = v4HasCurrencySuffix(text);
        // 统一出口：应用倍数后缀（k/千/万）
        const pack = (resource, qty, mult, unit, sign) => ({
          resource: isCurrency ? '通用币' : resource,
          qty: v4ApplyMultiplier(qty, mult),
          unit: isCurrency ? '' : unit,
          sign: sign || ''
        });
        // 形态 A：物资 + 数量 + 单位   例：铁矿30吨 / 木材x5单位
        const reA = new RegExp(`(${V4_RES_LAZY})\\s*[x×*]?\\s*(\\d+(?:\\.\\d+)?)\\s*(${V4_MULT_SUFFIX})?\\s*(${V4_UNIT_PATTERN})`);
        // 形态 B：数量 + 单位 + 物资   例：30吨铁矿 / 5单位木材
        const reB = new RegExp(`(\\d+(?:\\.\\d+)?)\\s*(${V4_MULT_SUFFIX})?\\s*(${V4_UNIT_PATTERN})\\s*(?:的)?\\s*(${V4_RES_GREEDY})`);
        // 形态 C：物资 + 数量（无单位）  例：金币120 / 声望+3
        // ★ v0.4.08：名字类要收数字（否则「7.92mm尖头步枪弹20000」会从「mm」开始匹配），
        //   但**末位必须是汉字/字母**、不能是数字或小数点 —— 否则正则会把
        //   「7.92mm尖头步枪弹20000」切在「7.」和「92」之间（物资名变「7.」、数量变 92）。
        //   强制末位非数字，就等价于要求「名字整体之后才是数量」，这正是我们想要的语义。
        // ★ v0.4.12（P7）：形态 C 也要接受 `×` 数量分隔符。
        //   真实存档的目标格式写的是「周产通用币×350」「周产通用币×328000」，
        //   而形态 C 原来只允许名字与数字之间是空白/正负号，`×` 直接导致整条不匹配：
        //     → 落到「抽象收益」分支，kind=abstract、qty=0，
        //       钱既不计入 weeklyCurrencyIn、也不进资金池，在【每周产出】里彻底消失。
        //   （形态 A 早就写了 `[x×*]?`，所以「铁矿×30吨」一直是好的 —— 缺的只是无单位这条。）
        //   实测：`通用币+3000G` 正常，`通用币×3000` 丢失；加上 `[x×*]?` 后两者一致。
        //   放开是安全的：名字类本就允许 `×`（口径「7.92×57mm」），
        //   而末位「必须是汉字/字母/·」+ 后续 `\d+` 共同保证名字不会把数量吃进去。
        //   v0.4.12（P8）末位同步放开 `)`，与 V4_RES_TAIL 保持一致（「制式后装步枪(旧款)」）。
        const reC = new RegExp(`([${V4_RES_NAME_CHARS}]{0,24}[\\u4e00-\\u9fa5A-Za-z·)])\\s*[x×*]?\\s*([+\\-−–]?)\\s*(\\d+(?:\\.\\d+)?)\\s*(${V4_MULT_SUFFIX})?(?![年月日\\d%])`);
        // 形态 D：数量 + 物资（无单位）  例：120金币 / +3声望
        // 数量在前，所以名字里可以直接带数字（「120 7.92mm步枪」→ 名字「7.92mm步枪」）
        // ★ v0.4.11（P1/P2）：数字后面必须加 `(?![\d.])` —— 否则 `\d+` 会回溯，
        //   把「600米」拆成数量 60 + 物资名「0米」，「600刀」拆成 60 +「0刀」。
        //   原因：名字类允许数字开头，所以 `\d+` 退一位后剩下的「0米」正好是一个合法名字。
        //   加上这个负向前瞻，`\d+` 就不能停在更长的数字中间，只能整体匹配或整体失败。
        const reD = new RegExp(`([+\\-−–]?)\\s*(\\d+(?:\\.\\d+)?)(?![\\d.])\\s*(${V4_MULT_SUFFIX})?\\s*(?:点|枚)?\\s*([${V4_RES_NAME_CHARS}]{2,24})`);

        let m = text.match(reA);
        if (m) {
          const resource = v4CleanResourceName(m[1]);
          // 货币：名字不重要（统一成通用币），只要数量抽出来即可
          if (isCurrency) return pack('', m[2], m[3], '', '');
          if (resource && !v4IsUnitFragment(resource)) return pack(resource, m[2], m[3], m[4], '');
        }
        m = text.match(reB);
        if (m) {
          const resource = v4CleanResourceName(m[4]);
          if (isCurrency) return pack('', m[1], m[2], '', '');
          if (resource && !v4IsUnitFragment(resource)) return pack(resource, m[1], m[2], m[3], '');
        }
        // 无单位的两种形态：先排除整句里已经出现「数字+单位」的情况，避免把单位里的数字当成数量
        const hasUnitNumber = new RegExp(`\\d+(?:\\.\\d+)?\\s*(?:${V4_UNIT_PATTERN})`).test(text);
        if (!hasUnitNumber) {
          m = text.match(reC);
          if (m) {
            const resource = v4CleanResourceName(m[1]);
            if (isCurrency) return pack('', m[3], m[4], '', m[2]);
            if (resource && !v4IsUnitFragment(resource)) return pack(resource, m[3], m[4], '', m[2]);
          }
          m = text.match(reD);
          if (m) {
            const resource = v4CleanResourceName(m[4]);
            if (isCurrency) return pack('', m[2], m[3], '', m[1]);
            if (resource && !v4IsUnitFragment(resource)) return pack(resource, m[2], m[3], '', m[1]);
          }
        }
        return null;
      };
      const v4CleanResourceName = (raw) => {
        // ★ v0.4.11：补「回收」——真实存档写「回收冶炼废铁×20吨」，
        //   原来名字会残留动词变成「回收冶炼废铁」，与库存里的「冶炼废铁」对不上。
        const leadRe = /^(每周|每日|每月|每年|每季|周产|日产|月产|年产|季产|产出|出产|收益|收入|获得|增加|增产|收获|收取|进账|盈利|赚取|提供|供给|周耗|日耗|月耗|年耗|季耗|消耗|耗费|损失|支出|维护|开销|扣除|磨损|花费|支付|上缴|需要|投入|回收|周节省|日节省|月节省|节省|节约|结余|净赚|净得|的|了|与|和|及)/;
        let n = v4Text(raw)
          .replace(/^[的了与和及、,，。:：]+/, '')
          .replace(/(数量|共计|合计|大约|约|左右|每个|每日|每周|每月)$/, '')
          .replace(/\s+/g, '')
          .trim();
        // 反复剥离前缀，直到稳定：「维护消耗木材」→「消耗木材」→「木材」
        for (let i = 0; i < 6; i++) {
          const next = n.replace(leadRe, '');
          if (next === n) break;
          n = next;
        }
        n = n.replace(/[的了与和及]+$/, '').trim();
        if (!n) return '';
        // ★ v0.4.11：上限同步放宽到 24（原来 14 会把「7.92×57mm尖头穿甲铜弹」截断）
        return n.slice(0, 24);
      };
      // 解析一条「产出/功能」文本 → 若干收益项
      // ★ v0.4.10：
      //   ③-A 极性继承：改为按「句子」分段、段内并列子句继承极性（见 v4EachClause）。
      //       原来把「。；，、」全部拍平成一个 clauses 数组，每个子句各自独立判极性，
      //       于是「每周实弹操演消耗：7.92mm尖头弹×2800发，七五炮弹×50发」里
      //       「七五炮弹」所在子句没有关键词 → 默认 produce → 跑进产出列表。
      //   ③-B 功能字段：opts.fromFunction === true 时，只有本子句（或继承来的）
      //       存在**显式**产出/消耗关键词，才允许把数字当成库存物产。
      //       「功能」是描述性文字（「维持2140名正规常备军…」），
      //       原来 reA 会抽出 name=「维持」qty=2140 unit=「名」这种垃圾项。
      //       ⚠️ 公开入口 __v4.parseIncomeFromText 默认 fromFunction=false，
      //          所以所有直接调用它的测试与结算路径都不受影响，
      //          改动面仅限 v4CollectIncome 里「功能字段」这一条路径。
      const v4ParseIncomeFromText = (text, opts) => {
