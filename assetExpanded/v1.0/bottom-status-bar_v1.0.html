        const fromFunction = !!(opts && opts.fromFunction);
        const cleaned = v4StripDateNoise(text);
        if (!cleaned || v4IsEmptyWord(cleaned)) return [];
        const results = [];
        const seen = new Set();
        v4EachClause(cleaned, (clause, polarity, explicit, inherited) => {
          // 功能字段：没有显式关键词（也没有从并列列表继承来的）→ 里面的数字不是库存物产
          const allowNumeric = !fromFunction || explicit !== null || inherited !== null;
          const flow = allowNumeric ? v4ExtractFlow(clause) : null;
          if (!flow || !flow.resource || !(flow.qty > 0)) {
            // 抽不出「数量+物资」→ 抽象/恒定收益，放列表尾部
            const key = 'abs:' + v4Hash(clause);
            if (seen.has(key)) return;
            seen.add(key);
            results.push({
              kind: 'abstract', polarity, resource: '', qty: 0, unit: '',
              note: clause, raw: clause, signedQty: 0
            });
            return;
          }
          const kind = v4ClassifyResource(flow.resource);
          // 显式符号与关键词冲突时以显式符号为准（「周产通用币-30」= 实际减少 30），
          // 并让 polarity 与符号保持一致，否则 UI 会显示「产出 −30」这种自相矛盾的行
          const signed = v4ResolveSigned(flow.qty, flow.sign, polarity);
          const effPolarity = signed < 0 ? 'consume' : 'produce';
          // 去重键带上方向与数量，否则「周产通用币120，消耗通用币30」会丢掉一条
          const key = `${kind}:${flow.resource}:${flow.unit}:${effPolarity}:${flow.qty}`;
          if (seen.has(key)) return;
          seen.add(key);
          results.push({
            kind, polarity: effPolarity, resource: flow.resource, qty: flow.qty, unit: flow.unit || '',
            note: clause, raw: clause, signedQty: signed
          });
        });
        return results;
      };
      // 汇总某个资产的全部常态收益项（含编辑覆盖 / 隐藏 / 删除 / 手动追加）
      const v4CollectIncome = (assetName, asset, store) => {
        const seqs = (asset && typeof asset.建设序列 === 'object' && asset.建设序列) ? asset.建设序列 : {};
        const edits = (store.incomeEdits && store.incomeEdits[assetName]) || {};
        const hidden = (store.incomeHidden && store.incomeHidden[assetName]) || {};
        const deleted = (store.incomeDeleted && store.incomeDeleted[assetName]) || {};
        const items = [];
        Object.entries(seqs).forEach(([seqName, seq]) => {
          // ★ v0.4.10（问题③-B）：产出与功能分开解析并带上 fromFunction 标记。
          //   顺序必须保持「产出在前、功能在后」—— 编辑覆盖用的键是 `${seqName}||${idx}`，
          //   顺序一变，玩家已有的编辑覆盖就会串位。
          const source = [];
          if (!v4IsEmptyWord(seq?.产出)) source.push({ text: v4Text(seq.产出), fromFunction: false });
          if (!v4IsEmptyWord(seq?.功能)) source.push({ text: v4Text(seq.功能), fromFunction: true });
          if (source.length === 0) return;
          const parsed = source.flatMap(s => v4ParseIncomeFromText(s.text, { fromFunction: s.fromFunction }));
          if (parsed.length === 0) return;
          parsed.forEach((item, idx) => {
            const key = `${assetName}||${seqName}||${idx}`;
            if (deleted[seqName] === true) return;
            // 编辑覆盖按「序列名||序号」存取（一个建设序列可能解析出多条收益项），
            // 写入端 v4EditIncome 用的也是这个键，两边必须一致
            const edit = edits[`${seqName}||${idx}`];
            const editObj = (edit && typeof edit === 'object') ? edit : null;
            let merged = Object.assign({}, item);
            if (editObj) {
              if (editObj.resource !== undefined) merged.resource = v4Text(editObj.resource);
              if (editObj.qty !== undefined && editObj.qty !== null && editObj.qty !== '') {
                const q = Math.abs(v4Num(editObj.qty, merged.qty));
                merged.qty = q;
                merged.signedQty = merged.polarity === 'consume' ? -q : q;
              }
              if (editObj.unit !== undefined) merged.unit = v4Text(editObj.unit);
              if (editObj.kind !== undefined && ['material', 'currency', 'abstract'].includes(editObj.kind)) merged.kind = editObj.kind;
              if (editObj.polarity !== undefined && ['produce', 'consume'].includes(editObj.polarity)) {
                merged.polarity = editObj.polarity;
                merged.signedQty = merged.polarity === 'consume' ? -merged.qty : merged.qty;
              }
              if (editObj.note !== undefined) merged.note = v4Text(editObj.note);
            }
            if (!merged.resource && merged.kind !== 'abstract') return;
            // v0.4.09：货币一律归一成「通用币」（见 v4CurrencyLabelOf 注释）
            merged.resource = v4CurrencyLabelOf(merged.resource, merged.kind);
            if (merged.kind === 'currency') merged.unit = '';
            items.push(Object.assign(merged, {
              key, assetName, seqName,
              stage: v4Text(seq?.建设阶段),
              hidden: !!hidden[seqName],
              edited: !!editObj,
              manual: false
            }));
          });
        });
        // 手动追加（不来自建设序列）
        const manualList = Array.isArray(store.incomeManual?.[assetName]) ? store.incomeManual[assetName] : [];
        manualList.forEach((m, idx) => {
          const kind = ['material', 'currency', 'abstract'].includes(m.kind) ? m.kind : 'material';
          const polarity = m.polarity === 'consume' ? 'consume' : 'produce';
          const qty = Math.abs(v4Num(m.qty, 0));
          // v0.4.09：手动项若被标成货币，同样归一成「通用币」
          const res = v4CurrencyLabelOf(v4Text(m.resource) || v4Text(m.name), kind);
          items.push({
            key: `${assetName}||__manual__||${idx}`,
            assetName, seqName: v4Text(m.srcSeq) || '',
            kind, polarity, resource: res,
            qty, unit: kind === 'currency' ? '' : v4Text(m.unit), note: v4Text(m.note), raw: v4Text(m.note),
            signedQty: polarity === 'consume' ? -qty : qty,
            stage: '', hidden: false, edited: false, manual: true
          });
        });
        return items;
      };
      // 排序：物产（材料/通用币）在前，抽象收益在尾部
      const v4SortIncome = (items) => {
        const rank = (it) => it.kind === 'abstract' ? 2 : 1;
        return items.slice().sort((a, b) => {
          const ra = rank(a), rb = rank(b);
          if (ra !== rb) return ra - rb;
          if (a.polarity !== b.polarity) return a.polarity === 'produce' ? -1 : 1;
          const c = String(a.resource).localeCompare(String(b.resource), 'zh-Hans-CN');
          if (c !== 0) return c;
          return String(a.seqName).localeCompare(String(b.seqName), 'zh-Hans-CN');
        });
      };
      // 全部资产合并的收益流（供库存页联动）
      const v4CollectAllIncome = (assets, store) => {
        const all = [];
        Object.entries(assets || {}).forEach(([assetName, asset]) => {
          v4CollectIncome(assetName, asset, store).forEach(it => all.push(it));
        });
        return all;
      };

      // ---------- ⑤ 资产总库存 ----------
      // 拆解【经营到期结算】文本 → 若干物资增减
      // 支持写法：铁矿+30吨 / 木材-5单位 / 通用币+120 / 产出：铁矿30吨；消耗：木材5单位
      const v4ParseSettlement = (text) => {
        const body = String(text || '').replace(/^【经营到期结算】/, '');
        // 先把「铁矿 30 吨」这类夹空格的写法压成「铁矿30吨」，正则就不必再处理空格
        const cleaned = v4StripDateNoise(body)
          .replace(/([\u4e00-\u9fa5])\s+(\d)/g, '$1$2')
          .replace(/(\d)\s+([\u4e00-\u9fa5])/g, '$1$2');
        const flows = [];
        // ★ v0.4.08：与 v4ExtractFlow 同一处修复 —— 物资名要允许数字与小数点，
        //   否则「7.92mm尖头步枪弹」「75mm高爆炮弹」会被截成「mm尖头步枪弹」「mm高爆炮弹」。
        //   这里名字后面必须跟 +/− 符号（或作为「数量+单位+名字」的尾段），
        //   符号/单位天然是终止符，所以名字类里带数字不会把数量吃进去。
        const NAME_LAZY = `[${V4_RES_NAME_CHARS}]{1,16}?`;
        const NAME_GREEDY = `[${V4_RES_NAME_CHARS}]{2,16}`;
        // ★ v0.4.10（问题③-A）：与 v4ParseIncomeFromText 同口径 ——
        //   「。／换行」断句并重置极性，「；／，／、」并列则继承前面的极性。
        //   否则「消耗：A×2，B×3」里的 B 会因为本子句没有关键词而按默认值判成产出。
        v4EachClause(cleaned, (clause, polarity) => {
          // ★ v0.4.09：与 v4ExtractFlow 同口径 —— 整句带货币后缀时一律归一成「通用币」。
          //   否则「货运周转周费+300000G」会被下面第一个分支先命中（名字 + 符号 + 数字），
          //   分类成 material，钱又变成物资了。这里必须和 v4ExtractFlow 保持一致。
          const isCurrency = v4HasCurrencySuffix(clause);
          let matchedAny = false;
          // 形如 名称+30吨 / 名称-5 / 名称+120 / 名称+300000G / 名称+3k
          const m = clause.match(new RegExp(`(${NAME_LAZY})\\s*([+\\-−–])\\s*(\\d+(?:\\.\\d+)?)\\s*(${V4_MULT_SUFFIX})?\\s*(${V4_UNIT_PATTERN})?`));
          if (m) {
            const name = v4CleanResourceName(m[1]);
            const qty = v4ApplyMultiplier(m[3], m[4]);
            const useName = isCurrency ? '通用币' : name;
            const useUnit = isCurrency ? '' : (m[5] || '');
            if (useName && !v4IsUnitFragment(useName) && qty > 0) {
              flows.push({
                name: useName, qty, unit: useUnit, kind: isCurrency ? 'currency' : v4ClassifyResource(name),
                signedQty: v4ResolveSigned(qty, m[2], polarity)
              });
              matchedAny = true;
            }
          }
          // 形如 30吨铁矿 / 5单位木材
          if (!matchedAny) {
            const m2 = clause.match(new RegExp(`([+\\-−–])?\\s*(\\d+(?:\\.\\d+)?)\\s*(${V4_MULT_SUFFIX})?\\s*(${V4_UNIT_PATTERN})\\s*(?:的)?\\s*(${NAME_GREEDY})`));
            if (m2) {
              const name = v4CleanResourceName(m2[5]);
              const qty = v4ApplyMultiplier(m2[2], m2[3]);
              const useName = isCurrency ? '通用币' : name;
              const useUnit = isCurrency ? '' : (m2[4] || '');
              if (useName && !v4IsUnitFragment(useName) && qty > 0) {
                flows.push({
                  name: useName, qty, unit: useUnit, kind: isCurrency ? 'currency' : v4ClassifyResource(name),
                  signedQty: v4ResolveSigned(qty, m2[1], polarity)
                });
                matchedAny = true;
              }
            }
          }
          if (!matchedAny) {
            const flow = v4ExtractFlow(clause);
            if (flow && flow.resource && flow.qty > 0) {
              flows.push({
                name: flow.resource, qty: flow.qty, unit: flow.unit || '',
                kind: v4ClassifyResource(flow.resource),
                signedQty: v4ResolveSigned(flow.qty, flow.sign, polarity)
              });
            }
          }
        });
        // 同类合并（先算好带符号的量，避免二次取反）
        const merged = {};
        flows.forEach(f => {
          const key = `${f.name}||${f.unit}`;
          if (!merged[key]) merged[key] = Object.assign({}, f);
          else merged[key].signedQty += f.signedQty;
        });
        return Object.values(merged).filter(f => f.signedQty !== 0 || f.qty > 0);
      };

      // 聚合库存视图
      const v4BuildInventoryView = (assets, store) => {
        const inv = store.inventory || v4EmptyStore().inventory;
        const swept = inv.swept || {};
        const allIncome = v4CollectAllIncome(assets, store);

        // ---- 当前库存：手动条目 + 结算累计 ----
        const stockMap = {};   // { name: { qty, unit, group, fromSweep } }
        const ensure = (name, unit) => {
          if (!stockMap[name]) stockMap[name] = { name, qty: 0, unit: unit || '', fromSweep: 0, manual: 0 };
          if (!stockMap[name].unit && unit) stockMap[name].unit = unit;
          return stockMap[name];
        };
        Object.entries(inv.items || {}).forEach(([name, item]) => {
          const cell = ensure(name, v4Text(item?.unit));
          cell.manual += v4Num(item?.qty, 0);
          cell.qty += v4Num(item?.qty, 0);
          if (item?.note) cell.note = v4Text(item.note);
        });
        let sweptCurrency = 0;
        Object.values(swept).forEach(rec => {
          if (!rec) return;
          if (rec.kind === 'currency') { sweptCurrency += v4Num(rec.signedQty, 0); return; }
          const cell = ensure(v4Text(rec.name), v4Text(rec.unit));
          cell.fromSweep += v4Num(rec.signedQty, 0);
          cell.qty += v4Num(rec.signedQty, 0);
        });

        // ---- 每周消耗 / 每周产出（联动【常态收益】） ----
        const consumeMap = {};
        const produceMap = {};
        const addFlow = (map, name, qty, unit, sources) => {
          if (!name) return;
          if (!map[name]) map[name] = { name, qty: 0, unit: unit || '', sources: [] };
          map[name].qty += qty;
          if (!map[name].unit && unit) map[name].unit = unit;
          if (sources && !map[name].sources.includes(sources)) map[name].sources.push(sources);
        };
        let produceCurrency = 0, consumeCurrency = 0;
        allIncome.forEach(it => {
          if (it.hidden) return;   // 【隐藏】的收益项不参与计算，也不发送给 AI
          const src = it.manual ? '' : `${it.assetName}${it.seqName ? ' · ' + it.seqName : ''}`;
          if (it.kind === 'abstract') return;
          const qty = Math.abs(v4Num(it.qty, 0));
          if (!(qty > 0)) return;
          if (it.kind === 'currency') {
            // 通用币既进资金池统计，也照常列进【每周消耗 / 每周产出】
            if (it.polarity === 'consume') consumeCurrency += qty; else produceCurrency += qty;
          }
          if (it.polarity === 'consume') addFlow(consumeMap, it.resource, qty, it.unit, src);
          else addFlow(produceMap, it.resource, qty, it.unit, src);
        });
        (inv.manualConsume || []).forEach(m => addFlow(consumeMap, v4Text(m.name), Math.abs(v4Num(m.qty, 0)), v4Text(m.unit), '手动'));
        (inv.manualProduce || []).forEach(m => addFlow(produceMap, v4Text(m.name), Math.abs(v4Num(m.qty, 0)), v4Text(m.unit), '手动'));

        const consumeList = Object.values(consumeMap).sort((a, b) => b.qty - a.qty);
        const produceList = Object.values(produceMap).sort((a, b) => b.qty - a.qty);

        // ---- 净总结 ----
        const netNames = new Set([...consumeList.map(x => x.name), ...produceList.map(x => x.name)]);
        const netList = [];
        netNames.forEach(name => {
          const c = consumeMap[name] ? consumeMap[name].qty : 0;
          const p = produceMap[name] ? produceMap[name].qty : 0;
          const unit = (produceMap[name]?.unit || consumeMap[name]?.unit || '');
          const net = p - c;
          netList.push({ name, produce: p, consume: c, net, unit, delta: net });
        });
        netList.sort((a, b) => Math.abs(b.net) - Math.abs(a.net));
        const netCurrency = produceCurrency - consumeCurrency;

        // ---- 投影控制（决定哪些内容写进 stat_data / 发给 AI） ----
        // 默认【隐藏】：shownSections 为空 = 什么都不发。
        // 两层控制：
        //   ① shownSections —— 区块级总开关（当前库存 / 每周消耗 / 每周产出 / 净总结）
        //   ② hiddenItems   —— 物资级例外：区块已显示时，仍要把个别物资剔除
        // 计算与渲染完全不受这两者影响。
        const shownSections = Array.isArray(inv.shownSections) ? inv.shownSections.filter(s => typeof s === 'string') : [];
        const hiddenItems = (inv.hiddenItems && typeof inv.hiddenItems === 'object' && !Array.isArray(inv.hiddenItems)) ? inv.hiddenItems : {};
        const isItemHidden = (name) => hiddenItems[v4Text(name)] === true;
        // 某项物资在某个区块里是否会被写进变量
        const isProjected = (sectionId, name) => shownSections.includes(sectionId) && !isItemHidden(name);
        // 标出每一项物资的投影状态，供渲染层画「已隐藏」角标
        const markItems = (list, sectionId) => list.map(c => Object.assign({}, c, {
          projected: isProjected(sectionId, c.name)
        }));
        const markFlows = (list, sectionId) => list.map(f => Object.assign({}, f, {
          projected: isProjected(sectionId, f.name)
        }));

        // ---- 分组 ----
        const groups = Array.isArray(inv.groups) ? inv.groups.slice() : [];
        const groupOf = inv.groupOf || {};
        const stockList = Object.values(stockMap)
          .filter(c => c.qty !== 0 || c.manual !== 0)
          .sort((a, b) => {
            const ga = groupOf[a.name] || '', gb = groupOf[b.name] || '';
            if (ga !== gb) return ga === '' ? 1 : (gb === '' ? -1 : ga.localeCompare(gb, 'zh-Hans-CN'));
            return String(a.name).localeCompare(String(b.name), 'zh-Hans-CN');
          });
        const ungrouped = stockList.filter(c => !groupOf[c.name]);
        // 空分组也要渲染出来，否则玩家新建了分组却看不到它，也就没法重命名/删除/往里放东西
        const grouped = groups.map(g => ({
          group: g,
          items: stockList.filter(c => groupOf[c.name] === g.name)
        }));

        return {
          pool: v4Num(inv.pool, 0) + sweptCurrency,
          poolBase: v4Num(inv.pool, 0),
          sweptCurrency,
          weeklyCurrencyIn: produceCurrency,
          weeklyCurrencyOut: consumeCurrency,
          netCurrency,
          stockList: markItems(stockList, 'stock'),
          grouped: grouped.map(g => Object.assign({}, g, { items: markItems(g.items, 'stock') })),
          ungrouped: markItems(ungrouped, 'stock'),
          groups, groupOf,
          consumeList: markFlows(consumeList, 'consume'),
          produceList: markFlows(produceList, 'produce'),
          netList: markFlows(netList, 'net'),
          incomeCount: allIncome.length,
          hiddenIncomeCount: allIncome.filter(i => i.hidden).length,
          // 投影状态：hiddenSections 仅用于兼容旧档读取，新逻辑一律看 shown*
          hiddenSections: Array.isArray(inv.hiddenSections) ? inv.hiddenSections : [],
          shownSections, hiddenItems, isItemHidden, isProjected,
          collapsedSections: Array.isArray(inv.collapsedSections) ? inv.collapsedSections : [],
          collapsedGroups: Array.isArray(inv.collapsedGroups) ? inv.collapsedGroups : [],
          manualConsume: Array.isArray(inv.manualConsume) ? inv.manualConsume : [],
          manualProduce: Array.isArray(inv.manualProduce) ? inv.manualProduce : [],
          open: inv.open === true
        };
      };

      // ---------- ⑥ 库存「投影」：把可见部分同步进 stat_data ----------
      // 设计要点（本大修的核心）：
      //   · 扩展存储（chat_metadata + localStorage）是库存的**唯一真相源**，永远完整。
      //   · stat_data.资产总库存 只是**投影**：只放玩家点了【显示】的内容。
      //   · 因此【隐藏】= 从变量里拿掉（变量管理器与 AI 都看不到），
      //     而玩家界面上照常显示（虚化），计算照常跑。
      //   · 用白名单（shownSections / shownItems），因为默认状态是【隐藏】。
      //   · 资金池始终投影（需求 0：占 token 少，始终让 AI 看得到）。
      const V4_INV_SECTION_LABEL = {
        stock: '物资',
        consume: '每周消耗',
        produce: '每周产出',
        net: '净总结'
      };

      // 由视图对象算出「应该写进 stat_data 的投影」
      const v4BuildInventoryProjection = (view) => {
        const out = { 资金池: v4Num(view.pool, 0) };
        const shownSections = view.shownSections || [];
        const isItemHidden = view.isItemHidden || (() => false);

        // 数量统一取三位小数以内，避免浮点噪声把「无变化」误判成「有变化」
        const round = (n) => Math.round(v4Num(n, 0) * 1000) / 1000;
        // 区块已显示时，除被单独【隐藏】的物资外，全部写进变量
        const pick = (list) => {
          const map = {};
          (list || []).forEach(f => {
            const name = v4Text(f.name);
            if (!name || isItemHidden(name)) return;
            map[name] = { 数量: round(f.qty), 单位: v4Text(f.unit) };
          });
          return map;
        };

        if (shownSections.includes('stock')) {
          const map = {};
          (view.stockList || []).forEach(c => {
            const name = v4Text(c.name);
            if (!name || isItemHidden(name)) return;
            map[name] = { 数量: round(c.qty), 单位: v4Text(c.unit), 分组: v4Text((view.groupOf || {})[name]) };
          });
          out.物资 = map;
        }
        if (shownSections.includes('consume')) out.每周消耗 = pick(view.consumeList);
        if (shownSections.includes('produce')) out.每周产出 = pick(view.produceList);
        if (shownSections.includes('net')) {
          const map = {};
          (view.netList || []).forEach(n => {
            const name = v4Text(n.name);
            if (!name || isItemHidden(name)) return;
            map[name] = { 数量: round(n.net), 单位: v4Text(n.unit) };
          });
          out.净总结 = map;
        }
        return out;
      };

      // 稳定的比较键（键序无关），用来判断投影是否真的变了 —— 避免每 3 秒刷一次变量
      const v4StableStringify = (value) => {
        if (value === null || typeof value !== 'object') return JSON.stringify(value);
        if (Array.isArray(value)) return '[' + value.map(v4StableStringify).join(',') + ']';
        return '{' + Object.keys(value).sort()
          .map(k => JSON.stringify(k) + ':' + v4StableStringify(value[k])).join(',') + '}';
      };

      // 比较投影时先「抹掉空容器」。
      // 原因：MVU 的 zod schema 会给未写出的键 prefault 出空对象 {}，
      // 于是 stat_data 里是 {资金池:500, 物资:{}, 每周消耗:{}}，
      // 而我们算出来的目标值是 {资金池:500} —— 若直接比字符串就会永远不相等，
      // 变成每 3 秒写一次变量。空容器不承载任何库存信息，抹掉后比较才正确。
      const v4PruneEmpty = (value) => {
        if (value === null || typeof value !== 'object' || Array.isArray(value)) return value;
        const out = {};
        Object.keys(value).forEach(k => {
          const v = value[k];
          if (v && typeof v === 'object' && !Array.isArray(v)) {
            const pruned = v4PruneEmpty(v);
            if (Object.keys(pruned).length > 0) out[k] = pruned;
          } else {
            out[k] = v;
          }
        });
        return out;
      };
      const v4ProjectionKey = (value) => v4StableStringify(v4PruneEmpty(value || {}));

      // v0.4.07：算出「物资」投影基线快照。
      // 返回 { value, changed }：
      //   · value   —— 应当记进 store.inventory.projectedSnapshot 的值；
      //                **null 表示本次不改动基线**（区块【隐藏】时脚本没有投影物资，
      //                此时必须保留上一次的基线，否则「玩家点【隐藏】」这一步会被
      //                下一轮误读成「AI 把所有物资删光了」，见 v4AdoptExternalMaterials）
      //   · changed —— 与现有基线是否不同（不同才写 store，避免每 3 秒写一次存储）
      const v4ProjectionSnapshotOf = (desired, inv) => {
        const hasTable = !!(desired && desired.物资 && typeof desired.物资 === 'object' && !Array.isArray(desired.物资));
        if (!hasTable) return { value: null, changed: false };
        const want = v4DeepCopy(desired.物资) || {};
        const have = (inv && inv.projectedSnapshot && typeof inv.projectedSnapshot === 'object'
          && !Array.isArray(inv.projectedSnapshot)) ? inv.projectedSnapshot : {};
        return { value: want, changed: v4StableStringify(have) !== v4StableStringify(want) };
      };

      // ---------- v0.4.07：物资双向同步（把 AI 的增 / 改 / 删 采纳进本地库存） ----------
      // 背景（用户实测反馈问题 1）：
      //   AI 按正确格式写了 /资产总库存/物资，几秒后就被脚本的「单向投影」整个盖掉。
      //   用户要求：「玩家手动新建物资跟 AI 修改没本质区别…你需要放给 AI。」
      //
      // 做法（用户拍板方案 A：AI 加的物资**直接落进本地库存**，之后照常受区块
      // 【显示/隐藏】与单项【隐藏】控制 —— 不会出现「变量里有、界面没有」的幽灵项）：
      //   基线 baseline = 上次脚本写进变量的物资表（store.inventory.projectedSnapshot）
      //   现值 now      = 变量里现在的物资表（stat_data.资产总库存.物资）
      //   按**名字**比对两者，差值就是外部（AI / 变量管理器）做的改动：
      //     · 新增：now 有、baseline 没有        → 采纳进本地库存
      //     · 修改：两边都有但 数量/单位/分组 不同 → 采纳
      //     · 删除：baseline 有、now 没有        → 从本地库存删掉
      //   采纳之后再由 v4BuildInventoryProjection 从本地库存重算投影，
      //   所以「本地库存」始终是唯一真相源，不存在两份互相打架的数据。
      //
      // 宽容解析：AI 可能写成 {数量:30,单位:'吨'} / {qty:30} / 直接 30 / "30吨"，
      // 这些都认；完全解析不出数量的记录**跳过**（宁可不采纳，也不能把数量清零）。
      const v4LooseNum = (value, fallback) => {
        const direct = Number(value);
        if (Number.isFinite(direct)) return direct;
        const m = String(value === undefined || value === null ? '' : value).match(/-?\d+(?:\.\d+)?/);
        if (m) { const n = Number(m[0]); if (Number.isFinite(n)) return n; }
        return fallback;
      };
      const v4NormalizeMaterialRec = (raw) => {
        if (raw === null || raw === undefined) return null;
        if (typeof raw === 'object' && !Array.isArray(raw)) {
          const qty = v4LooseNum(
            raw.数量 !== undefined ? raw.数量 : (raw.qty !== undefined ? raw.qty : raw.amount), null);
          if (qty === null) return null;   // 数量认不出来 → 跳过，绝不写 0
          const unit = v4Text(raw.单位 !== undefined ? raw.单位 : raw.unit);
          const group = v4Text(raw.分组 !== undefined ? raw.分组 : raw.group);
          return { 数量: qty, 单位: unit, 分组: group };
        }
        const qty = v4LooseNum(raw, null);
        if (qty === null) return null;
        return { 数量: qty, 单位: '', 分组: '' };
      };
      // 比对「变量 vs 上次投影基线」，返回外部改动描述；没有外部改动则返回 null
      //
      // ★ 删除判定必须加守卫（stockShown）：
      //   MVU 的 zod schema 会给未写出的键 **prefault 出空对象 `{}`**。
      //   于是「玩家点【隐藏】把 物资 从变量里拿掉」这一步，会被 schema 补成 `物资: {}`，
      //   若不加判断就会被误读成「AI 把所有物资删光了」→ 本地库存被清空。
      //   只有当脚本本次**本来就打算投影物资**（区块【显示】中）时，
      //   「基线里有、变量里没有」才真的代表外部删除。
      const v4AdoptExternalMaterials = (current, store, stockShown) => {
        if (!current || typeof current !== 'object' || Array.isArray(current)) return null;
        const extTable = (current.物资 && typeof current.物资 === 'object' && !Array.isArray(current.物资))
          ? current.物资 : null;
        const inv = (store && store.inventory) || {};
        const hasBaseline = !!(inv.projectedSnapshot && typeof inv.projectedSnapshot === 'object'
          && !Array.isArray(inv.projectedSnapshot));
        // 变量里没有物资表、也没有基线 → 无从判断外部改动
        if (!extTable && !hasBaseline) return null;
        const baseline = hasBaseline ? inv.projectedSnapshot : {};

        const added = [], modified = [], removed = [];
        const next = {};
        // ★ 解析不出来（缺数量 / 垃圾值）或数量为 0 的记录 → 一律「忽略」：
        //   既不当成新增，**也绝不当成删除**。原因是安全的：
        //   ① AI 写坏一条数据时，玩家本地对应的物资必须原样保留（不能数据丢失）；
        //   ② 更隐蔽的一层：卡内 MVU_ZOD 的 数量 字段是 `safeNum(0)`，
        //      AI 只写 `{单位:'吨'}`（漏了数量）时 schema 会把它**补成 数量:0**，
        //      脚本看到的就已经是 0 了 —— 若把 0 当删除，AI 写漏一个字段就会
        //      悄悄删掉玩家的一项物资。所以 0 只能忽略，不能当删除。
        //   删除请走 `remove`（世界书 uid=18 已写明）。
        const ignored = new Set();
        if (extTable) {
          Object.keys(extTable).forEach(rawName => {
            const name = v4Text(rawName);
            if (!name) return;
            const rec = v4NormalizeMaterialRec(extTable[rawName]);
            if (!rec || rec.数量 === 0) { ignored.add(name); return; }
            next[name] = rec;
            const base = baseline[name] ? v4NormalizeMaterialRec(baseline[name]) : null;
            if (!base || base.数量 === 0) added.push(name);
            else if (v4StableStringify(base) !== v4StableStringify(rec)) modified.push(name);
          });
        }
        if (stockShown) {
          const baseNames = Object.keys(baseline).map(v4Text).filter(Boolean);
          const stillThere = baseNames.filter(n => n in next);
          // ★ v1.0 修复（真实事故）：基线上的物资「一个都没剩」时，**绝不当作删除**。
          //   实测会误删玩家整仓库，触发场景：
          //     ① 区块刚被【显示】：隐藏期间变量里本来就没有物资表，一显示就跟基线对不上；
          //     ② AI/玩家把 /资产总库存 整体覆盖（世界书明令禁止，但 AI 会犯错）；
          //     ③ 变量被 MVU 重新校验/别的楼层覆盖后短时间读不到物资表。
          //   这三种都是「结构性消失」，不是逐项删除造成的差异 → 一律保留本地。
          //   真正的逐项删除（如 remove 掉 2 项里的 1 项）仍然照常生效。
          const structuralWipe = baseNames.length > 0 && stillThere.length === 0;
          if (!structuralWipe) {
            baseNames.forEach(name => {
              if (ignored.has(name)) return;   // 被忽略的记录 → 保持本地原样，不当作删除
              if (!(name in next)) removed.push(name);
            });
          }
        }
        if (added.length + modified.length + removed.length === 0) return null;
        return { added, modified, removed, ignored: Array.from(ignored), next, names: Object.keys(next) };
      };

      // 把外部改动落进本地库存（单一真相源）。
      // 关键点：投影里的「数量」是**库存总量**（手动记账基准 + 结算累计），
      // 而 items[name].qty 只是手动基准，所以写回时要减掉该物资名下的结算累计，
      // 否则会「采纳一次、下一轮又叠加一次」（与资金池 pool/sweptCurrency 的处理同构）。
      const v4ApplyExternalMaterials = (ext) => {
        if (!ext) return false;
        const ok = v4UpdateStore((draft) => {
          const inv = draft.inventory;
          if (!inv.items || typeof inv.items !== 'object') inv.items = {};
          if (!inv.groupOf || typeof inv.groupOf !== 'object') inv.groupOf = {};
          if (!Array.isArray(inv.groups)) inv.groups = [];
          if (!inv.swept || typeof inv.swept !== 'object') inv.swept = {};
          const swept = inv.swept;
          const sweptOf = (name) => Object.values(swept)
            .filter(r => r && v4Text(r.name) === name)
            .reduce((n, r) => n + v4Num(r.signedQty, 0), 0);
          // AI 写了本地还不存在的分组名时自动建组，否则该项会掉进
          // 「groupOf 指向不存在的分组」的缝隙里 —— 既不在分组里、也不在未分组里，
          // 界面上直接消失（幽灵项）
          const ensureGroup = (g) => {
            if (!g) return;
            if (inv.groups.some(x => x && x.name === g)) return;
            // 与渲染层的 V4_GROUP_COLORS 保持同一套色板（这里不直接引用它，
            // 避免两个注入块之间的声明顺序耦合）
            const colors = ['#2E9E9E', '#6C5CE7', '#C98A2B', '#2E9E6B', '#C75450', '#5A8FD6', '#A0529B', '#7A869A'];
            inv.groups.push({ name: g, color: colors[inv.groups.length % colors.length] });
          };
          ext.added.concat(ext.modified).forEach(name => {
            const rec = ext.next[name];
            if (!rec || rec.数量 === 0) return;   // 0 / 垃圾值一律忽略（见 v4AdoptExternalMaterials 注释）
            const prevNote = (inv.items[name] && inv.items[name].note) || '';
            inv.items[name] = { qty: rec.数量 - sweptOf(name), unit: rec.单位, note: prevNote };
            if (rec.分组) { ensureGroup(rec.分组); inv.groupOf[name] = rec.分组; }
            else if (inv.groupOf[name]) delete inv.groupOf[name];
          });
          ext.removed.forEach(name => {
            if (inv.items[name]) delete inv.items[name];
            if (inv.groupOf[name]) delete inv.groupOf[name];
            if (inv.hiddenItems && inv.hiddenItems[name]) delete inv.hiddenItems[name];
            Object.keys(swept).forEach(k => { if (swept[k] && v4Text(swept[k].name) === name) delete swept[k]; });
          });
          return true;
        });
        return ok;
      };

      // 把投影写进 stat_data.资产总库存。
      // 返回 true 表示「确实发生了写入」，调用方据此决定是否重读变量。
      //
      // ★ v0.4.06 改为**双向同步**（用户拍板）：
      //   旧行为是单向覆盖 —— 脚本每 3 秒用本地 store 算出的值整个盖掉
      //   stat_data.资产总库存，于是 AI 写的 资金池 只能活几秒就被打回。
      //   现在：**资金池**以「谁改得更晚」为准 —— 若 AI（或玩家在变量管理器里）
      //   把 资金池 改成了与脚本上次投影不同的值，就**采纳它**并写回本地 store。
      //
      // ★ v0.4.07：**物资** 也改成双向（用户实测反馈问题 1）。
      //   用户原话：「为什么不把增删改查权限放给 ai 变量修改呢？因为资金池已经放了。
      //             因为玩家手动新建物资跟 AI 修改没本质区别…你需要放给 AI。」
      //   做法见 v4AdoptExternalMaterials()：按名字比对「变量 vs 上次投影基线」，
      //   识别出外部的新增 / 修改 / 删除并**采纳进本地库存**（于是界面能看见、
      //   能编辑、能删除），之后照常受区块【显示/隐藏】与单项【隐藏】控制。
      //   （语义由用户拍板：方案 A「AI 加的物资直接落进本地库存」。）
      //
      //   其余区块（每周消耗 / 每周产出 / 净总结）仍由脚本单向负责 ——
      //   它们是「建设序列 → 常态收益」的派生结果，AI 通过改建设序列就能间接影响，
      //   直接往这里写反而会和解析结果打架。
      //
      //   如何区分「AI 改的」与「脚本自己刚写的」：
      //   把上次写出去的资金池记在 store.inventory.projectedPool，
      //   把上次写出去的物资表记在 store.inventory.projectedSnapshot。
      const v4SyncInventoryProjection = async (assets, store) => {
        let view, desired;
        try {
          view = v4BuildInventoryView(assets, store);
          desired = v4BuildInventoryProjection(view);
        } catch (e) {
          console.warn('[status-bar v4] 库存投影计算失败:', e);
          return false;
        }
        const current = (() => {
          try { return fetchLatestMvuData()?.资产总库存; } catch (e) { return undefined; }
        })();

        // ---- 双向：外部改了 资金池 → 采纳 ----
        const inv = store.inventory || {};
        const lastProjected = (inv.projectedPool === undefined || inv.projectedPool === null)
          ? null : v4Num(inv.projectedPool, null);
        const externalPool = (current && typeof current === 'object' && current.资金池 !== undefined)
          ? v4Num(current.资金池, null) : null;
        // 「外部改动」= 变量里的资金池既不是脚本上次写出去的值，也不是本次将要写的值
        if (externalPool !== null && externalPool !== lastProjected && externalPool !== desired.资金池) {
          // 采纳：平移本地记账基准 pool，使 最终资金池(pool + 结算累计) == 外部值
          const sweptCurrency = v4Num(view.sweptCurrency, 0);
          const prevPool = v4Num(inv.pool, 0);
          const nextPoolBase = externalPool - sweptCurrency;
          const adopted = v4UpdateStore((draft) => {
            draft.inventory.pool = nextPoolBase;
            draft.inventory.projectedPool = externalPool;   // 基线同步，避免下一轮重复采纳
            return true;
          });
          if (adopted) {
            console.log(`[status-bar v4] 采纳外部写入的资金池：${v4FmtQty(prevPool + sweptCurrency)} → ${v4FmtQty(externalPool)}（本地记账基准 ${v4FmtQty(prevPool)} → ${v4FmtQty(nextPoolBase)}）`);
            try { if (typeof showV4Toast === 'function') showV4Toast(`已采纳新的资金池：${v4FmtMoney(externalPool)}`); } catch (e) { }
            // 重算投影后**继续往下走**：这样变量里的值会被规范化
            //（例如 AI 写成字符串 "25000" → 归一成数字 25000），而不是留个脏值。
            try {
              view = v4BuildInventoryView(assets, v4ReloadStore());
              desired = v4BuildInventoryProjection(view);
            } catch (e) { /* 保持原 desired */ }
            // 扩展存储变了但 MVU 的 JSON 没变，refresh() 会因此跳过重建 → 手动触发一次
            try { _cachedData = null; setTimeout(refresh, 80); } catch (e) { }
          }
        }

        // ---- 双向：外部改了 物资 → 采纳（v0.4.07 新增） ----
        // 必须在资金池采纳之后跑：那时 store 已经是最新的。
        // stockShown = 本次投影本来就包含 物资（区块【显示】中）——
        // 只有这种情况才允许把「变量里少了物资」当成 AI 的删除动作。
        {
          const store2 = v4ReadStore();
          const stockProjected = !!(desired && desired.物资 && typeof desired.物资 === 'object');
          // ★ v1.0 修复：只有「上一轮也真的把物资表投影出去了」时，才允许把
          //   「变量里少了某项」当成 AI 的删除动作。
          //   区块刚被点【显示】的那一轮，变量里本来就没有物资表 —— 上一版会把这当成
          //   「AI 把库存删光了」，于是把玩家本地库存整批删掉（实测可复现）。
          const prevStockActive = (store2.inventory || {}).projectedStockActive === true;
          const ext = v4AdoptExternalMaterials(current, store2, stockProjected && prevStockActive);
          if (ext) {
            const applied = v4ApplyExternalMaterials(ext);
            if (applied) {
              const parts = [];
              if (ext.added.length) parts.push(`新增 ${ext.added.length}`);
              if (ext.modified.length) parts.push(`修改 ${ext.modified.length}`);
              if (ext.removed.length) parts.push(`删除 ${ext.removed.length}`);
              const detail = [...ext.added, ...ext.modified].concat(ext.removed).slice(0, 4).join('、');
              console.log(`[status-bar v4] 采纳外部写入的物资（${parts.join(' / ')}）：${detail}${[...ext.added, ...ext.modified, ...ext.removed].length > 4 ? ' …' : ''}`);
              try {
                if (typeof showV4Toast === 'function') showV4Toast(`已采纳 AI 写入的物资：${parts.join(' / ')}`);
              } catch (e) { }
              try {
                view = v4BuildInventoryView(assets, v4ReloadStore());
                desired = v4BuildInventoryProjection(view);
              } catch (e) { /* 保持原 desired */ }
              try { _cachedData = null; setTimeout(refresh, 80); } catch (e) { }
            }
          }
        }

        // 已经是目标状态 → 什么都不做（这是常态，refresh 每 3 秒跑一次）
        // 注意：比较前先抹掉空容器，否则 schema 的 prefault 会让它永远「不相等」
        if (v4ProjectionKey(current) === v4ProjectionKey(desired)) {
          // 内容一致，但确保两条基线已就位（首次运行 / 旧档升级）
          const wantPool = v4Num(desired.资金池, 0);
          const snapshot = v4ProjectionSnapshotOf(desired, inv);
          const stockNow = !!(desired && desired.物资 && typeof desired.物资 === 'object');
          if (lastProjected !== wantPool || snapshot.changed || inv.projectedStockActive !== stockNow) {
            v4UpdateStore((draft) => {
              draft.inventory.projectedPool = wantPool;
              if (snapshot.value !== null) draft.inventory.projectedSnapshot = snapshot.value;
              draft.inventory.projectedStockActive = stockNow;
              return true;
            });
          }
          return false;
        }

        const ok = await applyTodoWrite((mvuData) => {
          if (!mvuData.stat_data) return false;
          mvuData.stat_data.资产总库存 = v4DeepCopy(desired) || desired;
          return true;
        });
        if (ok) {
          // 记下「这次写出去的」值，下次好分辨是不是被外部改了
          const snapshot = v4ProjectionSnapshotOf(desired, v4ReadStore().inventory || {});
          v4UpdateStore((draft) => {
            draft.inventory.projectedPool = v4Num(desired.资金池, 0);
            if (snapshot.value !== null) draft.inventory.projectedSnapshot = snapshot.value;
            draft.inventory.projectedStockActive = !!(desired && desired.物资 && typeof desired.物资 === 'object');
            return true;
          });
        } else {
          console.warn('[status-bar v4] 库存投影写入 stat_data 失败，将在下次刷新重试');
        }
        return ok;
      };


      const BOND_BRIEF_PATH_PREFIX = '/羁绊列表/';
      const normalizeBriefDisplayPath = (path) => typeof path === 'string' ? path.trim() : '';
      const getBriefDisplayPathList = (data) => {
        const paths = data?.系统配置?.简详显示?.简要显示路径;
        return Array.isArray(paths) ? paths.map(normalizeBriefDisplayPath).filter(Boolean) : [];
      };
      const buildBondBriefDisplayPath = (bondName) => `${BOND_BRIEF_PATH_PREFIX}${bondName}`;
      const isBondDetailVisible = (data, bondName) => !getBriefDisplayPathList(data).includes(buildBondBriefDisplayPath(bondName));
      const DEFAULT_SKILL_SYSTEM_MODE = 'classic';
      const DEFAULT_COMBAT_VALUE_MODE = 'classic';
      const normalizeSkillSystemMode = (mode) => mode === 'combo' ? 'combo' : DEFAULT_SKILL_SYSTEM_MODE;
      const getSkillSystemMode = (data) => normalizeSkillSystemMode(data?.系统配置?.技能系统模式);
      const normalizeCombatValueMode = (mode) => {
        const normalized = String(mode || '').trim().toLowerCase();
        return (normalized === 'new' || normalized === '新版') ? 'new' : DEFAULT_COMBAT_VALUE_MODE;
      };
      const getCombatValueMode = (data) => normalizeCombatValueMode(data?.系统配置?.战斗数值模式);
      const getSkillSlotConfig = (data) => {
        const mode = getSkillSystemMode(typeof data === 'string' ? null : data);
        const raceName = typeof data === 'string' ? data : (data?.人物?.种族 || data?.种族 || '');
        const isElf = raceName === '森精种';
        return {
          mode,
          isElf,
          main: mode === 'combo' ? 9 : (isElf ? 8 : 7),
          awakening: isElf ? 3 : 2
        };
      };
      const COMBO_RELEVANT_TIERS = ['基础', '转职', '进阶', '必杀', '奥义'];
      const COMBO_ADVANCED_GROUP_ORDER = ['alpha', 'beta', 'gamma'];
      const COMBO_GROUP_ORDER = [...COMBO_ADVANCED_GROUP_ORDER, 'ultimate'];
      const getComboSkillState = (data) => {
        const state = data?.系统配置?.组合技能状态 || {};
        return {
          当前高级组: COMBO_ADVANCED_GROUP_ORDER.includes(state.当前高级组) ? state.当前高级组 : 'alpha',
          当前显示槽: state.当前显示槽 === 'ultimate' ? 'ultimate' : 'advanced'
        };
      };
      const getComboDisplayGroupKey = (comboState) => {
        if (comboState?.当前显示槽 === 'ultimate') return 'ultimate';
        return COMBO_ADVANCED_GROUP_ORDER.includes(comboState?.当前高级组) ? comboState.当前高级组 : 'alpha';
      };
      const COMBO_GROUP_LABELS = {
        alpha: 'I',
        beta: 'II',
        gamma: 'III',
        ultimate: '终式'
      };
      const COMBO_GROUP_TRIGGER_LABELS = {
        alpha: 'I',
        beta: 'II',
        gamma: 'III',
        ultimate: '终式'
      };
      const COMBO_GROUP_SLOT_RULES = {

      const autoLearnAndEquipSkills = async (data) => {
        const skillTree = data?.人物?.技能树;
        if (!skillTree || !skillTree.技能列表) return false;
        const charLevel = data?.人物?.等级 || 1;
        const skillList = skillTree.技能列表;
        const 人物 = data?.人物 || {};
        const skillSystemMode = getSkillSystemMode(data);
        if (!人物.主动技能槽) 人物.主动技能槽 = {};
        if (!人物.觉醒技能槽) 人物.觉醒技能槽 = {};
        const patches = [];
        const slotConfig = getSkillSlotConfig(data);
        const projectedSlotCounts = {
          主动技能槽: Object.keys(人物.主动技能槽 || {}).length,
          觉醒技能槽: Object.keys(人物.觉醒技能槽 || {}).length
        };

        Object.entries(skillList).forEach(([skillName, skill]) => {

          if (!tier) return;
          const isUnlocked = charLevel >= tier.习得等级;
          const currentLevel = skill.当前等级 || 0;
          if (isUnlocked && currentLevel === 0) {

            patches.push({ op: 'add', path: `/人物/技能树/技能列表/${skillName}/当前等级`, value: 1 });
            // 尝试自动装备到空槽位

            if (skillSystemMode === 'combo' && !isAwk) return;
            const slotKey = isAwk ? '觉醒技能槽' : '主动技能槽';
            const maxSlots = isAwk ? slotConfig.awakening : slotConfig.main;
            if (!人物[slotKey]?.[skillName]) {
              const equippedCount = projectedSlotCounts[slotKey] || 0;
              if (equippedCount < maxSlots) {
                patches.push({
                  op: 'add',
                  path: `/人物/${slotKey}/${skillName}`,
                  value: {
                    名称: skillName,
                    类型: skill.类型 || '主动',
                    技能等级: 1,
                    冷却中: false,
                    伤害倍率: calcSkillDamage({ ...skill, 当前等级: 1 }, data),
                    阶位: skill.阶位,
                    特殊效果: getSpecialEffectObj({ ...skill, 当前等级: 1 }),
                    描述: skill.描述 || ''
                  }
                });
                projectedSlotCounts[slotKey] = equippedCount + 1;
              }
            }
          }
        });
        if (patches.length > 0) {
          return await applyMvuPatchesAndWait(patches);
        }

      function normalizeWorldbookKeywordList(values) {
        const source = Array.isArray(values) ? values : String(values || '').split(/[\n,，]/);
        const output = [];
        const seen = new Set();
        source.forEach((item) => {
          const text = String(item || '').trim();
          if (!text || seen.has(text)) return;
          seen.add(text);
          output.push(text);
        });
        return output;
      }

      function getCharacterProfileEntryName(name) {
        return `${CHARACTER_PROFILE_ENTRY_PREFIX}${String(name || '').trim()}`;
      }

      function stripYamlCodeFence(text) {
        let value = String(text || '').trim();
        value = value.replace(/^```ya?ml\s*/i, '').trim();
        value = value.replace(/```$/i, '').trim();
        return value;
      }

      function extractCharacterProfileYaml(content) {
        const raw = String(content || '').trim();
        if (!raw) return '';
        const tagPattern = new RegExp(`<${CHARACTER_PROFILE_RESPONSE_TAG}>([\\s\\S]*?)<\\/${CHARACTER_PROFILE_RESPONSE_TAG}>`, 'i');
        const tagMatch = raw.match(tagPattern);
        if (tagMatch && tagMatch[1]) {
          return stripYamlCodeFence(tagMatch[1]);
        }
        const yamlFenceMatch = raw.match(/```ya?ml\s*([\s\S]*?)```/i);
        if (yamlFenceMatch && yamlFenceMatch[1]) {
          return String(yamlFenceMatch[1]).trim();
        }
        const yamlStart = raw.indexOf('---');
        if (yamlStart >= 0) {
          return raw.slice(yamlStart).trim();
        }
        return '';
      }

      function normalizeCharacterProfileAiResponse(result) {
        if (typeof result === 'string') return result;
        if (Array.isArray(result)) {
          return result.map(normalizeCharacterProfileAiResponse).filter(Boolean).join('\n');
        }
        const candidates = [
          result?.message,
          result?.content,
          result?.text,
          result?.response,
          result?.data?.content,
          result?.data?.text,
          result?.choices?.[0]?.message?.content,
          result?.choices?.[0]?.text
        ];
        const resolved = candidates.find((item) => typeof item === 'string' && item.trim());
        return resolved || String(result || '');
      }

      function clonePromptData(value) {
        try {
          return JSON.parse(JSON.stringify(value ?? {}));
        } catch (e) {
          return value ?? {};
        }
      }

      function createCharacterProfileWorldbookDriver() {
        const required = [
          typeof getWorldbookNames === 'function',
          typeof getWorldbook === 'function',
          typeof updateWorldbookWith === 'function',
          typeof createWorldbookEntries === 'function'
        ];
        if (required.some((available) => !available)) {
          return null;
        }
        return {
          async getContext() {
            const charWorldbooksRaw = typeof getCharWorldbookNames === 'function'
              ? getCharWorldbookNames('current')
              : null;
            return {
              worldbookNames: typeof getWorldbookNames === 'function' ? (getWorldbookNames() || []) : [],
              globalWorldbooks: typeof getGlobalWorldbookNames === 'function' ? (getGlobalWorldbookNames() || []) : [],
              chatWorldbook: typeof getChatWorldbookName === 'function' ? (getChatWorldbookName('current') || '') : '',
              charWorldbooks: {
                primary: charWorldbooksRaw?.primary || '',
                additional: Array.isArray(charWorldbooksRaw?.additional) ? charWorldbooksRaw.additional.filter(Boolean) : []
              }
            };
          },
          async getEntries(worldbookName) {
            return await getWorldbook(worldbookName);
          },
          async createEntries(worldbookName, entries) {
            return await createWorldbookEntries(worldbookName, entries, { render: 'immediate' });
          },
          async updateEntry(worldbookName, uid, nextEntry) {
            return await updateWorldbookWith(worldbookName, (worldbook) => worldbook.map((entry) => (
              Number(entry.uid) === Number(uid) ? { ...entry, ...nextEntry } : entry
            )), { render: 'immediate' });
          },
          async deleteEntries(worldbookName, predicate) {
            return await updateWorldbookWith(
              worldbookName,
              (worldbook) => (Array.isArray(worldbook) ? worldbook.filter((entry) => !predicate(entry)) : worldbook),
              { render: 'immediate' }
            );
          }
        };
      }

      async function resolveCharacterProfileWorldbook(driver) {
        const context = await driver.getContext();
        return context?.charWorldbooks?.primary
          || context?.chatWorldbook
          || context?.charWorldbooks?.additional?.[0]
          || context?.globalWorldbooks?.[0]
          || context?.worldbookNames?.[0]
          || '';
      }

      function pickCharacterProfileOrder(entries, ignoreUid = null) {
        const usedInRange = new Set();
        let maxOrder = CHARACTER_PROFILE_ORDER_END;
        (Array.isArray(entries) ? entries : []).forEach((entry) => {
          if (!entry || Number(entry.uid) === Number(ignoreUid)) return;
          const positionType = String(entry?.position?.type || '');
          const order = Number(entry?.position?.order);
          if (positionType !== 'after_character_definition' || !Number.isFinite(order)) return;
          if (order >= CHARACTER_PROFILE_ORDER_START && order <= CHARACTER_PROFILE_ORDER_END) {
            usedInRange.add(order);
          }
          if (order > maxOrder) maxOrder = order;
        });
        for (let order = CHARACTER_PROFILE_ORDER_START; order <= CHARACTER_PROFILE_ORDER_END; order++) {
          if (!usedInRange.has(order)) return order;
        }
        return maxOrder + 1;
      }

      function createCharacterProfileWorldbookEntryPayload({ name, content, keywords, order }) {
        const normalizedKeywords = normalizeWorldbookKeywordList(keywords);
        return {
          name: getCharacterProfileEntryName(name),
          enabled: true,
          strategy: {
            type: normalizedKeywords.length > 0 ? 'selective' : 'constant',
            keys: normalizedKeywords,
            keys_secondary: { logic: 'and_any', keys: [] },
            scan_depth: 'same_as_global'
          },
          position: {
            type: 'after_character_definition',
            role: 'system',
            depth: 0,
            order
          },
          content: String(content || '').trim(),
          probability: 100,
          recursion: {
            prevent_incoming: true,
            prevent_outgoing: true,
            delay_until: null
          },
          effect: {
            sticky: null,
            cooldown: null,
            delay: null
          },
          extra: {
            characterProfileGenerator: {
              sourceName: String(name || '').trim(),
              installedAt: new Date().toISOString()
            }
          }
        };
      }

      async function saveCharacterProfileToWorldbook({ name, content, keywords }) {
        const driver = createCharacterProfileWorldbookDriver();
        if (!driver) {
          throw new Error('当前环境未提供世界书写入接口');
        }
        const worldbookName = await resolveCharacterProfileWorldbook(driver);
        if (!worldbookName) {
          throw new Error('当前没有可写入的目标世界书');
        }
        const entries = await driver.getEntries(worldbookName);
        const entryName = getCharacterProfileEntryName(name);
        const existing = (Array.isArray(entries) ? entries : []).find((entry) => {
          const sameName = String(entry?.name || '').trim() === entryName;
          const sameSource = String(entry?.extra?.characterProfileGenerator?.sourceName || '').trim() === String(name || '').trim();
          return sameName || sameSource;
        });
        const order = pickCharacterProfileOrder(entries, existing?.uid);
        const payload = createCharacterProfileWorldbookEntryPayload({ name, content, keywords, order });
        if (existing) {
          await driver.updateEntry(worldbookName, existing.uid, {
            ...existing,
            ...payload,
            extra: {
              ...(existing.extra || {}),
              ...(payload.extra || {})
            }
          });
        } else {
          await driver.createEntries(worldbookName, [payload]);
        }
        return { worldbookName, order, updated: !!existing };
      }

      function shouldInlineCharacterProfileChatReference() {
        const targetWindow = getParent();
        const phoneApiConfig = targetWindow.phoneForumManager?.apiConfig;
        return !!(phoneApiConfig && phoneApiConfig.isAvailable());

      function getCharacterProfileChatData() {
        try {
          const targetWindow = getParent();
          if (targetWindow.SillyTavern && typeof targetWindow.SillyTavern.getContext === 'function') {
            const ctx = targetWindow.SillyTavern.getContext();
            if (ctx && Array.isArray(ctx.chat) && ctx.chat.length > 0) {

            </div>
            <div class="f-content">
              <div class="f-data-group">
                ${spCost > 0 ? `<div class="f-data-row"><span class="f-data-label"><i class="ri-star-line"></i> SP消耗/级</span><span class="f-data-val">${spCost}</span></div>` : ''}
                ${cd > 0 ? `<div class="f-data-row"><span class="f-data-label"><i class="ri-timer-line"></i> 冷却</span><span class="f-data-val">${cd} 回合</span></div>` : ''}
                ${dmg > 0 ? `<div class="f-data-row"><span class="f-data-label"><i class="ri-sword-line"></i> 伤害倍率</span><span class="f-data-val val-positive">${dmg}%</span></div>` : ''}

            </div>
            ${(canManageSlot || canManageComboSlot) ? `<div style="display:flex;gap:8px;padding:12px 16px;border-top:1px solid #f0f0f0;">
              <button class="skill-action-btn skill-unequip" style="flex:1;padding:8px;border:1px solid #e0e0e0;border-radius:8px;background:#fff;cursor:pointer;font-size:0.75rem;color:#e74c3c;font-weight:600;">
                <i class="ri-delete-back-2-line"></i> 卸下
              </button>
              ${(canManageSlot || canManageComboSlot) && availableOthers.length > 0 ? `<button class="skill-action-btn skill-change" style="flex:1;padding:8px;border:1px solid #dfe6e9;border-radius:8px;background:#f8f9fa;cursor:pointer;font-size:0.75rem;color:var(--text-main);font-weight:600;">
                <i class="ri-refresh-line"></i> 更换
              </button>` : ''}
            </div>` : ''}
          </div>
        </div>`;
        app.insertAdjacentHTML('afterend', html);
        // 卸下
        if (canManageSlot || canManageComboSlot) {
          document.querySelector('.skill-unequip')?.addEventListener('click', () => {
            // 战斗中禁止更换技能
            if (isInBattle()) { showBattleWarning('战斗中无法更换技能'); return; }
            if (canManageComboSlot) {
              const ok = setComboSlotAssignment(slotMeta, '');
              if (!ok) return;
              removePopup();
              setTimeout(refresh, 100);
              return;
            }
            applyMvuPatches([
              { op: 'remove', path: `/人物/${slotType}/${skillName}` },
              // 同步更新技能列表中的是否装备状态
              { op: 'replace', path: `/人物/技能树/技能列表/${skillName}/是否装备`, value: false }
            ]);
            removePopup();
            setTimeout(refresh, 100);
          });
        }
        if (canManageSlot || canManageComboSlot) {
          document.querySelector('.skill-change')?.addEventListener('click', () => {
            // 战斗中禁止更换技能
            if (isInBattle()) { showBattleWarning('战斗中无法更换技能'); return; }
            removePopup();
            openSkillPicker(slotType, skillName, slotMetaRaw);
          });
        }
        bindPopupClose();
      };


      const clearEquippedSkillSlot = (slotType, replaceSkillName, slotMetaRaw) => {
        if (!replaceSkillName) return false;
        if (isInBattle()) { showBattleWarning('战斗中无法更换技能'); return false; }
        const slotMeta = parseSlotMeta(slotMetaRaw);
        if (slotMeta && slotMeta.comboSlot) {
          const ok = setComboSlotAssignment(slotMeta, '');
          if (ok) setTimeout(refresh, 100);
          return ok;
        }
        if (!slotType) return false;
        applyMvuPatches([
          { op: 'remove', path: `/人物/${slotType}/${replaceSkillName}` },
          { op: 'replace', path: `/人物/技能树/技能列表/${replaceSkillName}/是否装备`, value: false }
        ]);
        setTimeout(refresh, 100);
        return true;
      };

      // 技能选择器
      const openSkillPicker = (slotType, replaceSkillName, slotMetaRaw) => {
        document.getElementById('combo-picker-overlay')?.remove();
        const d = fetchLatestMvuData();
        const skillTree = d?.人物?.技能树 || {};
        const 技能列表 = skillTree.技能列表 || {};
        const slotMeta = parseSlotMeta(slotMetaRaw);
        const equippedAll = new Set([
          ...Object.keys(d?.人物?.主动技能槽 || {}),
          ...Object.keys(d?.人物?.觉醒技能槽 || {})
        ]);
        const isAwk = slotType === '觉醒技能槽';
        const awkTiers = new Set(['觉醒一', '觉醒二', '觉醒三']);

        const charLevel = d?.人物?.等级 || 1;
        let available = [];
        if (slotMeta && slotMeta.comboSlot) {
          const comboState = getComboEquipState(d);
          const activeNames = new Set(getComboActiveSkillNames(comboState, slotMeta.groupKey));
          if (replaceSkillName) activeNames.delete(replaceSkillName);
          available = Object.entries(技能列表).filter(([name, skill]) => {
            if (name === replaceSkillName) return false;
            if (activeNames.has(name)) return false;
            if ((skill?.当前等级 || 0) === 0) return false;
            const tierCfg = TIER_CONFIG[skill.阶位 || ''];
            if (tierCfg && charLevel < tierCfg.习得等级) return false;
            return (slotMeta.allowedTiers || []).includes(skill.阶位 || '');
          });
        } else {
          available = Object.entries(技能列表).filter(([name, skill]) => {
            if (equippedAll.has(name)) return false;
            const t = skill.阶位 || '基础';
            if (isAwk ? !awkTiers.has(t) : awkTiers.has(t)) return false;
            // 只显示当前等级已解锁的技能
            const tierCfg = TIER_CONFIG[t];
            if (tierCfg && charLevel < tierCfg.习得等级) return false;
            // 只显示已学习的技能（等级 > 0）
            if ((skill.当前等级 || 0) === 0) return false;
            return true;
          });
        }

        const canClearCurrent = !!replaceSkillName && (!!slotType || (slotMeta && slotMeta.comboSlot));
        if (available.length === 0 && !canClearCurrent) {
          showBattleWarning((slotMeta && slotMeta.comboSlot) ? `${slotMeta.title} 没有可装备技能` : '当前没有可装备技能');
          return;
        }

        const pickerSlotMetaAttr = slotMeta ? (" data-slot-meta='" + encodeSlotMeta(slotMeta) + "'") : '';
        let listHtml = '';
        if (canClearCurrent) {
          const clearSlotLabel = (slotMeta && slotMeta.comboSlot)
            ? (slotMeta.title || '当前槽位')
            : (isAwk ? '当前觉醒槽位' : '当前技能槽');
          listHtml += `<div class="combo-picker-item current" data-clear-skill-slot="1" data-slot-type="${slotType || ''}" data-replace-skill="${replaceSkillName}"${pickerSlotMetaAttr}>
            <div class="combo-picker-avatar-placeholder" style="background:#fff5f5;color:#c0392b;">
              <i class="ri-delete-back-2-line"></i>
            </div>
            <div class="combo-picker-info">
              <div class="combo-picker-bond-name">卸下当前技能</div>
              <div class="combo-picker-skill-name" style="color:#c0392b">${replaceSkillName} · ${clearSlotLabel}</div>
            </div>
          </div>`;
        }
        available.forEach(([name, skill]) => {
          const tier = skill.阶位 || '基础';
          const tierColor = tierColors[tier] || '#95a5a6';
          const lv = skill.当前等级 || 0;
          const typeStr = skill.类型 || '主动';
          const iconSvg = getSkillSvg(typeStr, tier);
          listHtml += `<div class="combo-picker-item" data-equip-skill="${name}" data-slot-type="${slotType}"${pickerSlotMetaAttr}>
            <div style="width:32px;height:32px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:${tierColor};">${iconSvg}</div>
            <div class="combo-picker-info">
              <div class="combo-picker-bond-name">${name}</div>
              <div class="combo-picker-skill-name" style="color:var(--text-sub)">${typeStr} · ${tier} · Lv.${lv}</div>
            </div>
          </div>`;
        });

        const allowedTierLabel = (slotMeta && slotMeta.allowedTiers) ? slotMeta.allowedTiers.join('/') : '';
        const title = (slotMeta && slotMeta.comboSlot)
          ? `选择${allowedTierLabel || ''}技能`
          : (isAwk ? '选择觉醒技能' : '选择技能');
        const overlayHtml = `<div class="combo-picker-overlay" id="combo-picker-overlay">
          <div class="combo-picker">
            <div class="combo-picker-title" style="color:var(--text-main)"><i class="ri-sword-line"></i> ${title}</div>
            <div class="combo-picker-list">${listHtml}</div>
          </div>
        </div>`;
        document.body.insertAdjacentHTML('beforeend', overlayHtml);
        const overlay = document.getElementById('combo-picker-overlay');
        requestAnimationFrame(() => overlay?.classList.add('show'));
        overlay?.addEventListener('click', (e) => {
          if (e.target === overlay) { overlay.remove(); return; }
          const clearItem = e.target.closest('[data-clear-skill-slot]');
          if (clearItem) {
            const cleared = clearEquippedSkillSlot(clearItem.dataset.slotType, clearItem.dataset.replaceSkill, clearItem.dataset.slotMeta);
            if (cleared) overlay.remove();
            return;
          }
          const item = e.target.closest('[data-equip-skill]');
          if (!item) return;
          const equipped = equipSkillToSlot(item.dataset.equipSkill, item.dataset.slotType, replaceSkillName, item.dataset.slotMeta);
          if (equipped) overlay.remove();
        });
      };

      const equipSkillToSlot = (skillName, slotType, replaceSkillName, slotMetaRaw) => {
        // 战斗中禁止更换技能
        if (isInBattle()) { showBattleWarning('战斗中无法更换技能'); return false; }
        const d = fetchLatestMvuData();
        const skill = d?.人物?.技能树?.技能列表?.[skillName] || {};
        const slotMeta = parseSlotMeta(slotMetaRaw);
        if (slotMeta && slotMeta.comboSlot) {
          const ok = setComboSlotAssignment(slotMeta, skillName);
          if (!ok) return false;
          setTimeout(refresh, 100);
          return true;
        }
        const slotConfig = getSkillSlotConfig(d);
        const isAwk = slotType === '觉醒技能槽';
        const maxSlots = isAwk ? slotConfig.awakening : slotConfig.main;
        const currentCount = Object.keys(d?.人物?.[slotType] || {}).length;
        if (!replaceSkillName && currentCount >= maxSlots) {
          showBattleWarning(`${isAwk ? '觉醒' : '主动'}技能槽已满`);
          return false;
        }
        const slotData = {
          名称: skillName,
          类型: skill.类型 || '主动',
          技能等级: skill.当前等级 || 1,
          冷却中: false,
          伤害倍率: calcSkillDamage({ ...skill, 当前等级: skill.当前等级 || 1 }, d),
          阶位: skill.阶位 || '基础',
          特殊效果: getSpecialEffectObj({ ...skill, 当前等级: skill.当前等级 || 1 }),
          描述: skill.描述 || ''
        };
        if (skill.召唤物名称) slotData.召唤物名称 = skill.召唤物名称;
        const patches = [];
        if (replaceSkillName) {
          patches.push({ op: 'remove', path: `/人物/${slotType}/${replaceSkillName}` });
          // 同步更新被替换技能的是否装备状态
          patches.push({ op: 'replace', path: `/人物/技能树/技能列表/${replaceSkillName}/是否装备`, value: false });
        }
        patches.push({ op: 'add', path: `/人物/${slotType}/${skillName}`, value: slotData });
        // 同步更新技能列表中的是否装备状态
        patches.push({ op: 'replace', path: `/人物/技能树/技能列表/${skillName}/是否装备`, value: true });
        const applied = applyMvuPatches(patches);
        if (!applied) {
          showBattleWarning('技能装备失败：MVU 数据未就绪');
          return false;
        }
        setTimeout(refresh, 100);
        return true;
      };

      const getDataUrlByteSize = (dataUrl) => {
        try {
          const base64 = String(dataUrl || '').split(',')[1] || '';
          return Math.ceil(base64.length * 3 / 4);
        } catch (e) {
          return Number.MAX_SAFE_INTEGER;
        }
      };

      const compressAvatarImage = (file, opts = {}) => new Promise((resolve, reject) => {
        if (!file) return reject(new Error('no_file'));
        const maxSide = opts.maxSide || 512;
        const maxBytes = opts.maxBytes || 240 * 1024;
        const minQuality = opts.minQuality || 0.5;
        let quality = opts.quality || 0.85;

        const reader = new FileReader();
        reader.onerror = () => reject(new Error('read_failed'));
        reader.onload = () => {
          const img = new Image();
          img.onerror = () => reject(new Error('decode_failed'));
          img.onload = () => {
            const longest = Math.max(img.width, img.height) || 1;
            const scale = Math.min(1, maxSide / longest);
            const targetW = Math.max(1, Math.round(img.width * scale));
            const targetH = Math.max(1, Math.round(img.height * scale));
            const canvas = document.createElement('canvas');
            canvas.width = targetW;
            canvas.height = targetH;
            const ctx = canvas.getContext('2d');
            if (!ctx) return reject(new Error('canvas_failed'));
            ctx.drawImage(img, 0, 0, targetW, targetH);

            let out = canvas.toDataURL('image/jpeg', quality);
            while (getDataUrlByteSize(out) > maxBytes && quality > minQuality) {
              quality = Math.max(minQuality, quality - 0.1);
              out = canvas.toDataURL('image/jpeg', quality);
            }
            resolve(out);
          };
          img.src = String(reader.result || '');
        };
        reader.readAsDataURL(file);
      });

      // 暴露给 window 以便 innerHTML onclick 调用
      window.triggerAvatarUpload = (name) => {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*';
        input.onchange = async (e) => {
          const file = e.target.files[0];
          if (!file) return;
          try {
            const base64 = await compressAvatarImage(file, { maxSide: 512, maxBytes: 240 * 1024, quality: 0.85, minQuality: 0.5 });
            // 仅持久化到 localStorage，不写入 MVU
            localStorage.setItem('rpg_bond_avatar_' + name, base64);
            _cachedData = null;
            setTimeout(refresh, 100);
          } catch (err) {
            console.warn('羁绊头像处理失败:', err);
          }
        };
        input.click();
      };

      // 统一获取羁绊头像：localStorage > MVU > 预设
      const getBondAvatar = (name, bond) => {
        try { const v = localStorage.getItem('rpg_bond_avatar_' + name); if (v) return v; } catch (e) { }
        return bond?.头像 || getPresetAvatar(name) || '';
      };

      // 清理不再存在的羁绊头像缓存，防止 localStorage 泄漏
      const cleanBondAvatarCache = (currentBondNames) => {
        try {
          const prefix = 'rpg_bond_avatar_';
          const keysToRemove = [];
          for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            if (key && key.startsWith(prefix)) {
              const name = key.slice(prefix.length);
              if (!currentBondNames.has(name)) keysToRemove.push(key);
            }
          }
          keysToRemove.forEach(k => localStorage.removeItem(k));
        } catch (e) { }
      };

      // 玩家主角头像上传
      window.triggerPlayerAvatarUpload = () => {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*';
        input.onchange = async (e) => {
          const file = e.target.files[0];
          if (!file) return;
          try {
            const base64 = await compressAvatarImage(file, { maxSide: 512, maxBytes: 240 * 1024, quality: 0.85, minQuality: 0.5 });
            localStorage.setItem('rpg_player_avatar', base64);
            _cachedData = null;
            setTimeout(refresh, 100);
          } catch (err) {
            console.warn('头像处理失败:', err);
          }
        };
        input.click();
      };

      // 渲染羁绊详情到右侧面板
      // 渲染羁绊详情到右侧面板 (Bento Layout)
      let bondUpgradeBusy = false;
      const renderBondDetail = (name, data) => {
        const container = document.getElementById('bond-container');
        const pane = document.getElementById('bond-detail-container');
        if (!pane || !container) return;

        // 品质颜色映射
        const qualityColorMap = {
          '普通': '#2D3436',
          '精良': '#0047AB',
          '稀有': '#9b59b6',
          '卓越': '#e84393',
          '传说': '#e67e22',
          '史诗': '#C9A227',
          '神话': '#e8198b'
        };
        const getQualityColor = (q) => qualityColorMap[normalizeQualityName(q)] || qualityColorMap['普通'];
        const qualityBadgeMap = {
          '普通': { bg: 'rgba(45, 52, 54, 0.08)', color: '#636e72', border: 'rgba(45, 52, 54, 0.12)' },
          '精良': { bg: 'rgba(0, 71, 171, 0.08)', color: '#0047AB', border: 'rgba(0, 71, 171, 0.15)' },
          '稀有': { bg: 'rgba(155, 89, 182, 0.08)', color: '#9b59b6', border: 'rgba(155, 89, 182, 0.15)' },
          '卓越': { bg: 'rgba(232, 67, 147, 0.08)', color: '#e84393', border: 'rgba(232, 67, 147, 0.15)' },
          '传说': { bg: 'rgba(230, 126, 34, 0.08)', color: '#e67e22', border: 'rgba(230, 126, 34, 0.15)' },
          '史诗': { bg: 'rgba(201, 162, 39, 0.08)', color: '#C9A227', border: 'rgba(201, 162, 39, 0.15)' },
          '神话': { bg: 'rgba(232, 25, 139, 0.08)', color: '#e8198b', border: 'rgba(232, 25, 139, 0.15)' }
        };
        const getQualityBadgeStyle = (q) => q ? (qualityBadgeMap[normalizeQualityName(q)] || null) : null;

        container.classList.add('mode-detail'); // 切换到紧凑模式

        const gender = data.性别 || '未知';
        const race = data.种族 || '未知';
        const level = data.等级 || 1;
        const stats = data.属性 || {};
        const skills = data.技能 || {};
        const equips = data.装备列表 || {};
        const comboSkills = data.连携奥义 || {};
        const avatar = getBondAvatar(name, data);
        const favor = data.好感度 || 0;
        const favorMax = 100;
        const favorPct = Math.min(100, Math.max(0, ((favor + favorMax) / (favorMax * 2)) * 100));
        const detailVisible = isBondDetailVisible(fetchLatestMvuData(), name);
        const isSeaBond = fetchLatestMvuData()?.系统配置?.世界观 === '诡秘地海';

        const fmtNum = (n) => Number.isFinite(n)
          ? (Math.abs(n - Math.round(n)) < 0.001 ? String(Math.round(n)) : String(Math.round(n * 10) / 10))
          : '0';

        const hpCurrent = Number(data.当前生命值);
        const hpMax = Number(data.生命值上限);
        const hasHpBar = Number.isFinite(hpCurrent) && Number.isFinite(hpMax) && hpMax > 0;
        const safeHpCurrent = hasHpBar ? Math.min(Math.max(hpCurrent, 0), hpMax) : 0;
        const hpPct = hasHpBar ? Math.min(100, Math.max(0, (safeHpCurrent / hpMax) * 100)) : 0;

        const bondSanMax = Number(data.理智值上限);
        const bondSanCurrent = Number(data.理智值);
        const hasBondSan = isSeaBond && Number.isFinite(bondSanMax) && bondSanMax > 0 && Number.isFinite(bondSanCurrent);
        const safeBondSan = hasBondSan ? Math.min(Math.max(Math.floor(bondSanCurrent), 0), Math.floor(bondSanMax)) : 0;
        const bondSanPct = hasBondSan ? safeBondSan / bondSanMax * 100 : 0;

        const expCurrent = Number(data.当前总经验);
        const safeExpCurrent = Number.isFinite(expCurrent) ? Math.max(0, Math.floor(expCurrent)) : 0;
        const safeLevel = Math.min(100, Math.max(1, Math.floor(Number(level) || 1)));
        const calcTh = (lv) => { let t = 0; for (let L = 1; L < lv; L++) t += Math.floor(100 * Math.pow(L, 1.5)); return t; };
        const poolValue = Number(fetchLatestMvuData()?.队友成长?.经验池?.[name]);
        const expPool = Number.isFinite(poolValue) ? Math.max(0, Math.floor(poolValue)) : 0;
        const upgradeCost = Math.max(0, calcTh(safeLevel + 1) - Math.max(calcTh(safeLevel), safeExpCurrent));
        const maxLevel = safeLevel >= 100;
        const canUpgrade = !maxLevel && expPool >= upgradeCost;
        const poolPct = maxLevel || upgradeCost === 0 ? 100 : Math.min(100, expPool / upgradeCost * 100);

        const resourceCardHTML = `
                <div class="bd-card bd-resource-card">
                  <div class="bd-card-title"><i class="ri-heart-pulse-line"></i> 状态</div>
                  <div class="bd-resource-grid">
                    ${hasHpBar ? `
                      <div class="bd-resource-row">
                        <div class="bd-resource-top">
                          <span class="bd-resource-name"><i class="ri-heart-3-line"></i>HP</span>
                          <span class="bd-resource-value">${fmtNum(safeHpCurrent)} / ${fmtNum(hpMax)}</span>
                        </div>
                        <div class="bd-resource-track"><div class="bd-resource-fill hp" style="width:${hpPct}%"></div></div>
                      </div>
                    ` : ''}
                    ${hasBondSan ? `
                      <div class="bd-resource-row">
                        <div class="bd-resource-top">
                          <span class="bd-resource-name"><i class="ri-mental-health-line"></i>SAN</span>
                          <span class="bd-resource-value">${fmtNum(safeBondSan)} / ${fmtNum(bondSanMax)}</span>
                        </div>
                        <div class="bd-resource-track"><div class="bd-resource-fill san" style="width:${bondSanPct}%"></div></div>
                      </div>
                    ` : ''}
                      <div class="bd-resource-row bd-growth-row">
                        <div class="bd-resource-top">
                          <span class="bd-resource-name"><i class="ri-inbox-archive-line"></i>经验池</span>
                          <span class="bd-resource-value bd-growth-pool">${fmtNum(expPool)}</span>
                        </div>
                        <div class="bd-resource-track"><div class="bd-resource-fill exp" style="width:${poolPct}%"></div></div>
                        <div class="bd-growth-footer">
                          <span class="bd-growth-cost">${maxLevel ? 'Lv.100 · 已满级' : `Lv.${safeLevel} → ${safeLevel + 1} · 需要 ${fmtNum(upgradeCost)}`}</span>
                          <button type="button" class="bd-growth-upgrade" data-bond-upgrade="${encodeURIComponent(name)}" ${canUpgrade && !bondUpgradeBusy ? '' : 'disabled'}>${maxLevel ? '已满级' : canUpgrade ? '升级' : '经验不足'}</button>

            ${Object.entries(comboSkills).length > 0 ? `

                        <span><i class="ri-links-line" style="color: #f39c12; margin-right: 4px;"></i>${k}</span><span style="color: #e67e22;">${v.类型 || '连携'}</span>

                </div>

                ${extraEntries.length > 0 ? `

                  <div class="bd-info-row">
                    ${extraEntries.map(([k, v]) => {
            const val = typeof v === 'object' ? JSON.stringify(v) : v;
            return `<div class="bd-info-item"><span>${k}</span><span>${val}</span></div>`;

        pane.innerHTML = html;

        if (generateBtn) {

        const registerBtn = pane.querySelector('[data-register-nearby-bond="true"]');
        if (registerBtn) {

      window.closeNearbyDetail = () => {

        if (pane) pane.innerHTML = '';

      const renderBusinessDetail = () => { };
      window.closeBusinessDetail = () => {
        document.querySelectorAll('.asset-card.expanded').forEach(c => c.classList.remove('expanded'));

      window.renameBusinessAsset = (oldName) => {
        const data = fetchLatestMvuData();
        const assets = data?.核心资产 || {};
        if (!oldName || !assets?.[oldName]) return;
        showInputDialog(`重命名资产「${oldName}」`, {
          title: '重命名资产',

          defaultValue: oldName,

        }).then(({ confirmed, value }) => {
          if (!confirmed) return;

          const newName = String(value || '').trim();
          if (!newName) return showBattleWarning('名称不能为空');
          if (newName === oldName) return;
          if (/[\\/]/.test(newName)) return showBattleWarning('名称不能包含 / 或 \\\\');
          if (assets[newName]) return showBattleWarning('已存在同名资产');

          const targetAsset = assets[oldName];
          const success = applyMvuPatches([
            { op: 'add', path: `/核心资产/${newName}`, value: targetAsset },
            { op: 'remove', path: `/核心资产/${oldName}` }
          ]);

          if (success) {
            if (_activeBusinessAsset === oldName) _activeBusinessAsset = newName;

      window.deleteNearbyPerson = (name) => {

      window.clearRumorCategory = (rumorTab) => {

        showBattleConfirm(`确定一键清除「${label}」中的全部传闻吗？`, { title: '清空确认', okText: '确认清空', cancelText: '取消' })

              { op: 'remove', path: targetPath },
