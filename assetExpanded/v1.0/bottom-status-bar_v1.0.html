              if (!table || typeof table !== 'object' || !(projName in table)) return false;
              delete table[projName];
              return true;
            }).then(() => {
              _cachedData = null;
              setTimeout(refresh, 80);
            });
          });
      };

      // ---------- 长线项目：一键隐藏所有已完成 / 已到期 ----------
      window.v4HideAllDoneProjects = (assetName) => {
        if (!assetName) return;
        const asset = fetchLatestMvuData()?.核心资产?.[assetName];
        if (!asset) { showBattleWarning('未找到该资产'); return; }
        const nowOrdinal = v4CurrentWorldOrdinal();
        const source = (asset.长线项目 && typeof asset.长线项目 === 'object') ? asset.长线项目 : {};
        const targets = [];
        Object.entries(source).forEach(([name, raw]) => {
          const proj = v4NormalizeProject(name, raw);
          const progress = v4ComputeProgress(proj, nowOrdinal);
          if (v4ShouldArchive(proj, nowOrdinal, progress)) {
            const snap = v4DeepCopy(raw);
            targets.push({ name, raw: snap === null ? raw : snap });
          }
        });
        if (targets.length === 0) { showBattleWarning('该资产没有已完成 / 已到期的长线项目'); return; }
        const stored = v4UpdateStore((draft) => {
          if (!draft.projectArchived[assetName]) draft.projectArchived[assetName] = {};
          targets.forEach(({ name, raw }) => {
            draft.projectArchived[assetName][name] = raw;
            // 玩家明确要求隐藏这些已完成项目 → 撤销【显示】保留名单
            if (draft.projectKeep?.[assetName]?.[name]) delete draft.projectKeep[assetName][name];
          });
          return true;
        });
        if (!stored) { showBattleWarning('隐藏失败：无法写入扩展存储'); return; }
        applyTodoWrite((mvuData) => {
          const table = mvuData.stat_data?.核心资产?.[assetName]?.长线项目;
          if (!table || typeof table !== 'object') return false;
          let changed = false;
          targets.forEach(({ name }) => { if (name in table) { delete table[name]; changed = true; } });
          return changed;
        }).then(() => {
          _cachedData = null;
          setTimeout(refresh, 80);
        });
      };

      // ---------- 长线项目：自动归档扫描（refresh 时调用） ----------
      // 做两件事：
      //   ① 到期 / 已完成的项目 → 自动判定进入隐藏（归档）状态，计入归档列表 → 不再发送给 AI
      //   ② 玩家【隐藏】或【删除】过的项目，若被 AI 又写回变量 → 再次摘除（保证隐藏是真的隐藏）
      const v4SweepArchivedProjects = async (statData) => {
        const assets = statData?.核心资产;
        if (!assets || typeof assets !== 'object') return false;
        const store = v4ReadStore();
        const nowOrdinal = v4CurrentWorldOrdinal();
        const targets = [];    // { assetName, name, raw }  raw=null 表示只删除不归档
        Object.entries(assets).forEach(([assetName, asset]) => {
          const table = (asset && typeof asset.长线项目 === 'object' && asset.长线项目) ? asset.长线项目 : null;
          if (!table) return;
          Object.entries(table).forEach(([name, raw]) => {
            // ② 玩家已删除 / 已手动隐藏的项目不该出现在变量里
            if (store.projectDeleted?.[assetName]?.[name]) { targets.push({ assetName, name, raw: null }); return; }
            if (store.projectHidden?.[assetName]?.[name]) { targets.push({ assetName, name, raw: null }); return; }
            // ③ 玩家点过【显示】/【恢复】的项目：尊重玩家意愿，不再自动归档
            //    （否则已到期的项目刚恢复就被收走，看起来像「恢复没反应」）
            if (store.projectKeep?.[assetName]?.[name]) return;
            // ④ 到期 / 已完成 → 归档
            if (nowOrdinal === null) return;
            const proj = v4NormalizeProject(name, raw);
            const progress = v4ComputeProgress(proj, nowOrdinal);
            if (v4ShouldArchive(proj, nowOrdinal, progress)) {
              const snap = v4DeepCopy(raw);
              targets.push({ assetName, name, raw: snap === null ? raw : snap });
            }
          });
        });
        if (targets.length === 0) return false;
        const toArchive = targets.filter(t => t.raw !== null);
        if (toArchive.length > 0) {
          const stored = v4UpdateStore((draft) => {
            toArchive.forEach(({ assetName, name, raw }) => {
              if (!draft.projectArchived[assetName]) draft.projectArchived[assetName] = {};
              draft.projectArchived[assetName][name] = raw;
            });
            return true;
          });
          if (!stored) return false;
        }
        const removed = await applyTodoWrite((mvuData) => {
          let changed = false;
          targets.forEach(({ assetName, name }) => {
            const table = mvuData.stat_data?.核心资产?.[assetName]?.长线项目;
            if (table && typeof table === 'object' && (name in table)) { delete table[name]; changed = true; }
          });
          return changed;
        });
        return removed;
      };

      // ---------- 常态收益：隐藏 / 显示 ----------
      window.v4HideIncome = (assetName, key) => {
        const { seqName, idx } = v4ParseIncomeKey(key);
        if (!assetName || !seqName) return;
        const items = v4CollectIncome(assetName, fetchLatestMvuData()?.核心资产?.[assetName], v4ReadStore());
        const target = items.find(i => i.key === key);
        const stored = v4UpdateStore((draft) => {
          if (!draft.incomeHidden[assetName]) draft.incomeHidden[assetName] = {};
          draft.incomeHidden[assetName][seqName] = target
            ? { resource: target.resource, qty: target.qty, unit: target.unit, kind: target.kind, polarity: target.polarity, note: target.note, idx }
            : { idx };
          return true;
        });
        if (!stored) { showBattleWarning('隐藏失败：无法写入扩展存储'); return; }
        _cachedData = null;
        setTimeout(refresh, 80);
      };
      window.v4ShowIncome = (assetName, key) => {
        const { seqName } = v4ParseIncomeKey(key);
        if (!assetName || !seqName) return;
        v4UpdateStore((draft) => {
          if (draft.incomeHidden?.[assetName]?.[seqName] === undefined) return false;
          delete draft.incomeHidden[assetName][seqName];
          return true;
        });
        _cachedData = null;
        setTimeout(refresh, 80);
      };
      window.v4ShowAllIncome = (assetName) => {
        if (!assetName) return;
        v4UpdateStore((draft) => {
          if (!draft.incomeHidden?.[assetName]) return false;
          delete draft.incomeHidden[assetName];
          return true;
        });
        _cachedData = null;
        setTimeout(refresh, 80);
      };

      // ---------- 常态收益：结构化表单（添加 / 编辑共用） ----------
      // ★ v0.4.07 改动背景（用户实测反馈问题 3）：
      //   旧「手动添加」是让玩家写一句自然语言，再由 v4ParseIncomeFromText 正则猜。
      //   只填「C类铁矿」抽不出「数量 + 单位」→ 被归成「抽象收益」，
      //   用户原话：「只能归类为抽象收益，也就是说在添加的时候就必须按格式来？
      //             是这样的话是要声明和说清楚的。」
      //   所以这里改成**结构化表单**（名称 / 数量 / 单位 / 方向 / 分类），
      //   与【编辑常态收益】弹窗完全一致 —— 玩家填什么就是什么，不再靠正则猜。
      const v4IncomeKindChip = (kind) => kind === 'currency' ? '通用币'
        : (kind === 'abstract' ? '抽象收益' : '物资');
      // 表单字段 HTML（添加 / 编辑共用，避免两处样式与语义漂移）
      const v4IncomeFormHtml = (f) => `
            <label style="font-size:0.74rem;font-weight:700;color:var(--v4-sub)">物资 / 项目名称
              <input class="v4-input" data-f="resource" value="${v4Attr(f.resource)}" placeholder="如：铁矿 / 通用币 / 声望" style="margin-top:4px">
            </label>
            <div style="display:flex;gap:9px">
              <label style="flex:1;font-size:0.74rem;font-weight:700;color:var(--v4-sub)">数量
                <input class="v4-input" data-f="qty" type="number" step="any" min="0" value="${v4Attr(f.qty)}" style="margin-top:4px">
              </label>
              <label style="flex:1;font-size:0.74rem;font-weight:700;color:var(--v4-sub)">单位
                <input class="v4-input" data-f="unit" value="${v4Attr(f.unit)}" placeholder="吨 / 单位 / 个" style="margin-top:4px">
              </label>
            </div>
            <div style="display:flex;gap:9px">
              <label style="flex:1;font-size:0.74rem;font-weight:700;color:var(--v4-sub)">方向
                <select class="v4-input" data-f="polarity" style="margin-top:4px">
                  <option value="produce"${f.polarity === 'produce' ? ' selected' : ''}>产出（+）</option>
                  <option value="consume"${f.polarity === 'consume' ? ' selected' : ''}>消耗（−）</option>
                </select>
              </label>
              <label style="flex:1;font-size:0.74rem;font-weight:700;color:var(--v4-sub)">分类
                <select class="v4-input" data-f="kind" style="margin-top:4px">
                  <option value="material"${f.kind === 'material' ? ' selected' : ''}>物资</option>
                  <option value="currency"${f.kind === 'currency' ? ' selected' : ''}>通用币</option>
                  <option value="abstract"${f.kind === 'abstract' ? ' selected' : ''}>抽象收益</option>
                </select>
              </label>
            </div>
            <label style="font-size:0.74rem;font-weight:700;color:var(--v4-sub)">备注
              <textarea class="v4-textarea" data-f="note" placeholder="原始描述 / 说明">${v4Esc(f.note)}</textarea>
            </label>
            <div class="v4-income-preview" data-income-preview="1"></div>`;
      // 实时预览：把表单当前值翻译成「会记成什么」，避免玩家填完才发现不是想要的
      const v4BindIncomeForm = (overlay, onSave) => {
        const read = (f) => {
          const el = overlay.querySelector(`[data-f="${f}"]`);
          return el ? el.value : '';
        };
        const collect = () => {
          const kind = ['material', 'currency', 'abstract'].includes(read('kind')) ? read('kind') : 'material';
          return {
            resource: v4Text(read('resource')),
            qty: Math.abs(v4Num(read('qty'), 0)),
            unit: v4Text(read('unit')),
            polarity: read('polarity') === 'consume' ? 'consume' : 'produce',
            kind,
            note: v4Text(read('note'))
          };
        };
        const paint = () => {
          const box = overlay.querySelector('[data-income-preview]');
          if (!box) return;
          const v = collect();
          if (!v.resource && v.kind !== 'abstract') {
            box.innerHTML = '<i class="ri-information-line"></i>填上名称后，这里会显示这条收益最终会被记成什么';
            return;
          }
          const dir = v.polarity === 'consume' ? '消耗' : '产出';
          const kindLabel = v4IncomeKindChip(v.kind);
          // 抽象收益不参与数量统计，必须显式说明 ——
          // 用户反馈的原文就是「只能归类为抽象收益…是要声明和说清楚的」
          const amount = v.kind === 'abstract'
            ? '<span class="v4-income-preview-warn">（抽象收益：只记一句描述，不参与数量统计）</span>'
            : `${v4FmtQty(v.qty)}${v.unit ? ' ' + v4Esc(v.unit) : ''}`;
          box.innerHTML = `<i class="ri-eye-line"></i>将记录为：<b>${v4Esc(v.resource || v.note || '抽象收益')}</b>`
            + ` · <b>${v4Esc(kindLabel)}</b>`
            + (v.kind === 'abstract' ? '' : ` · ${amount}`)
            + ` · <b>${dir}</b>`
            + (v.kind === 'abstract' ? ` ${amount}` : '')
            + (v.kind !== 'abstract' && v.qty <= 0 ? '<span class="v4-income-preview-warn">数量为 0，不会进【每周消耗 / 产出】统计</span>' : '');
        };
        overlay.querySelectorAll('[data-f]').forEach(el => {
          el.addEventListener('input', paint);
          el.addEventListener('change', paint);
        });
        paint();
        overlay.querySelector('[data-act="cancel"]').addEventListener('click', () => overlay.remove());
        overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
        overlay.querySelector('[data-act="save"]').addEventListener('click', () => {
          const v = collect();
          if (!v.resource && v.kind !== 'abstract') { showBattleWarning('请填写物资 / 项目名称'); return; }
          if (onSave(v) === false) return;
          overlay.remove();
          _cachedData = null;
          setTimeout(refresh, 80);
        });
      };

      // ---------- 常态收益：编辑 ----------
      // ★ v0.4.07 修复（用户实测反馈问题 3a）：
      //   旧实现里，**手动添加**的收益项点【编辑】保存后完全不生效 ——
      //   v4EditIncome 写的是 incomeEdits[`${seqName}||${idx}`]（手动项 seqName = '__manual__'），
      //   而 v4CollectIncome 的手动项分支**根本不查 edits**，只读 incomeManual 数组本身。
      //   现在：手动项直接改写 incomeManual[idx]（单一真相，不再有两份数据），
      //   并顺手清掉历史上遗留的 incomeEdits['__manual__||N']（避免旧档里那条脏数据又冒出来）。
      window.v4EditIncome = (assetName, key) => {
        const { seqName, idx } = v4ParseIncomeKey(key);
        if (!assetName || !seqName) return;
        const store = v4ReadStore();
        const items = v4CollectIncome(assetName, fetchLatestMvuData()?.核心资产?.[assetName], store);
        const target = items.find(i => i.key === key);
        if (!target) { showBattleWarning('找不到该收益项，请刷新后重试'); return; }
        const isManual = seqName === '__manual__' || target.manual === true;
        const editKey = `${seqName}||${idx}`;
        const current = isManual ? {} : (store.incomeEdits?.[assetName]?.[editKey] || {});
        const fields = {
          resource: current.resource !== undefined ? current.resource : target.resource,
          qty: current.qty !== undefined ? current.qty : target.qty,
          unit: current.unit !== undefined ? current.unit : target.unit,
          polarity: current.polarity !== undefined ? current.polarity : target.polarity,
          kind: current.kind !== undefined ? current.kind : target.kind,
          note: current.note !== undefined ? current.note : (target.note || '')
        };

        const overlay = document.createElement('div');
        overlay.className = 'battle-confirm-overlay v4-dialog';
        overlay.innerHTML = `<div class="battle-confirm-dialog" role="dialog" aria-modal="true" style="max-width:440px">
          <div class="battle-confirm-title"><i class="ri-edit-2-line"></i>编辑常态收益</div>
          <div style="display:flex;flex-direction:column;gap:9px;margin:12px 0">
            ${v4IncomeFormHtml(fields)}
            <div class="inv-hidden-note"><i class="ri-information-line"></i>编辑结果只保存在状态栏自己的扩展存储里，不会改写 MVU 变量，也不会发送给 AI。</div>
          </div>
          <div class="battle-confirm-actions">
            <button class="battle-confirm-btn cancel" type="button" data-act="cancel">取消</button>
            <button class="battle-confirm-btn ok" type="button" data-act="save">保存</button>
          </div>
        </div>`;
        document.body.appendChild(overlay);
        v4BindIncomeForm(overlay, (v) => {
          if (isManual) {
            // 手动项：直接改写 incomeManual[idx] —— 单一真相
            const ok = v4UpdateStore((draft) => {
              const list = draft.incomeManual?.[assetName];
              if (!Array.isArray(list) || !list[idx]) return false;
              list[idx] = Object.assign({}, list[idx], {
                resource: v.resource, name: v.resource, qty: v.qty, unit: v.unit,
                kind: v.kind, polarity: v.polarity, note: v.note
              });
              // 清掉历史遗留的编辑覆盖（旧版把它写在这里，但从来没被读过）
              if (draft.incomeEdits?.[assetName]?.[editKey]) delete draft.incomeEdits[assetName][editKey];
              return true;
            });
            if (!ok) { showBattleWarning('保存失败：该收益项已不存在，请刷新后重试'); return false; }
            return true;
          }
          // 建设序列解析出的项：仍写 incomeEdits（变量不动，只在本地覆盖）
          v4UpdateStore((draft) => {
            if (!draft.incomeEdits[assetName]) draft.incomeEdits[assetName] = {};
            draft.incomeEdits[assetName][editKey] = {
              resource: v.resource, qty: v.qty, unit: v.unit,
              polarity: v.polarity, kind: v.kind, note: v.note
            };
            return true;
          });
          return true;
        });
      };

      // ---------- 常态收益：删除（手动项真删，解析项记入删除名单） ----------
      window.v4DeleteIncome = (assetName, key) => {
        const { seqName, idx } = v4ParseIncomeKey(key);
        if (!assetName) return;
        if (seqName === '__manual__') {
          v4UpdateStore((draft) => {
            const list = draft.incomeManual?.[assetName];
            if (!Array.isArray(list)) return false;
            list.splice(idx, 1);
            // 同位置的编辑覆盖要一起清掉，否则删除后索引前移会串到别的项上
            if (draft.incomeEdits?.[assetName]) delete draft.incomeEdits[assetName][`${seqName}||${idx}`];
            return true;
          });
          _cachedData = null;
          setTimeout(refresh, 80);
          return;
        }
        if (!seqName) return;
        showBattleConfirm(`确定删除该收益项吗？（来源序列：${seqName}）`,
          { title: '删除收益项', okText: '确认删除', cancelText: '取消' })
          .then((confirmed) => {
            if (!confirmed) return;
            v4UpdateStore((draft) => {
              if (!draft.incomeDeleted[assetName]) draft.incomeDeleted[assetName] = {};
              draft.incomeDeleted[assetName][seqName] = true;
              if (draft.incomeHidden?.[assetName]) delete draft.incomeHidden[assetName][seqName];
              return true;
            });
            _cachedData = null;
            setTimeout(refresh, 80);
          });
      };

      // ---------- 常态收益：手动添加（结构化表单） ----------
      // ★ v0.4.07：原来是「让玩家写一句自然语言 → 正则解析」，
      //   只填名称会被归成「抽象收益」，而 UI 完全没说明（用户反馈问题 3b）。
      //   现在改成与【编辑】完全一致的结构化表单 + 实时预览，
      //   玩家填什么就记成什么，彻底摆脱「靠正则猜文本」。
      window.v4AddIncomeManual = (assetName) => {
        if (!assetName) return;
        const overlay = document.createElement('div');
        overlay.className = 'battle-confirm-overlay v4-dialog';
        overlay.innerHTML = `<div class="battle-confirm-dialog" role="dialog" aria-modal="true" style="max-width:440px">
          <div class="battle-confirm-title"><i class="ri-add-line"></i>手动添加常态收益</div>
          <div style="display:flex;flex-direction:column;gap:9px;margin:12px 0">
            ${v4IncomeFormHtml({ resource: '', qty: '', unit: '', polarity: 'produce', kind: 'material', note: '' })}
            <div class="inv-hidden-note"><i class="ri-information-line"></i>按字段填写即可，不需要自己拼「周产铁矿30吨」这类句子；只保存在状态栏扩展存储里，不改写 MVU 变量。若只想记一句没有数量的收益，把【分类】选成「抽象收益」。</div>
          </div>
          <div class="battle-confirm-actions">
            <button class="battle-confirm-btn cancel" type="button" data-act="cancel">取消</button>
            <button class="battle-confirm-btn ok" type="button" data-act="save">添加</button>
          </div>
        </div>`;
        document.body.appendChild(overlay);
        v4BindIncomeForm(overlay, (v) => {
          const ok = v4UpdateStore((draft) => {
            if (!Array.isArray(draft.incomeManual[assetName])) draft.incomeManual[assetName] = [];
            draft.incomeManual[assetName].push({
              resource: v.resource, name: v.resource, qty: v.qty, unit: v.unit,
              kind: v.kind, polarity: v.polarity, note: v.note, srcSeq: ''
            });
            return true;
          });
          if (!ok) { showBattleWarning('添加失败：无法写入扩展存储'); return false; }
          return true;
        });
      };

      // ---------- 资产库存：拆解【经营到期结算】 ----------
      // 结算文本可能同时存在于：① stat_data.待办事件  ② v0.3 的隐藏待办存储
      window.v4InventorySweep = () => {
        const statData = fetchLatestMvuData() || {};
        const assets = statData.核心资产 || {};
        const hiddenMap = getHiddenTodoMap();
        const store = v4ReadStore();
        const swept = store.inventory?.swept || {};
        const found = [];       // { assetName, text, zone }
        const seen = new Set();
        const collect = (assetName, list, zone) => {
          (Array.isArray(list) ? list : []).forEach(text => {
            if (!isAutoSettlementTodo(text)) return;
            const dedup = `${assetName}||${text}`;
            if (seen.has(dedup)) return;
            seen.add(dedup);
            found.push({ assetName, text, zone });
          });
        };
        Object.entries(assets).forEach(([name, asset]) => collect(name, asset?.待办事件, 'visible'));
        Object.entries(hiddenMap).forEach(([name, list]) => collect(name, list, 'hidden'));

        if (found.length === 0) {
          showBattleWarning('没有找到【经营到期结算】待办');
          return;
        }

        const fresh = [];      // 需要并入库存
        const already = [];    // 已并入过，只需从待办里清掉
        found.forEach(item => {
          const hash = v4Hash(`${item.assetName}||${item.text}`);
          const flows = v4ParseSettlement(item.text);
          if (swept[hash]) already.push(Object.assign({ hash }, item));
          else fresh.push(Object.assign({ hash, flows }, item));
        });

        const totalFlowCount = fresh.reduce((n, f) => n + f.flows.length, 0);
        const detail = fresh.length > 0
          ? `将拆解 ${fresh.length} 条结算，解析出 ${totalFlowCount} 项物资变动并入库存。`
          : `这 ${already.length} 条结算此前已经并入过库存，本次只清理待办。`;
        showBattleConfirm(`${detail}${already.length > 0 && fresh.length > 0 ? `另有 ${already.length} 条已入账，将一并清理。` : ''}`,
          { title: '拆解经营到期结算', okText: '确认拆解', cancelText: '取消', variant: 'neutral' })
          .then((confirmed) => {
            if (!confirmed) return;
            // ① 先写库存（备份）
            const stored = v4UpdateStore((draft) => {
              if (!draft.inventory.swept) draft.inventory.swept = {};
              fresh.forEach(f => {
                f.flows.forEach(flow => {
                  const key = `${f.hash}#${v4Hash(flow.name + '|' + flow.unit)}`;
                  draft.inventory.swept[key] = {
                    name: flow.name, unit: flow.unit, kind: flow.kind,
                    signedQty: flow.signedQty, asset: f.assetName, text: f.text, at: v4Today()
                  };
                });
              });
              return true;
            });
            if (!stored) { showBattleWarning('拆解失败：无法写入扩展存储'); return; }
            // ② 再从待办里清掉（可见区 + v0.3 隐藏区）
            const visibleByAsset = {};
            const hiddenByAsset = {};
            found.forEach(f => {
              if (f.zone === 'hidden') (hiddenByAsset[f.assetName] = hiddenByAsset[f.assetName] || []).push(f.text);
              else (visibleByAsset[f.assetName] = visibleByAsset[f.assetName] || []).push(f.text);
            });
            Object.entries(hiddenByAsset).forEach(([assetName, texts]) => {
              updateTodoStore((draft) => {
                const list = draft.hidden?.[assetName];
                if (!Array.isArray(list)) return false;
                texts.forEach(t => { const i = list.indexOf(t); if (i >= 0) list.splice(i, 1); });
                if (list.length === 0) delete draft.hidden[assetName];
                return true;
              });
            });
            applyTodoWrite((mvuData) => {
              let changed = false;
              Object.entries(visibleByAsset).forEach(([assetName, texts]) => {
                const list = mvuData.stat_data?.核心资产?.[assetName]?.待办事件;
                if (!Array.isArray(list)) return;
                mvuData.stat_data.核心资产[assetName].待办事件 = list.filter(t => !texts.includes(t));
                changed = true;
              });
              return changed;
            }).then(() => {
              _cachedData = null;
              setTimeout(refresh, 80);
            });
          });
      };

      // ---------- 资产库存：结算本周（按常态收益产出入库 / 消耗出库） ----------
      window.v4InventorySettleWeek = () => {
        const statData = fetchLatestMvuData() || {};
        const assets = statData.核心资产 || {};
        const store = v4ReadStore();
        const view = v4BuildInventoryView(assets, store);
        const hasFlow = view.produceList.length > 0 || view.consumeList.length > 0 || view.netCurrency !== 0;
        if (!hasFlow) { showBattleWarning('没有可结算的常态收益'); return; }

        showBattleConfirm(`按当前【常态收益】结算一周：入库 ${view.produceList.length} 项产出、出库 ${view.consumeList.length} 项消耗，资金池 ${v4FmtSigned(view.netCurrency)}。`,
          { title: '结算本周', okText: '确认结算', cancelText: '取消', variant: 'neutral' })
          .then((confirmed) => {
            if (!confirmed) return;
            const ok = v4UpdateStore((draft) => {
              const items = draft.inventory.items || (draft.inventory.items = {});
              const bump = (name, qty, unit) => {
                if (!name) return;
                if (!items[name]) items[name] = { qty: 0, unit: unit || '', note: '' };
                items[name].qty = v4Num(items[name].qty, 0) + qty;
                if (!items[name].unit && unit) items[name].unit = unit;
                if (Math.abs(items[name].qty) < 1e-9) delete items[name];
              };
              view.produceList.forEach(f => bump(f.name, f.qty, f.unit));
              view.consumeList.forEach(f => bump(f.name, -f.qty, f.unit));
              draft.inventory.pool = v4Num(draft.inventory.pool, 0) + view.netCurrency;
              return true;
            });
            if (!ok) { showBattleWarning('结算失败：无法写入扩展存储'); return; }
            _cachedData = null;
            setTimeout(refresh, 80);
          });
      };

      // ---------- 资产库存：条目增删改 ----------
      window.v4InvAddItem = () => {
        const overlay = document.createElement('div');
        overlay.className = 'battle-confirm-overlay v4-dialog';
        overlay.innerHTML = `<div class="battle-confirm-dialog" role="dialog" aria-modal="true" style="max-width:420px">
          <div class="battle-confirm-title"><i class="ri-add-line"></i>添加库存条目</div>
          <div style="display:flex;flex-direction:column;gap:9px;margin:12px 0">
            <label style="font-size:0.74rem;font-weight:700;color:var(--v4-sub)">物资名称
              <input class="v4-input" data-f="name" placeholder="如：铁矿" style="margin-top:4px">
            </label>
            <div style="display:flex;gap:9px">
              <label style="flex:1;font-size:0.74rem;font-weight:700;color:var(--v4-sub)">数量
                <input class="v4-input" data-f="qty" type="number" step="any" value="0" style="margin-top:4px">
              </label>
              <label style="flex:1;font-size:0.74rem;font-weight:700;color:var(--v4-sub)">单位
                <input class="v4-input" data-f="unit" placeholder="吨 / 单位" style="margin-top:4px">
              </label>
            </div>
            <label style="font-size:0.74rem;font-weight:700;color:var(--v4-sub)">备注
              <input class="v4-input" data-f="note" placeholder="可选" style="margin-top:4px">
            </label>
          </div>
          <div class="battle-confirm-actions">
            <button class="battle-confirm-btn cancel" type="button" data-act="cancel">取消</button>
            <button class="battle-confirm-btn ok" type="button" data-act="save">添加</button>
          </div>
        </div>`;
        document.body.appendChild(overlay);
        const close = () => overlay.remove();
        overlay.querySelector('[data-act="cancel"]').addEventListener('click', close);
        overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });
        overlay.querySelector('[data-act="save"]').addEventListener('click', () => {
          const name = v4Text(overlay.querySelector('[data-f="name"]').value);
          if (!name) { showBattleWarning('物资名称不能为空'); return; }
          const qty = v4Num(overlay.querySelector('[data-f="qty"]').value, 0);
          const unit = v4Text(overlay.querySelector('[data-f="unit"]').value);
          const note = v4Text(overlay.querySelector('[data-f="note"]').value);
          v4UpdateStore((draft) => {
            if (!draft.inventory.items[name]) draft.inventory.items[name] = { qty: 0, unit, note };
            draft.inventory.items[name].qty = v4Num(draft.inventory.items[name].qty, 0) + qty;
            if (unit) draft.inventory.items[name].unit = unit;
            if (note) draft.inventory.items[name].note = note;
            return true;
          });
          close();
          _cachedData = null;
          setTimeout(refresh, 80);
        });
      };

      // 编辑库存条目。
      // v0.4.02 之前的错误：只认 inventory.items，于是【拆解结算】累计出来的物资
      // （存在 inventory.swept 里）完全无法编辑、也无法分组 —— 玩家被卡死。
      // 现在统一放开：任何出现在库存表里的物资都能改名 / 改数量 / 改单位 / 归组 / 写备注。
      // 保存时把最终数量写进 items（视为手动记账基准），并清掉该物资名下的 swept 流水，
      // 这样「结算累计 + 手动基准」不会重复叠加。
      window.v4InvEditItem = (name) => {
        if (!name) return;
        const store = v4ReadStore();
        const manualItem = store.inventory?.items?.[name];
        const swept = store.inventory?.swept || {};
        const sweptTotal = Object.values(swept)
          .filter(r => r && r.name === name)
          .reduce((n, r) => n + v4Num(r.signedQty, 0), 0);
        const sweptCount = Object.values(swept).filter(r => r && r.name === name).length;
        const onlySwept = !manualItem && sweptCount > 0;
        const currentQty = manualItem ? v4Num(manualItem.qty, 0) : sweptTotal;
        const currentUnit = manualItem?.unit || (Object.values(swept).find(r => r && r.name === name)?.unit) || '';
        const currentNote = manualItem?.note || '';
        const groups = Array.isArray(store.inventory?.groups) ? store.inventory.groups : [];
        const currentGroup = store.inventory?.groupOf?.[name] || '';

        const overlay = document.createElement('div');
        overlay.className = 'battle-confirm-overlay v4-dialog';
        overlay.innerHTML = `<div class="battle-confirm-dialog" role="dialog" aria-modal="true" style="max-width:440px">
          <div class="battle-confirm-title"><i class="ri-edit-2-line"></i>编辑库存条目</div>
          <div style="display:flex;flex-direction:column;gap:9px;margin:12px 0">
            <label style="font-size:0.74rem;font-weight:700;color:var(--v4-sub)">物资名称
              <input class="v4-input" data-f="name" value="${v4Attr(name)}" style="margin-top:4px">
            </label>
            <div style="display:flex;gap:9px">
              <label style="flex:1;font-size:0.74rem;font-weight:700;color:var(--v4-sub)">数量
                <input class="v4-input" data-f="qty" type="number" step="any" value="${v4Attr(currentQty)}" style="margin-top:4px">
              </label>
              <label style="flex:1;font-size:0.74rem;font-weight:700;color:var(--v4-sub)">单位
                <input class="v4-input" data-f="unit" value="${v4Attr(currentUnit)}" style="margin-top:4px">
              </label>
            </div>
            <label style="font-size:0.74rem;font-weight:700;color:var(--v4-sub)">分组（仅影响显示，不改变变量）
              <select class="v4-input" data-f="group" style="margin-top:4px">
                <option value="">未分组</option>
                ${groups.map(g => `<option value="${v4Attr(g.name)}"${currentGroup === g.name ? ' selected' : ''}>${v4Esc(g.name)}</option>`).join('')}
              </select>
            </label>
            <label style="font-size:0.74rem;font-weight:700;color:var(--v4-sub)">备注
              <input class="v4-input" data-f="note" value="${v4Attr(currentNote)}" placeholder="可选" style="margin-top:4px">
            </label>
            ${onlySwept ? `<div class="inv-hidden-note"><i class="ri-information-line"></i>该物资目前只来自【拆解结算】（累计 ${v4FmtSigned(sweptTotal)}${currentUnit ? ' ' + v4Esc(currentUnit) : ''}，${sweptCount} 条流水）。保存后会把它转成手动记账基准，数量以你填写的为准。</div>` : ''}
          </div>
          <div class="battle-confirm-actions">
            <button class="battle-confirm-btn cancel" type="button" data-act="cancel">取消</button>
            <button class="battle-confirm-btn ok" type="button" data-act="save">保存</button>
          </div>
        </div>`;
        document.body.appendChild(overlay);
        const close = () => overlay.remove();
        overlay.querySelector('[data-act="cancel"]').addEventListener('click', close);
        overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });
        overlay.querySelector('[data-act="save"]').addEventListener('click', () => {
          const newName = v4Text(overlay.querySelector('[data-f="name"]').value);
          if (!newName) { showBattleWarning('物资名称不能为空'); return; }
          const qty = v4Num(overlay.querySelector('[data-f="qty"]').value, 0);
          const unit = v4Text(overlay.querySelector('[data-f="unit"]').value);
          const note = v4Text(overlay.querySelector('[data-f="note"]').value);
          const group = v4Text(overlay.querySelector('[data-f="group"]').value);
          v4UpdateStore((draft) => {
            const items = draft.inventory.items || (draft.inventory.items = {});
            const sweptMap = draft.inventory.swept || (draft.inventory.swept = {});
            // 改名时先清掉旧名的手动基准，避免留下幽灵条目
            if (newName !== name && items[name]) delete items[name];
            items[newName] = { qty, unit, note };
            // 清掉新旧名下的结算流水：数量已由玩家确认，不能再次叠加
            Object.keys(sweptMap).forEach(k => {
              const rec = sweptMap[k];
              if (rec && (rec.name === name || rec.name === newName)) delete sweptMap[k];
            });
            if (!draft.inventory.groupOf) draft.inventory.groupOf = {};
            if (newName !== name) delete draft.inventory.groupOf[name];
            if (group) draft.inventory.groupOf[newName] = group;
            else delete draft.inventory.groupOf[newName];
            // 投影状态跟着改名走，避免旧名留下幽灵「已隐藏」条目
            const hiddenMap = draft.inventory.hiddenItems || (draft.inventory.hiddenItems = {});
            if (newName !== name && hiddenMap[name] === true) {
              delete hiddenMap[name];
              hiddenMap[newName] = true;
            }
            return true;
          });
          close();
          _cachedData = null;
          setTimeout(refresh, 80);
        });
      };

      window.v4InvDeleteItem = (name) => {
        if (!name) return;
        showBattleConfirm(`确定从库存中删除「${name}」吗？（结算累计的份额也会一并清除）`,
          { title: '删除库存条目', okText: '确认删除', cancelText: '取消' })
          .then((confirmed) => {
            if (!confirmed) return;
            v4UpdateStore((draft) => {
              if (draft.inventory.items?.[name]) delete draft.inventory.items[name];
              if (draft.inventory.groupOf?.[name]) delete draft.inventory.groupOf[name];
              if (draft.inventory.hiddenItems?.[name]) delete draft.inventory.hiddenItems[name];
              const swept = draft.inventory.swept || {};
              Object.keys(swept).forEach(k => { if (swept[k]?.name === name) delete swept[k]; });
              return true;
            });
            _cachedData = null;
            setTimeout(refresh, 80);
          });
      };

      // ★ v0.4.07 新增（用户实测反馈问题 2）：
      //   用户原话：「【当前库存】中能多选了，功能也大多正常，
      //             但少了一个多选后进行删除的按钮，再更新一下。」
      //   确认属实 —— 这个入口从来就没做。这里复用 v4InvDeleteItem 的「清理四件套」
      //   （inventory.items / groupOf / hiddenItems / swept），一次删掉整批选中的物资。
      window.v4InvDeleteSelected = () => {
        const names = Array.from(v4InvSelected());
        if (names.length === 0) { showBattleWarning('请先点选或框选物资'); return; }
        const preview = names.slice(0, 5).join('、');
        const more = names.length > 5 ? ` 等 ${names.length} 项` : '';
        showBattleConfirm(`确定从库存中删除这 ${names.length} 项物资吗？（${preview}${more}；结算累计的份额也会一并清除）`,
          { title: '整批删除库存条目', okText: `确认删除 ${names.length} 项`, cancelText: '取消' })
          .then((confirmed) => {
            if (!confirmed) return;
            const removed = names.slice();
            const ok = v4UpdateStore((draft) => {
              const items = draft.inventory.items || {};
              const groupOf = draft.inventory.groupOf || {};
              const hidden = draft.inventory.hiddenItems || {};
              const swept = draft.inventory.swept || {};
              removed.forEach(name => {
                if (items[name]) delete items[name];
                if (groupOf[name]) delete groupOf[name];
                if (hidden[name]) delete hidden[name];
                Object.keys(swept).forEach(k => { if (swept[k]?.name === name) delete swept[k]; });
              });
              return true;
            });
            if (!ok) { showBattleWarning('整批删除失败：无法写入扩展存储'); return; }
            v4InvClearSelection();
            showV4Toast(`已从库存中删除 ${removed.length} 项物资`);
            _cachedData = null;
            setTimeout(refresh, 80);
          });
      };

      // ---------- 资产库存：分组 ----------
      window.v4InvAddGroup = () => {
        showInputDialog('新建物资分组', {
          title: '新建分组', placeholder: '例：矿石 / 药材 / 军需 / 杂项',
          okText: '创建', cancelText: '取消', maxLength: 20
        }).then(({ confirmed, value }) => {
          if (!confirmed) return;
          const name = v4Text(value);
          if (!name) return;
          v4UpdateStore((draft) => {
            if (!Array.isArray(draft.inventory.groups)) draft.inventory.groups = [];
            if (draft.inventory.groups.some(g => g.name === name)) return false;
            const idx = draft.inventory.groups.length;
            draft.inventory.groups.push({ name, color: V4_GROUP_COLORS[idx % V4_GROUP_COLORS.length] });
            return true;
          });
          _cachedData = null;
          setTimeout(refresh, 80);
        });
      };
      window.v4InvRenameGroup = (groupName) => {
        if (!groupName) return;
        showInputDialog(`重命名分组「${groupName}」`, {
          title: '重命名分组', defaultValue: groupName, okText: '保存', cancelText: '取消', maxLength: 20
        }).then(({ confirmed, value }) => {
          if (!confirmed) return;
          const name = v4Text(value);
          if (!name || name === groupName) return;
          v4UpdateStore((draft) => {
            const g = (draft.inventory.groups || []).find(x => x.name === groupName);
            if (g) g.name = name;
            const map = draft.inventory.groupOf || {};
            Object.keys(map).forEach(k => { if (map[k] === groupName) map[k] = name; });
            return true;
          });
          _cachedData = null;
          setTimeout(refresh, 80);
        });
      };
      window.v4InvDeleteGroup = (groupName) => {
        if (!groupName) return;
        v4UpdateStore((draft) => {
          draft.inventory.groups = (draft.inventory.groups || []).filter(g => g.name !== groupName);
          const map = draft.inventory.groupOf || {};
          Object.keys(map).forEach(k => { if (map[k] === groupName) delete map[k]; });
          return true;
        });
        _cachedData = null;
        setTimeout(refresh, 80);
      };

      // ---------- 资产库存：投影（【显示】/【隐藏】= 是否写进变量） ----------
      // ★ v0.4.04 语义纠正：
      //    【隐藏】= 从变量里拿掉（变量管理器与 AI 都看不到），**不是**从玩家眼前拿掉。
      //    玩家界面始终显示内容（虚化），计算与拆解照常后台运转。
      //    真正的同步动作由 refresh() 里的 v4SyncInventoryProjection() 统一执行。
      //
      // 写投影状态时统一走这里，保证 shownSections / hiddenItems 结构一致
      const v4WithInvProjection = (mutator) => {
        const ok = v4UpdateStore((draft) => {
          if (!Array.isArray(draft.inventory.shownSections)) draft.inventory.shownSections = [];
          if (!draft.inventory.hiddenItems || typeof draft.inventory.hiddenItems !== 'object') draft.inventory.hiddenItems = {};
          return mutator(draft.inventory) === false ? false : true;
        });
        if (ok) {
          _cachedData = null;
          setTimeout(refresh, 80);
        }
        return ok;
      };

      // 区块级【显示】/【隐藏】（当前库存 / 每周消耗 / 每周产出 / 净总结）
      window.v4InvToggleSectionHidden = (id) => {
        if (!id) return;
        v4WithInvProjection((inv) => {
          const list = inv.shownSections;
          const i = list.indexOf(id);
          if (i >= 0) list.splice(i, 1); else list.push(id);
        });
      };

      // 单项物资【隐藏】/【恢复】（物资级例外：区块已显示时，把个别项从变量里摘掉）
      window.v4InvToggleItemVisible = (name) => {
        const key = v4Text(name);
        if (!key) return;
        v4WithInvProjection((inv) => {
          if (inv.hiddenItems[key] === true) delete inv.hiddenItems[key];
          else inv.hiddenItems[key] = true;
        });
      };

      // 整组【隐藏】/【恢复】：
      // 组内只要还有「没被单独隐藏」的，就整组隐藏；否则整组恢复（一次点完，符合直觉）
      window.v4InvToggleGroupVisible = (groupName) => {
        const key = groupName === undefined || groupName === null ? '' : String(groupName);
        const store = v4ReadStore();
        const view = v4BuildInventoryView(fetchLatestMvuData()?.核心资产 || {}, store);
        const names = view.stockList
          .filter(c => (view.groupOf[c.name] || '') === key)
          .map(c => c.name);
        if (names.length === 0) { showBattleWarning('该分组里没有物资'); return; }
        const hidden = store.inventory?.hiddenItems || {};
        const allHidden = names.every(n => hidden[n] === true);
        v4WithInvProjection((inv) => {
          names.forEach(n => {
            if (allHidden) delete inv.hiddenItems[n];
            else inv.hiddenItems[n] = true;
          });
        });
      };

      // 批量把若干物资移入分组（拖拽 / 框选拖拽共用）
      window.v4InvMoveItemsToGroup = (names, groupName) => {
        const list = (Array.isArray(names) ? names : [names]).map(v4Text).filter(Boolean);
        if (list.length === 0) return;
        const target = groupName === undefined || groupName === null ? '' : String(groupName);
        const store = v4ReadStore();
        // 目标分组必须真实存在（'' = 未分组），否则拒绝，避免造出幽灵分组
        if (target && !(store.inventory?.groups || []).some(g => g.name === target)) return;
        const changed = list.filter(n => (store.inventory?.groupOf?.[n] || '') !== target);
        if (changed.length === 0) return;
        const ok = v4UpdateStore((draft) => {
          if (!draft.inventory.groupOf) draft.inventory.groupOf = {};
          changed.forEach(n => {
            if (target) draft.inventory.groupOf[n] = target;
            else delete draft.inventory.groupOf[n];
          });
          return true;
        });
        if (ok) {
          showV4Toast(`已把 ${changed.length} 项物资移入「${target || '未分组'}」`);
          _cachedData = null;
          setTimeout(refresh, 80);
        }
      };

      window.v4InvToggleSectionCollapsed = (id) => {
        if (!id) return;
        v4UpdateStore((draft) => {
          const list = Array.isArray(draft.inventory.collapsedSections) ? draft.inventory.collapsedSections : (draft.inventory.collapsedSections = []);
          const i = list.indexOf(id);
          if (i >= 0) list.splice(i, 1); else list.push(id);
          return true;
        });
        _cachedData = null;
        setTimeout(refresh, 80);
      };
      window.v4InvToggleGroupCollapsed = (name) => {
        // 渲染时用的是 '' 表示未分组，这里保持一致，避免出现两套键
        const key = name === undefined || name === null ? '' : String(name);
        v4UpdateStore((draft) => {
          const list = Array.isArray(draft.inventory.collapsedGroups) ? draft.inventory.collapsedGroups : (draft.inventory.collapsedGroups = []);
          const i = list.indexOf(key);
          if (i >= 0) list.splice(i, 1); else list.push(key);
          return true;
        });
        _cachedData = null;
        setTimeout(refresh, 80);
      };
      window.v4InvToggleOpen = () => {
        v4UpdateStore((draft) => {
          draft.inventory.open = draft.inventory.open !== true;
          return true;
        });
        _cachedData = null;
        setTimeout(refresh, 60);
      };
      window.v4InvEditPool = () => {
        const store = v4ReadStore();
        showInputDialog('设置资产资金池（手动记账值）', {
          title: '调整资金池',
          placeholder: '直接填入当前通用币总额',
          defaultValue: String(v4Num(store.inventory?.pool, 0)),
          okText: '保存', cancelText: '取消', maxLength: 18
        }).then(({ confirmed, value }) => {
          if (!confirmed) return;
          const n = Number(v4Text(value).replace(/[^\d.\-]/g, ''));
          if (!Number.isFinite(n)) { showBattleWarning('请输入有效数字'); return; }
          v4UpdateStore((draft) => { draft.inventory.pool = n; return true; });
          _cachedData = null;
          setTimeout(refresh, 80);
        });
      };
      window.v4InvAddManualFlow = (polarity) => {
        const isConsume = polarity === 'consume';
        showInputDialog(isConsume ? '手动添加一条每周消耗' : '手动添加一条每周产出', {
          title: isConsume ? '加消耗' : '加产出',
          placeholder: '例：木材5单位',
          okText: '添加', cancelText: '取消', maxLength: 60
        }).then(({ confirmed, value }) => {
          if (!confirmed) return;
          const text = v4Text(value);
          if (!text) return;
          const flow = v4ExtractFlow(text);
          if (!flow || !flow.resource || !(flow.qty > 0)) { showBattleWarning('无法解析，请写明数量与物资'); return; }
          v4UpdateStore((draft) => {
            const key = isConsume ? 'manualConsume' : 'manualProduce';
            if (!Array.isArray(draft.inventory[key])) draft.inventory[key] = [];
            draft.inventory[key].push({ key: `${key}-${Date.now()}`, name: flow.resource, qty: flow.qty, unit: flow.unit || '', note: text });
            return true;
          });
          _cachedData = null;
          setTimeout(refresh, 80);
        });
      };
      window.v4InvDeleteManualFlow = (polarity, key) => {
        v4UpdateStore((draft) => {
          const listKey = polarity === 'consume' ? 'manualConsume' : 'manualProduce';
          const list = draft.inventory[listKey];
          if (!Array.isArray(list)) return false;
          const i = list.findIndex(x => x.key === key);
          if (i < 0) return false;
          list.splice(i, 1);
          return true;
        });
        _cachedData = null;
        setTimeout(refresh, 80);
      };

      // ---------- 科技树内置页面 ----------
      let _v4TechTreeAsset = null;
      let _v4TechTreeDetail = null;

      window.v4OpenTechTree = (assetName) => {
        _v4TechTreeAsset = assetName || null;
        _v4TechTreeDetail = null;
        v4SyncTechTreeOverlay(true);
      };
      window.v4CloseTechTree = () => {
        _v4TechTreeAsset = null;
        _v4TechTreeDetail = null;
        const el = document.querySelector('.techtree-overlay');
        if (el) el.remove();
      };
      window.v4SyncTechTreeOverlay = (force) => {
        const existing = document.querySelector('.techtree-overlay');
        if (!_v4TechTreeAsset) { if (existing) existing.remove(); return; }
        const data = fetchLatestMvuData() || {};
        const asset = data.核心资产?.[_v4TechTreeAsset];
        if (!asset) { if (existing) existing.remove(); _v4TechTreeAsset = null; return; }
        if (existing && !force) {
          // 保持滚动位置与已打开的浮层，只刷新画布内容
          const canvas = existing.querySelector('[data-tree-canvas]');
          const scrollLeft = canvas ? canvas.scrollLeft : 0;
          const scrollTop = canvas ? canvas.scrollTop : 0;
          const bgPanelOpen = existing.querySelector('[data-tree-bg-panel-body]')?.style.display !== 'none';
          existing.remove();
          v4MountTechTree(_v4TechTreeAsset, asset, { scrollLeft, scrollTop, bgPanelOpen });
          return;
        }
        if (existing) existing.remove();
        v4MountTechTree(_v4TechTreeAsset, asset, {});
      };
      const v4MountTechTree = (assetName, asset, opts) => {
        const store = v4ReadStore();
        const nowOrdinal = v4CurrentWorldOrdinal();
        const html = v4RenderTechTree(assetName, asset, store, nowOrdinal);
        const wrap = document.createElement('div');
        wrap.innerHTML = html;
        const overlay = wrap.firstElementChild;
        if (!overlay) return;
        document.body.appendChild(overlay);
        if (opts.bgPanelOpen) {
          const panel = overlay.querySelector('[data-tree-bg-panel-body]');
          if (panel) panel.style.display = 'flex';
        }
        const canvas = overlay.querySelector('[data-tree-canvas]');
        if (canvas && (opts.scrollLeft || opts.scrollTop)) {
          canvas.scrollLeft = opts.scrollLeft || 0;
          canvas.scrollTop = opts.scrollTop || 0;
        }
        // 恢复详情抽屉
        if (_v4TechTreeDetail) v4ShowNodeDetail(_v4TechTreeDetail);
        // 点击遮罩关闭（关闭按钮由 document 级委托处理）
        overlay.addEventListener('click', (e) => {
          if (e.target === overlay) window.v4CloseTechTree();
        });
      };

      const v4ShowNodeDetail = (projName) => {
        const overlay = document.querySelector('.techtree-overlay');
        if (!overlay || !_v4TechTreeAsset) return;
        const detail = overlay.querySelector('[data-tree-detail]');
        if (!detail) return;
        const store = v4ReadStore();
        const asset = fetchLatestMvuData()?.核心资产?.[_v4TechTreeAsset];
        const set = v4CollectProjects(_v4TechTreeAsset, asset, store);
        const found = set.visible.concat(set.archived, set.hidden).find(p => p.name === projName);
        if (!found) { detail.style.display = 'none'; return; }
        const nowOrdinal = v4CurrentWorldOrdinal();
        const progress = v4ComputeProgress(found, nowOrdinal);
        const st = v4ProjectStateLabel(found, progress);
        const isArchived = set.archived.some(p => p.name === projName);
        const isHidden = set.hidden.some(p => p.name === projName);
        const rows = [
          ['状态', `<span class="v4-chip ${st.chip}">${v4Esc(st.text)}</span>`],
          ['分支', v4Esc(found.branch || '—')],
          ['开始', v4Esc(found.start || '未定')],
          ['结束', v4Esc(found.end || '未定')],
          ['进度', `${Math.round(progress.ratio * 100)}%${progress.mode === 'manual' ? '（AI 维护）' : '（按日期计算）'}`],
          found.output ? ['产出', v4Esc(found.output)] : null,
          found.note ? ['备注', v4Esc(found.note)] : null,
          found.pre.length ? ['前置', v4Esc(found.pre.join('、'))] : null
        ].filter(Boolean);
        detail.innerHTML = `<div class="techtree-detail-title">${v4Esc(found.name)}</div>
          ${found.desc ? `<div class="techtree-detail-row"><span class="k">描述</span><span class="v">${v4Esc(found.desc)}</span></div>` : ''}
          ${rows.map(([k, v]) => `<div class="techtree-detail-row"><span class="k">${k}</span><span class="v">${v}</span></div>`).join('')}
          <div class="techtree-detail-actions">
            ${isArchived
            ? `<button class="v4-btn" type="button" data-node-unarchive="${v4Attr(found.name)}" data-asset="${v4Attr(_v4TechTreeAsset)}"><i class="ri-arrow-go-back-line"></i>恢复</button>`
            : (isHidden
              ? `<button class="v4-btn" type="button" data-node-show="${v4Attr(found.name)}" data-asset="${v4Attr(_v4TechTreeAsset)}"><i class="ri-eye-line"></i>显示</button>`
              : `<button class="v4-btn" type="button" data-node-hide="${v4Attr(found.name)}" data-asset="${v4Attr(_v4TechTreeAsset)}"><i class="ri-eye-off-line"></i>隐藏</button>`)}
            <button class="v4-btn is-danger" type="button" data-node-delete="${v4Attr(found.name)}" data-asset="${v4Attr(_v4TechTreeAsset)}"><i class="ri-delete-bin-line"></i>删除</button>
            <button class="v4-btn" type="button" data-tree-detail-close="1"><i class="ri-close-line"></i>收起</button>
          </div>`;
        detail.style.display = 'flex';
      };

      // ==========================================================================
      // 需求 2：分组拖拽 + 鼠标框选多选
      //   · 全部走 document 级委托（app.innerHTML 每 3 秒重建，直接绑元素会被冲掉）
      //   · 拖拽用原生 HTML5 draggable；框选用 mousedown/mousemove/mouseup 画选区
      //   · 落点判定用 getBoundingClientRect 求交，不依赖被重建的 DOM 引用
      // ==========================================================================
      // 选中集合的「影子副本」：DOM 每 3 秒可能重建，重建后靠它把选中状态贴回来
      // （必须先于 v4InvSetSelected 声明，避免 TDZ）
      let _v4SelectionShadow = new Set();
      const v4InvSelected = () => {
        const set = new Set();
        document.querySelectorAll('.inv-cell.is-selected[data-inv-item]').forEach(el => set.add(el.dataset.invItem));
        return set;
      };
      const v4InvSetSelected = (names) => {
        const want = names instanceof Set ? names : new Set(names || []);
        // 记进影子副本：DOM 每 3 秒可能重建，重建后靠它把选中状态贴回来
        _v4SelectionShadow = new Set(want);
        document.querySelectorAll('.inv-cell[data-inv-item]').forEach(el => {
          const on = want.has(el.dataset.invItem);
          el.classList.toggle('is-selected', on);
          const chk = el.querySelector('.inv-cell-check');
          if (chk) chk.className = (on ? 'ri-checkbox-circle-fill' : 'ri-checkbox-blank-circle-line') + ' inv-cell-check';
        });
        const n = want.size;
        const bar = document.querySelector('[data-inv-selbar]');
        if (bar) {
          bar.classList.toggle('is-on', n > 0);
          const cnt = bar.querySelector('[data-inv-selcount]');
          if (cnt) cnt.textContent = String(n);
          const mn = bar.querySelector('[data-inv-move-n]');
          if (mn) mn.textContent = String(n);
        }
      };
      const v4InvClearSelection = () => v4InvSetSelected(new Set());

      // 拖拽中的物资名集合（拖拽期间用全局，因为 DOM 会被重建）
      let _v4DragNames = null;
      // ★ v0.4.05 BUG 1 修复：落点判定不再依赖「分组头那一行」。
      //   渲染层把 data-inv-group-drop 挂到了整个 .inv-group 容器上，
      //   所以 closest() 命中分组头 / 分组内物资 / 分组内空白，都会得到同一个 .inv-group。
      //   → 拖到分组内任意位置都能归组，不必精确对准那一条细线。
      const _v4DropTargets = () => Array.from(document.querySelectorAll('[data-inv-group-drop]'));
      const _v4HitDrop = (event) => {
        if (!(event.target instanceof Element)) return null;
        return event.target.closest('[data-inv-group-drop]');
      };
      // 拖动时给所有分组区域加「亮边界」提示（CSS: body.v4-inv-dragging .inv-group）
      const _v4SetDraggingClass = (on) => document.body.classList.toggle('v4-inv-dragging', !!on);
      // ★ BUG 3 修复（原因 2）：.inv-marquee 挂在 document.body（不在 #app 内），
      //   app.innerHTML 重建清不掉它 → 每 3 秒一次的 refresh 必须兜底清理。
      const v4CleanupMarquee = () => {
        document.querySelectorAll('.inv-marquee').forEach(el => el.remove());
      };
      // DOM 重建后把选中状态贴回来，免得玩家选好的一批物资被一次刷新清空
      //（这也是「交互太累」的一部分：好不容易选好，刷新一下就没了）
      const v4RestoreSelection = () => {
        if (!_v4SelectionShadow || _v4SelectionShadow.size === 0) return;
        const alive = new Set();
        document.querySelectorAll('.inv-cell[data-inv-item]').forEach(el => {
          if (_v4SelectionShadow.has(el.dataset.invItem)) alive.add(el.dataset.invItem);
        });
        _v4SelectionShadow = alive;
        v4InvSetSelected(alive);
      };
      window.__v4CleanupMarquee = v4CleanupMarquee;
      window.__v4RestoreSelection = v4RestoreSelection;

      const v4BindInventoryDnD = () => {
        if (window.__v4InvDnDBound) return;
        window.__v4InvDnDBound = true;

        // ---------- 拖拽开始 ----------
        document.addEventListener('dragstart', (event) => {
          const cell = event.target instanceof Element ? event.target.closest('.inv-cell[data-inv-item]') : null;
          if (!cell) return;
          const name = cell.dataset.invItem;
          if (!name) return;
          // 如果拖的是「已选中的一员」，就整批拖；否则只拖这一个
          const selected = v4InvSelected();
          const names = selected.has(name) ? Array.from(selected) : [name];
          _v4DragNames = names;
          if (event.dataTransfer) {
            event.dataTransfer.effectAllowed = 'move';
            // 某些浏览器不设置 data 就不触发 drop，这里塞个占位
            try { event.dataTransfer.setData('text/plain', names.join('\n')); } catch (e) { }
          }
          document.querySelectorAll('.inv-cell[data-inv-item]').forEach(el => {
            if (names.includes(el.dataset.invItem)) el.classList.add('is-dragging');
          });
          _v4SetDraggingClass(true);
          // ★ BUG 3 修复（原因 1）：原生 HTML5 拖拽会抢走后续的 mouse 事件，
          //   起框那一下若没被拦住，mouseup 就永远不会到 → 方框永久残留。
          //   这里在 dragstart 时无条件兜底收尾。
          abortMarquee();
        });

        document.addEventListener('dragend', () => {
          _v4DragNames = null;
          _v4SetDraggingClass(false);
          document.querySelectorAll('.inv-cell.is-dragging').forEach(el => el.classList.remove('is-dragging'));
          _v4DropTargets().forEach(el => el.classList.remove('is-drop-hover'));
        });

        // ---------- 拖到分组区域（整块 .inv-group 都是落点） ----------
        document.addEventListener('dragover', (event) => {
          if (!_v4DragNames) return;
          const zone = _v4HitDrop(event);
          if (!zone) {
            _v4DropTargets().forEach(el => el.classList.remove('is-drop-hover'));
            return;
          }
          event.preventDefault();          // 必须 preventDefault 才允许 drop
          if (event.dataTransfer) event.dataTransfer.dropEffect = 'move';
          _v4DropTargets().forEach(el => el.classList.toggle('is-drop-hover', el === zone));
        });

        document.addEventListener('dragleave', (event) => {
          const zone = _v4HitDrop(event);
          if (!zone) return;
          // 只在真的离开该分组时才取消高亮（在分组内部移动会连发 dragleave）
          const to = event.relatedTarget instanceof Element ? event.relatedTarget : null;
          if (to && zone.contains(to)) return;
          zone.classList.remove('is-drop-hover');
        });

        document.addEventListener('drop', (event) => {
          const zone = _v4HitDrop(event);
          if (!zone) return;
          event.preventDefault();
          event.stopPropagation();
          const names = _v4DragNames || [];
          _v4DragNames = null;
          _v4SetDraggingClass(false);
          _v4DropTargets().forEach(el => el.classList.remove('is-drop-hover'));
          document.querySelectorAll('.inv-cell.is-dragging').forEach(el => el.classList.remove('is-dragging'));
          if (names.length === 0) return;
          const target = zone.dataset.invGroupDrop || '';
          window.v4InvMoveItemsToGroup(names, target);
          // 归组后给整块区域一个短暂高亮，让玩家确认「东西进去了」
          zone.classList.add('is-flash');
          setTimeout(() => zone.classList.remove('is-flash'), 620);
        });

        // ---------- 鼠标框选 ----------
        // ★ v0.4.05 结构性改进（治本 BUG 2 / BUG 3）：
        //   1. mousedown 只「待命」，不立刻创建方框元素 —— 真正的框要等指针移动超过
        //      阈值才诞生。于是「单纯点一下」永远不会留下任何 DOM 垃圾。
        //   2. 收尾统一走 abortMarquee()：mouseup / dragstart / pointercancel / blur /
        //      Esc / 下一次 mousedown 都会调它，方框必然被移除，不再依赖 mouseup 一定到达。
        //   3. click 委托里用「刚框选完」的时间戳跳过清空，解决松手即被清空。
        const MARQUEE_THRESHOLD = 3;      // 位移超过 3px 才算「真的在框选」
        const CLICK_SKIP_TTL_MS = 600;    // 这一下 click 迟迟不来时，最多挂多久

        let pending = null;    // { x0, y0, base }  —— 已按下，还没形成框
        let box = null;        // { el, x0, y0, base } —— 框已诞生
        let moved = false;
        let lastHit = new Set();
        let lastPointer = null;
        // ★ BUG 2 修复：框选松手后浏览器会补发一个 click，
        //   「点空白处清空选择」会把它当成普通点击 → 把框选结果清掉。
        //   这里记下「下一次 click 要跳过」的时间戳，精确吞掉那一下。
        //   注意只在「真的 mouseup 结束框选」时设置：blur / pointercancel / Esc /
        //   dragstart 这些中止路径后面根本不会来 click，设了反而会误吞用户的下一次点击。
        let clickSkipAt = 0;

        const ensureBox = (event) => {
          if (!pending) return;
          const el = document.createElement('div');
          el.className = 'inv-marquee';
          document.body.appendChild(el);
          box = { el, x0: pending.x0, y0: pending.y0, base: pending.base };
          moved = true;
          lastHit = new Set(pending.base);
          pending = null;
          updateBox(event.clientX, event.clientY);
        };

        const updateBox = (x, y) => {
          if (!box) return;
          const left = Math.min(box.x0, x), top = Math.min(box.y0, y);
          const w = Math.abs(x - box.x0), h = Math.abs(y - box.y0);
          box.el.style.display = 'block';
          box.el.style.left = left + 'px';
          box.el.style.top = top + 'px';
          box.el.style.width = w + 'px';
          box.el.style.height = h + 'px';

          // 命中判定：选区矩形与格子矩形求交
          const rect = { left, top, right: left + w, bottom: top + h };
          const hit = new Set(box.base);
          document.querySelectorAll('.inv-cell[data-inv-item]').forEach(cell => {
            const r = cell.getBoundingClientRect();
            const overlaps = r.left < rect.right && r.right > rect.left && r.top < rect.bottom && r.bottom > rect.top;
            if (overlaps) hit.add(cell.dataset.invItem);
          });
          if (hit.size !== lastHit.size || Array.from(hit).some(n => !lastHit.has(n))) {
            lastHit = hit;
            v4InvSetSelected(hit);
          }
        };

        const onMove = (event) => {
          lastPointer = { x: event.clientX, y: event.clientY };
          if (!pending && !box) return;
          if (pending) {
            const dx = Math.abs(event.clientX - pending.x0);
            const dy = Math.abs(event.clientY - pending.y0);
            if (dx <= MARQUEE_THRESHOLD && dy <= MARQUEE_THRESHOLD) return;  // 还在「点」的范围
            ensureBox(event);
          } else {
            updateBox(event.clientX, event.clientY);
          }
          event.preventDefault();
        };

        // 统一收尾：清理方框 / 取消待命状态。
        //   armClickSkip=true 仅用于「用户真的松手了」（mouseup）——
        //   这时浏览器紧接着会补发一个 click，必须跳过它。
        const finishMarquee = (armClickSkip) => {
          const wasBox = !!box && moved;
          if (box) { box.el.remove(); box = null; }
          pending = null;
          lastHit = new Set();
          moved = false;
          if (armClickSkip && wasBox) clickSkipAt = Date.now();
          return wasBox;
        };
        // 兜底中止（dragstart / pointercancel / blur / Esc / 重新按下）
        const abortMarquee = () => {
          finishMarquee(false);
          v4CleanupMarquee();      // 连历史残留一起扫掉，绝不累积
        };
        const onUp = () => { finishMarquee(true); };
        window.__v4AbortMarquee = abortMarquee;

        document.addEventListener('mousedown', (event) => {
          if (event.button !== 0) return;
          // 任何新的按下都意味着「上一次框选的那一下 click」不可能再来了
          //（真实浏览器里 click 必然紧跟 mouseup，不会跨到下一次按下之后），
          // 所以在这里作废，避免一个过期的标志误吞用户的下一次点击。
          clickSkipAt = 0;
          const target = event.target instanceof Element ? event.target : null;
          if (!target) return;
          // 只在【当前库存】区块内起框选。
          // ★ v0.4.05：起框范围从「.inv-grid」放宽到整个区块 body ——
          //   格子的间距只有 8px，只允许在缝隙里起手太难用了（用户抱怨「交互太累」）。
          //   现在区块内的任何空白（分组边框内、格子之间、区块内边距）都能起框。
          const section = target.closest('.inv-section[data-inv-section="stock"]');
          if (!section) return;
          if (target.closest('button, input, select, textarea, a')) return;
          // ★ BUG 3 修复（原因 1 的正解）：
          //   物资格子本身是 draggable 的 —— 在它上面按下并移动，浏览器会启动
          //   原生拖拽（= 移动物资），mousemove / mouseup 都被抢走，框选根本画不出来，
          //   只留下一个永远等不到 mouseup 的空框。所以「落在格子上」不起框：
          //   格子的用途是「点一下选中」和「拖去分组」，框选请在格子之间的空白处起手。
          if (target.closest('.inv-cell[data-inv-item]')) return;
          // 已经在拖物资时不重复起框
          if (target.closest('.inv-cell.is-dragging')) return;
          // 上一次的框没清干净（异常路径）→ 先清，绝不累积
          abortMarquee();

          const additive = event.ctrlKey || event.metaKey || event.shiftKey;
          const base = additive ? v4InvSelected() : new Set();
          // 注意：这里【不】清空选择 —— 等真正的 click 到来再决定
          //（在 draggable 格子上按下会转成原生拖拽，收不到 click / mouseup，
          //  如果这里就清空，整批拖拽的选中会当场消失）
          pending = { x0: event.clientX, y0: event.clientY, base };
          moved = false;
          lastPointer = { x: event.clientX, y: event.clientY };
          document.addEventListener('mousemove', onMove, true);
          document.addEventListener('mouseup', onUp, true);
        });

        // 指针位置（供调试 / 未来扩展）
        document.addEventListener('mousemove', (event) => {
          lastPointer = { x: event.clientX, y: event.clientY };
        }, true);

        // 兜底：窗口失焦 / 指针取消 / Esc → 收掉方框
        window.addEventListener('blur', abortMarquee);
        document.addEventListener('pointercancel', abortMarquee, true);
        document.addEventListener('keydown', (event) => {
          if (event.key === 'Escape') abortMarquee();
        });

        // ---------- 点选 / 空白处清空 ----------
        document.addEventListener('click', (event) => {
          const target = event.target instanceof Element ? event.target : null;
          if (!target) return;
          // 工具条 / 下拉菜单里的点击一律不参与「清空选择」
          if (target.closest('[data-inv-selbar]')) return;
          if (target.closest('.inv-move-menu')) return;

          // ★ BUG 2 修复：框选结束（mouseup）后浏览器还会补发一个 click，
          //   若此时执行「点空白处清空选择」就会把框选结果一起清掉。
          //   这里精确吞掉紧跟着的那一下 click（只吞一次，不吃掉用户后续点击）。
          if (clickSkipAt) {
            const stale = Date.now() - clickSkipAt > CLICK_SKIP_TTL_MS;
            clickSkipAt = 0;
            if (!stale) return;
          }

          // ★ v0.4.05：点击物资格子 = 切换选中（toggle）
          //   这样即使框选有边界情况，也永远有一条可靠的多选路径。
          const cell = target.closest('.inv-cell[data-inv-item]');
          if (cell) {
            const name = cell.dataset.invItem;
            if (!name) return;
            const additive = event.ctrlKey || event.metaKey || event.shiftKey;
            const next = additive ? v4InvSelected() : new Set();
            if (next.has(name)) next.delete(name); else next.add(name);
            v4InvSetSelected(next);
            return;
          }
          // 落在任何交互控件 / 容器开关上都不算「点空白」
          //（否则点【折叠】【新建分组】会顺手把辛苦选好的一批清掉）
          if (target.closest('button, input, select, textarea, a, label')) return;
          if (target.closest('.inv-group-head, .inv-sec-head, .inv-head, .inv-pool-card')) return;
          if (!target.closest('.inv-panel')) return;
          v4InvClearSelection();
        });

        // ---------- 整批移动下拉（拖拽之外的备用入口） ----------
        document.addEventListener('click', (event) => {
          const target = event.target instanceof Element ? event.target : null;
          if (!target) return;
          const toggle = target.closest('[data-inv-move-toggle]');
          if (toggle) {
            event.preventDefault(); event.stopPropagation();
            const menu = document.querySelector('[data-inv-move-menu]');
            if (menu) menu.classList.toggle('is-open');
            return;
          }
          const pick = target.closest('[data-inv-move-to]');
          if (pick) {
            event.preventDefault(); event.stopPropagation();
            const menu = document.querySelector('[data-inv-move-menu]');
            if (menu) menu.classList.remove('is-open');
            const names = Array.from(v4InvSelected());
            if (names.length === 0) { showBattleWarning('请先点选或框选物资'); return; }
            window.v4InvMoveItemsToGroup(names, pick.dataset.invMoveTo || '');
            return;
          }
          // 点菜单外面 → 收起
          if (!target.closest('[data-inv-move-menu]')) {
            const open = document.querySelector('[data-inv-move-menu].is-open');
            if (open) open.classList.remove('is-open');
          }
        });
      };

      // 框选工具条上的动作（全选当前库存 / 整批移入分组 / 整批显示隐藏 / 取消选择）
      window.v4InvSelectAll = () => {
        const names = Array.from(document.querySelectorAll('.inv-section[data-inv-section="stock"] .inv-cell[data-inv-item]'))
          .map(el => el.dataset.invItem);
        v4InvSetSelected(new Set(names));
        if (names.length === 0) showBattleWarning('当前库存里没有可选的物资');
      };
      window.v4InvClearSelection = () => v4InvClearSelection();
      // 把当前选中的物资整批【隐藏】/【恢复】（对变量投影，不动本地显示）
      window.v4InvToggleSelectedVisible = () => {
        const names = Array.from(v4InvSelected());
        if (names.length === 0) { showBattleWarning('请先框选或点选物资'); return; }
        const hidden = v4ReadStore().inventory?.hiddenItems || {};
        const allHidden = names.every(n => hidden[n] === true);
        v4WithInvProjection((inv) => {
          names.forEach(n => {
            if (allHidden) delete inv.hiddenItems[n];
            else inv.hiddenItems[n] = true;
          });
        });
        showV4Toast(allHidden ? `已把 ${names.length} 项物资恢复进变量` : `已把 ${names.length} 项物资从变量中隐藏`);
      };

      // ---------- 事件委托（统一处理 v0.4 交互） ----------
      // 科技树挂在 body 上（不在 #app 内），所以用 document 级委托，避免被 app.innerHTML 重建冲掉
      const v4BindDelegation = () => {
        if (window.__v4DelegationBound) return;
        window.__v4DelegationBound = true;

        document.addEventListener('click', (event) => {
          const target = event.target instanceof Element ? event.target : null;
          if (!target) return;

          // ---- 长线项目：展开科技树 ----
          const openTree = target.closest('[data-open-techtree]');
          if (openTree) {
            event.preventDefault(); event.stopPropagation();
            window.v4OpenTechTree(openTree.dataset.openTechtree);
            return;
          }
          // ---- 长线项目：资产卡片内的隐藏 / 恢复 / 删除 / 一键隐藏已完成 ----
          const pHide = target.closest('[data-proj-hide]');
          if (pHide) { event.preventDefault(); event.stopPropagation(); window.v4HideProject(pHide.dataset.asset, pHide.dataset.projHide); return; }
          const pUnarch = target.closest('[data-proj-unarchive]');
          if (pUnarch) { event.preventDefault(); event.stopPropagation(); window.v4ShowProject(pUnarch.dataset.asset, pUnarch.dataset.projUnarchive, true); return; }
          const pShow = target.closest('[data-proj-show]');
          if (pShow) { event.preventDefault(); event.stopPropagation(); window.v4ShowProject(pShow.dataset.asset, pShow.dataset.projShow, false); return; }
          const pDel = target.closest('[data-proj-delete]');
          if (pDel) { event.preventDefault(); event.stopPropagation(); window.v4DeleteProject(pDel.dataset.asset, pDel.dataset.projDelete); return; }
          const pHideDone = target.closest('[data-proj-hide-done]');
          if (pHideDone) { event.preventDefault(); event.stopPropagation(); window.v4HideAllDoneProjects(pHideDone.dataset.projHideDone); return; }

          // ---- 常态收益 ----
          const iHide = target.closest('[data-income-hide]');
          if (iHide) { event.preventDefault(); event.stopPropagation(); window.v4HideIncome(iHide.dataset.asset, iHide.dataset.incomeHide); return; }
          const iShow = target.closest('[data-income-show]');
          if (iShow) { event.preventDefault(); event.stopPropagation(); window.v4ShowIncome(iShow.dataset.asset, iShow.dataset.incomeShow); return; }
          const iShowAll = target.closest('[data-income-show-all]');
          if (iShowAll) { event.preventDefault(); event.stopPropagation(); window.v4ShowAllIncome(iShowAll.dataset.incomeShowAll); return; }
          const iEdit = target.closest('[data-income-edit]');
          if (iEdit) { event.preventDefault(); event.stopPropagation(); window.v4EditIncome(iEdit.dataset.asset, iEdit.dataset.incomeEdit); return; }
          const iDel = target.closest('[data-income-del-manual]');
          if (iDel) { event.preventDefault(); event.stopPropagation(); window.v4DeleteIncome(iDel.dataset.asset, iDel.dataset.incomeDelManual); return; }
          const iAdd = target.closest('[data-income-add]');
          if (iAdd) { event.preventDefault(); event.stopPropagation(); window.v4AddIncomeManual(iAdd.dataset.incomeAdd); return; }

          // ---- 资产总库存 ----
          // 顺序很重要：容器级的【折叠】开关挂在 .inv-head / .inv-sec-head 上，
          // 而具体按钮（添加物资 / 隐藏 / 加消耗…）是它们的子元素。
          // 必须先把所有具体按钮判完，最后才判容器折叠，否则点按钮会变成折叠。
          // 框选工具条
          const selAll = target.closest('[data-inv-sel-all]');
          if (selAll) { event.preventDefault(); event.stopPropagation(); window.v4InvSelectAll(); return; }
          const selClear = target.closest('[data-inv-sel-clear]');
          if (selClear) { event.preventDefault(); event.stopPropagation(); window.v4InvClearSelection(); return; }
          const selVis = target.closest('[data-inv-sel-vis]');
          if (selVis) { event.preventDefault(); event.stopPropagation(); window.v4InvToggleSelectedVisible(); return; }
          // ★ v0.4.07：整批删除（必须在容器级折叠之前判，否则点按钮会变成折叠）
          const selDel = target.closest('[data-inv-sel-del]');
          if (selDel) { event.preventDefault(); event.stopPropagation(); window.v4InvDeleteSelected(); return; }
          const secHide = target.closest('[data-inv-sec-hide]');
          if (secHide) { event.preventDefault(); event.stopPropagation(); window.v4InvToggleSectionHidden(secHide.dataset.invSecHide); return; }
          // 单项物资【显示】/【隐藏】（库存格子 / 消耗 / 产出 / 净总结 共用）
          const itemVis = target.closest('[data-inv-item-vis]');
          if (itemVis) { event.preventDefault(); event.stopPropagation(); window.v4InvToggleItemVisible(itemVis.dataset.invItemVis); return; }
          // 整组物资【显示】/【隐藏】
          const groupVis = target.closest('[data-inv-group-vis]');
          if (groupVis) { event.preventDefault(); event.stopPropagation(); window.v4InvToggleGroupVisible(groupVis.dataset.invGroupVis); return; }
          const itemAdd = target.closest('[data-inv-item-add]');
          if (itemAdd) { event.preventDefault(); event.stopPropagation(); window.v4InvAddItem(); return; }
          const groupAdd = target.closest('[data-inv-group-add]');
          if (groupAdd) { event.preventDefault(); event.stopPropagation(); window.v4InvAddGroup(); return; }
          const manualFlow = target.closest('[data-inv-manual-flow]');
          if (manualFlow) { event.preventDefault(); event.stopPropagation(); window.v4InvAddManualFlow(manualFlow.dataset.invManualFlow); return; }
          const manualDel = target.closest('[data-inv-manual-del]');
          if (manualDel) { event.preventDefault(); event.stopPropagation(); window.v4InvDeleteManualFlow(manualDel.dataset.invManualDel, manualDel.dataset.manualKey); return; }
          const itemEdit = target.closest('[data-inv-item-edit]');
          if (itemEdit) { event.preventDefault(); event.stopPropagation(); window.v4InvEditItem(itemEdit.dataset.invItemEdit); return; }
          const itemDel = target.closest('[data-inv-item-del]');
          if (itemDel) { event.preventDefault(); event.stopPropagation(); window.v4InvDeleteItem(itemDel.dataset.invItemDel); return; }
          const groupRen = target.closest('[data-inv-group-rename]');
          if (groupRen) { event.preventDefault(); event.stopPropagation(); window.v4InvRenameGroup(groupRen.dataset.invGroupRename); return; }
          const groupDel = target.closest('[data-inv-group-del]');
          if (groupDel) { event.preventDefault(); event.stopPropagation(); window.v4InvDeleteGroup(groupDel.dataset.invGroupDel); return; }
          const groupToggle = target.closest('[data-inv-group-toggle]');
          if (groupToggle) { event.preventDefault(); event.stopPropagation(); window.v4InvToggleGroupCollapsed(groupToggle.dataset.invGroupToggle); return; }
          const sweep = target.closest('[data-inv-sweep]');
          if (sweep) { event.preventDefault(); event.stopPropagation(); window.v4InventorySweep(); return; }
          const syncWeek = target.closest('[data-inv-sync-week]');
          if (syncWeek) { event.preventDefault(); event.stopPropagation(); window.v4InventorySettleWeek(); return; }
          const poolEdit = target.closest('[data-inv-pool-edit]');
          if (poolEdit) { event.preventDefault(); event.stopPropagation(); window.v4InvEditPool(); return; }
          // 容器级折叠（放最后）
          const secToggle = target.closest('[data-inv-sec-toggle]');
          if (secToggle) { event.preventDefault(); event.stopPropagation(); window.v4InvToggleSectionCollapsed(secToggle.dataset.invSecToggle); return; }
          const invToggle = target.closest('[data-inv-toggle]');
          if (invToggle) { event.preventDefault(); event.stopPropagation(); window.v4InvToggleOpen(); return; }

          // ---- 科技树内部 ----
          const treeClose = target.closest('[data-tree-close]');
          if (treeClose) { event.preventDefault(); event.stopPropagation(); window.v4CloseTechTree(); return; }
          const treeHideDone = target.closest('[data-tree-hide-done]');
          if (treeHideDone) { event.preventDefault(); event.stopPropagation(); window.v4HideAllDoneProjects(_v4TechTreeAsset); return; }
          const treeShowAll = target.closest('[data-tree-show-all]');
          if (treeShowAll) {
            event.preventDefault(); event.stopPropagation();
            const assetName = _v4TechTreeAsset;
            const store = v4ReadStore();
            const names = Object.keys(store.projectHidden?.[assetName] || {}).map(n => ({ n, archived: false }))
              .concat(Object.keys(store.projectArchived?.[assetName] || {}).map(n => ({ n, archived: true })));
            if (names.length === 0) { showBattleWarning('没有已隐藏或已归档的项目'); return; }
            // 逐条写回变量（每条一次写操作，避免并发覆盖）
            const step = (i) => {
              if (i >= names.length) { _cachedData = null; setTimeout(refresh, 80); return; }
              const item = names[i];
              const srcTable = item.archived ? store.projectArchived : store.projectHidden;
              const snap = srcTable?.[assetName]?.[item.n];
              if (snap === undefined) { setTimeout(() => step(i + 1), 20); return; }
              const clone = v4DeepCopy(snap);
              applyTodoWrite((mvuData) => {
                const asset = mvuData.stat_data?.核心资产?.[assetName];
                if (!asset) return false;
                if (!asset.长线项目 || typeof asset.长线项目 !== 'object' || Array.isArray(asset.长线项目)) asset.长线项目 = {};
                asset.长线项目[item.n] = clone === null ? snap : clone;
                return true;
              }).then(() => {
                v4UpdateStore((draft) => {
                  if (draft.projectHidden?.[assetName]) delete draft.projectHidden[assetName][item.n];
                  if (draft.projectArchived?.[assetName]) delete draft.projectArchived[assetName][item.n];
                  // 同【显示】：进保留名单，避免刚恢复就被自动归档again
                  if (!draft.projectKeep) draft.projectKeep = {};
                  if (!draft.projectKeep[assetName]) draft.projectKeep[assetName] = {};
                  draft.projectKeep[assetName][item.n] = true;
                  return true;
                });
                setTimeout(() => step(i + 1), 60);
              });
            };
            step(0);
            return;
          }
          const bgPanelBtn = target.closest('[data-tree-bg-panel]');
          if (bgPanelBtn) {
            event.preventDefault(); event.stopPropagation();
            const panel = document.querySelector('.techtree-overlay [data-tree-bg-panel-body]');
            if (!panel) return;
            const willOpen = panel.style.display === 'none';
            panel.style.display = willOpen ? 'flex' : 'none';
            // 背景面板与详情抽屉都在右侧，同时打开会互相遮挡
            if (willOpen) {
              _v4TechTreeDetail = null;
              const d = document.querySelector('.techtree-overlay [data-tree-detail]');
              if (d) d.style.display = 'none';
            }
            return;
          }
          // 注意：外壳本身带 data-tree-skin 属性，所以这里必须用按钮专属的 data-tree-skin-opt，
          // 否则「节点点击」等任何树内点击都会被这条分支吃掉
          const skinOpt = target.closest('[data-tree-skin-opt]');
          if (skinOpt) {
            event.preventDefault(); event.stopPropagation();
            const skin = skinOpt.dataset.treeSkinOpt;
            v4UpdateStore((draft) => { draft.techTree.skin = skin; return true; });
            const shell = document.querySelector('.techtree-shell');
            if (shell) shell.setAttribute('data-tree-skin', skin);

      const app = document.getElementById('app');
      const VALID_THEMES = new Set(['warm-white', 'dark', 'green', 'classic-dark']);
